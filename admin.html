<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapReview Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#07111f;
  color:#fff;
  padding:20px;
}

button,input{font:inherit}

.container{
  width:100%;
  max-width:1050px;
  margin:auto;
}

.hidden{display:none!important}

.login-wrap{
  min-height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  width:100%;
  max-width:430px;
  background:#0d1b2d;
  border:1px solid rgba(255,255,255,.08);
  border-radius:25px;
  padding:30px;
  box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.logo{
  width:55px;
  height:55px;
  border-radius:17px;
  background:#ffc83d;
  color:#07111f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
  margin-bottom:20px;
}

h1{font-size:27px;margin-bottom:7px}

.subtitle{
  color:#94a3b5;
  font-size:14px;
  line-height:1.5;
  margin-bottom:24px;
}

label{
  display:block;
  color:#aab7c7;
  font-size:12px;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:#07111f;
  color:#fff;
  outline:none;
}

input:focus{border-color:#ffc83d}

.primary{
  border:0;
  background:#ffc83d;
  color:#07111f;
  padding:12px 17px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.primary:disabled{
  opacity:.6;
  cursor:wait;
}

.error{
  color:#ff8585;
  font-size:13px;
  margin-top:12px;
  line-height:1.5;
}

.success{
  color:#62e6a2;
  font-size:13px;
  margin-top:12px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:28px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:#ffc83d;
  color:#07111f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:21px;
}

.brand-name{
  font-size:20px;
  font-weight:800;
}

.brand-sub{
  color:#718298;
  font-size:11px;
  margin-top:2px;
}

.logout{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  color:#dce5ef;
  padding:10px 14px;
  border-radius:11px;
  cursor:pointer;
}

.dashboard-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.dashboard-title h2{
  font-size:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
  gap:17px;
}

.business{
  background:#0d1b2d;
  border:1px solid rgba(255,255,255,.07);
  border-radius:21px;
  padding:20px;
}

.business-head{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:18px;
}

.business-logo{
  width:55px;
  height:55px;
  border-radius:16px;
  background:#132a45;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:23px;
  flex-shrink:0;
}

.business-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.business-name{
  font-size:18px;
  font-weight:800;
}

.info{
  background:rgba(255,255,255,.035);
  padding:11px 12px;
  border-radius:12px;
  margin-bottom:9px;
}

.info-label{
  color:#718298;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:4px;
}

.info-value{
  color:#dce5ef;
  font-size:12px;
  word-break:break-all;
}

.cards-head{
  display:flex;
  justify-content:space-between;
  margin:17px 0 9px;
}

.cards-head strong{font-size:13px}
.count{color:#ffc83d;font-size:12px}

.card-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:rgba(0,0,0,.16);
  padding:10px;
  border-radius:11px;
  margin-top:6px;
}

.card-code{
  font-family:monospace;
  font-weight:800;
  font-size:13px;
}

.status{
  font-size:10px;
  margin-top:3px;
}

.active{color:#62e6a2}
.inactive{color:#ff8585}

.actions{
  display:flex;
  gap:5px;
}

.small{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  color:#fff;
  padding:7px 9px;
  border-radius:8px;
  cursor:pointer;
  font-size:11px;
}

.full{
  width:100%;
  margin-top:12px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:480px;
  max-height:90vh;
  overflow:auto;
  background:#0d1b2d;
  border:1px solid rgba(255,255,255,.08);
  border-radius:23px;
  padding:24px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{font-size:20px}

.close{
  border:0;
  background:rgba(255,255,255,.06);
  color:white;
  width:34px;
  height:34px;
  border-radius:9px;
  cursor:pointer;
  font-size:20px;
}

.modal-actions{
  display:flex;
  gap:9px;
  margin-top:20px;
}

.modal-actions>*{flex:1}

.secondary{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:white;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#718298;
  padding:60px 20px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,20px);
  background:#142a42;
  border:1px solid rgba(255,255,255,.1);
  padding:12px 17px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:99;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:600px){
  body{padding:13px}
  .dashboard-title{
    flex-direction:column;
    align-items:stretch
  }
  .dashboard-title .primary{
    width:100%
  }
  header{
    align-items:flex-start
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-wrap">

  <div class="box">

    <div class="logo">★</div>

    <h1>TapReview</h1>

    <p class="subtitle">
      Admin Dashboard<br>
      Sign in to manage your businesses and cards.
    </p>

    <label>Email</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Your admin email"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Your password"
    >

    <button
      id="loginButton"
      class="primary"
      style="width:100%;margin-top:18px"
      type="button"
    >
      Sign in
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="container hidden">

  <header>

    <div class="brand">

      <div class="brand-logo">★</div>

      <div>
        <div class="brand-name">
          TapReview
        </div>

        <div class="brand-sub">
          Admin Dashboard
        </div>
      </div>

    </div>

    <button
      id="logoutButton"
      class="logout"
    >
      Log out
    </button>

  </header>


  <div class="dashboard-title">

    <h2>Your businesses</h2>

    <button
      id="addBusinessButton"
      class="primary"
    >
      + Add business
    </button>

  </div>


  <div
    id="businessGrid"
    class="grid"
  ></div>

</div>


<!-- BUSINESS MODAL -->

<div id="businessModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="businessModalTitle">
        Add business
      </h2>

      <button
        id="closeBusiness"
        class="close"
      >
        ×
      </button>

    </div>

    <label>Business name *</label>

    <input
      id="businessName"
      type="text"
      placeholder="Restaurant name"
    >

    <label>Logo URL</label>

    <input
      id="logoUrl"
      type="url"
      placeholder="https://..."
    >

    <label>Google review URL</label>

    <input
      id="googleUrl"
      type="url"
      placeholder="https://g.page/..."
    >

    <label>WhatsApp number</label>

    <input
      id="whatsapp"
      type="text"
      placeholder="0555123456"
    >

    <label>Primary color</label>

    <input
      id="primaryColor"
      type="text"
      value="#0d1b2d"
      placeholder="#0d1b2d"
    >

    <div id="businessError"></div>

    <div class="modal-actions">

      <button
        id="cancelBusiness"
        class="secondary"
      >
        Cancel
      </button>

      <button
        id="saveBusiness"
        class="primary"
      >
        Save business
      </button>

    </div>

  </div>

</div>


<!-- CARD MODAL -->

<div id="cardModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>Create card</h2>

      <button
        id="closeCard"
        class="close"
      >
        ×
      </button>

    </div>

    <p
      id="cardBusiness"
      style="
        color:#94a3b5;
        font-size:13px;
        margin-bottom:15px;
      "
    ></p>

    <label>Card code</label>

    <input
      id="cardCode"
      type="text"
      placeholder="TR-XXXXXX"
    >

    <div id="cardError"></div>

    <div class="modal-actions">

      <button
        id="cancelCard"
        class="secondary"
      >
        Cancel
      </button>

      <button
        id="saveCard"
        class="primary"
      >
        Create card
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let editingBusinessId = null;
let selectedBusinessId = null;


const loginScreen =
  document.getElementById("loginScreen");

const dashboard =
  document.getElementById("dashboard");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");

const businessGrid =
  document.getElementById("businessGrid");


function message(text,type){

  loginMessage.textContent = text;
  loginMessage.className = type || "";

}


async function login(){

  const emailValue =
    email.value.trim();

  const passwordValue =
    password.value;

  if(!emailValue || !passwordValue){

    message(
      "Please enter your email and password.",
      "error"
    );

    return;
  }

  loginButton.disabled = true;

  loginButton.textContent =
    "Signing in...";

  message("","");

  try{

    const { error } =
      await supabaseClient.auth
        .signInWithPassword({
          email:emailValue,
          password:passwordValue
        });

    if(error){
      throw error;
    }

    showDashboard();

  }catch(error){

    console.error(error);

    message(
      error.message ||
      "Login failed.",
      "error"
    );

  }finally{

    loginButton.disabled = false;

    loginButton.textContent =
      "Sign in";
  }
}


loginButton.addEventListener(
  "click",
  login
);


password.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){
      login();
    }

  }
);


async function showDashboard(){

  loginScreen.classList.add(
    "hidden"
  );

  dashboard.classList.remove(
    "hidden"
  );

  await loadBusinesses();
}


async function checkSession(){

  const { data } =
    await supabaseClient.auth
      .getSession();

  if(data.session){
    showDashboard();
  }

}


document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      dashboard.classList.add(
        "hidden"
      );

      loginScreen.classList.remove(
        "hidden"
      );

    }
  );


async function loadBusinesses(){

  businessGrid.innerHTML =
    `<div class="empty">
      Loading...
    </div>`;

  const { data,error } =
    await supabaseClient
      .from("businesses")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    businessGrid.innerHTML =
      `<div class="empty">
        ⚠️ ${escapeHtml(error.message)}
      </div>`;

    return;
  }

  if(!data || data.length === 0){

    businessGrid.innerHTML =
      `<div class="empty">
        🏪<br><br>
        No businesses yet.<br>
        Add your first business.
      </div>`;

    return;
  }

  businessGrid.innerHTML = "";

  for(const business of data){

    await renderBusiness(
      business
    );

  }
}


async function renderBusiness(business){

  const { data:cards,error } =
    await supabaseClient
      .from("cards")
      .select("*")
      .eq(
        "business_id",
        business.id
      )
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){
    console.error(error);
  }

  const cardList = cards || [];

  const article =
    document.createElement("div");

  article.className =
    "business";

  let logoHTML = "🏪";

  if(business.logo_url){

    logoHTML =
      `<img
        src="${escapeHtml(
          business.logo_url
        )}"
        alt=""
      >`;

  }

  let cardsHTML = "";

  if(cardList.length === 0){

    cardsHTML =
      `<div
        style="
          color:#718298;
          font-size:12px;
          padding:8px 0;
        "
      >
        No cards yet.
      </div>`;

  }else{

    cardsHTML =
      cardList
        .map(card =>
          createCardHTML(card)
        )
        .join("");

  }

  article.innerHTML = `

    <div class="business-head">

      <div class="business-logo">
        ${logoHTML}
      </div>

      <div>

        <div class="business-name">
          ${escapeHtml(
            business.name
          )}
        </div>

      </div>

    </div>


    <div class="info">

      <div class="info-label">
        WhatsApp
      </div>

      <div class="info-value">
        ${escapeHtml(
          business.whatsapp_number ||
          "Not configured"
        )}
      </div>

    </div>


    <div class="info">

      <div class="info-label">
        Google Review
      </div>

      <div class="info-value">
        ${escapeHtml(
          business.google_review_url ||
          "Not configured"
        )}
      </div>

    </div>


    <div class="cards-head">

      <strong>NFC / QR Cards</strong>

      <span class="count">
        ${cardList.length}
      </span>

    </div>


    ${cardsHTML}


    <button
      class="primary full"
      onclick="openCardModal(
        '${business.id}',
        '${escapeJs(
          business.name
        )}'
      )"
    >
      + Create card
    </button>


    <button
      class="small full"
      onclick="editBusiness(
        '${business.id}'
      )"
    >
      ✏️ Edit business
    </button>

  `;

  businessGrid.appendChild(article);

}


/*
  IMPORTANT:
  Card links now point to the CUSTOMER PAGE.

  admin.html:
  /nfc-feedback/admin.html

  customer page:
  /nfc-feedback/?card=TR-XXXXXX
*/

function createCardHTML(card){

  const customerPage =
    window.location.origin +
    window.location.pathname
      .replace(
        "admin.html",
        ""
      );

  const url =
    customerPage +
    "?card=" +
    encodeURIComponent(
      card.card_code
    );

  return `

    <div class="card-row">

      <div>

        <div class="card-code">
          ${escapeHtml(
            card.card_code
          )}
        </div>

        <div class="status ${
          card.active
            ? "active"
            : "inactive"
        }">

          ● ${
            card.active
              ? "Active"
              : "Inactive"
          }

        </div>

      </div>


      <div class="actions">

        <button
          class="small"
          onclick="copyUrl(
            '${escapeJs(url)}'
          )"
        >
          🔗
        </button>


        <button
          class="small"
          onclick="openCard(
            '${escapeJs(url)}'
          )"
        >
          👁
        </button>


        <button
          class="small"
          onclick="toggleCard(
            '${card.id}',
            ${card.active}
          )"
        >
          ${
            card.active
              ? "⏸"
              : "▶"
          }
        </button>

      </div>

    </div>

  `;

}


async function copyUrl(url){

  try{

    await navigator.clipboard.writeText(
      url
    );

    toast(
      "Customer card URL copied!"
    );

  }catch{

    window.prompt(
      "Copy this URL:",
      url
    );

  }

}


function openCard(url){

  window.open(
    url,
    "_blank"
  );

}


function openBusinessModal(){

  editingBusinessId = null;

  document.getElementById(
    "businessModalTitle"
  ).textContent =
    "Add business";

  document.getElementById(
    "businessName"
  ).value = "";

  document.getElementById(
    "logoUrl"
  ).value = "";

  document.getElementById(
    "googleUrl"
  ).value = "";

  document.getElementById(
    "whatsapp"
  ).value = "";

  document.getElementById(
    "primaryColor"
  ).value = "#0d1b2d";

  document.getElementById(
    "businessError"
  ).textContent = "";

  document.getElementById(
    "businessModal"
  ).classList.add("show");

}


document
  .getElementById(
    "addBusinessButton"
  )
  .addEventListener(
    "click",
    openBusinessModal
  );


function closeBusinessModal(){

  document
    .getElementById(
      "businessModal"
    )
    .classList.remove("show");

}


document
  .getElementById("closeBusiness")
  .addEventListener(
    "click",
    closeBusinessModal
  );


document
  .getElementById("cancelBusiness")
  .addEventListener(
    "click",
    closeBusinessModal
  );


document
  .getElementById("saveBusiness")
  .addEventListener(
    "click",
    saveBusiness
  );


async function saveBusiness(){

  const name =
    document
      .getElementById(
        "businessName"
      )
      .value
      .trim();

  const logo =
    document
      .getElementById(
        "logoUrl"
      )
      .value
      .trim();

  const google =
    document
      .getElementById(
        "googleUrl"
      )
      .value
      .trim();

  const whatsapp =
    document
      .getElementById(
        "whatsapp"
      )
      .value
      .trim();

  const color =
    document
      .getElementById(
        "primaryColor"
      )
      .value
      .trim();

  const errorBox =
    document.getElementById(
      "businessError"
    );

  if(!name){

    errorBox.className =
      "error";

    errorBox.textContent =
      "Business name is required.";

    return;
  }

  const button =
    document.getElementById(
      "saveBusiness"
    );

  button.disabled = true;

  button.textContent =
    "Saving...";

  const payload = {

    name:name,

    logo_url:
      logo || null,

    google_review_url:
      google || null,

    whatsapp_number:
      whatsapp || null,

    primary_color:
      color || "#0d1b2d"

  };

  let result;

  if(editingBusinessId){

    result =
      await supabaseClient
        .from("businesses")
        .update(payload)
        .eq(
          "id",
          editingBusinessId
        );

  }else{

    result =
      await supabaseClient
        .from("businesses")
        .insert(payload);

  }

  button.disabled = false;

  button.textContent =
    "Save business";

  if(result.error){

    errorBox.className =
      "error";

    errorBox.textContent =
      result.error.message;

    return;
  }

  closeBusinessModal();

  toast(
    editingBusinessId
      ? "Business updated!"
      : "Business created!"
  );

  await loadBusinesses();

}


async function editBusiness(id){

  const { data,error } =
    await supabaseClient
      .from("businesses")
      .select("*")
      .eq("id",id)
      .single();

  if(error){

    toast(error.message);

    return;
  }

  editingBusinessId = id;

  document.getElementById(
    "businessModalTitle"
  ).textContent =
    "Edit business";

  document.getElementById(
    "businessName"
  ).value =
    data.name || "";

  document.getElementById(
    "logoUrl"
  ).value =
    data.logo_url || "";

  document.getElementById(
    "googleUrl"
  ).value =
    data.google_review_url || "";

  document.getElementById(
    "whatsapp"
  ).value =
    data.whatsapp_number || "";

  document.getElementById(
    "primaryColor"
  ).value =
    data.primary_color ||
    "#0d1b2d";

  document.getElementById(
    "businessModal"
  ).classList.add("show");

}


function openCardModal(
  businessId,
  businessName
){

  selectedBusinessId =
    businessId;

  document.getElementById(
    "cardBusiness"
  ).textContent =
    "Business: " +
    businessName;

  document.getElementById(
    "cardCode"
  ).value =
    generateCode();

  document.getElementById(
    "cardError"
  ).textContent = "";

  document.getElementById(
    "cardModal"
  ).classList.add("show");

}


function closeCardModal(){

  document
    .getElementById(
      "cardModal"
    )
    .classList.remove("show");

}


document
  .getElementById("closeCard")
  .addEventListener(
    "click",
    closeCardModal
  );


document
  .getElementById("cancelCard")
  .addEventListener(
    "click",
    closeCardModal
  );


function generateCode(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "TR-";

  for(let i=0;i<6;i++){

    code +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return code;

}


document
  .getElementById("saveCard")
  .addEventListener(
    "click",
    saveCard
  );


async function saveCard(){

  if(!selectedBusinessId){
    return;
  }

  const code =
    document
      .getElementById(
        "cardCode"
      )
      .value
      .trim()
      .toUpperCase();

  const errorBox =
    document.getElementById(
      "cardError"
    );

  if(!code){

    errorBox.className =
      "error";

    errorBox.textContent =
      "Enter a card code.";

    return;
  }

  const button =
    document.getElementById(
      "saveCard"
    );

  button.disabled = true;

  button.textContent =
    "Creating...";

  const { error } =
    await supabaseClient
      .from("cards")
      .insert({

        business_id:
          selectedBusinessId,

        card_code:
          code,

        active:true

      });

  button.disabled = false;

  button.textContent =
    "Create card";

  if(error){

    errorBox.className =
      "error";

    if(error.code === "23505"){

      errorBox.textContent =
        "That card code already exists.";

    }else{

      errorBox.textContent =
        error.message;

    }

    return;
  }

  closeCardModal();

  toast(
    "Card created!"
  );

  await loadBusinesses();

}


async function toggleCard(
  id,
  currentStatus
){

  const { error } =
    await supabaseClient
      .from("cards")
      .update({
        active:!currentStatus
      })
      .eq("id",id);

  if(error){

    toast(error.message);

    return;
  }

  toast(
    currentStatus
      ? "Card deactivated"
      : "Card activated"
  );

  await loadBusinesses();

}


function toast(text){

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent = text;

  element.classList.add(
    "show"
  );

  setTimeout(
    () => {
      element.classList.remove(
        "show"
      );
    },
    2500
  );

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}


checkSession();

</script>
