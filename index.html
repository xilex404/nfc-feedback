<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Customer Feedback</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,200,61,.09),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #06101d 0%,
      #071522 50%,
      #050c15 100%
    );

  color:#fff;

  display:flex;
  flex-direction:column;
  align-items:center;

  overflow-x:hidden;

  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   MAIN APP
   ========================================================= */

.app{

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  padding:
    max(32px, env(safe-area-inset-top))
    24px
    max(24px, env(safe-area-inset-bottom))
    24px;

  position:relative;

  overflow:hidden;
}


/* subtle premium background glow */

.app::before{

  content:"";

  position:absolute;

  width:500px;
  height:500px;

  top:-250px;
  left:50%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(255,200,61,.10),
      transparent 68%
    );

  pointer-events:none;

}


/* =========================================================
   TOP BRAND
   ========================================================= */

.top{

  width:100%;
  max-width:650px;

  margin:0 auto;

  display:flex;
  flex-direction:column;
  align-items:center;

  position:relative;
  z-index:1;
}


.logo{

  width:100px;
  height:100px;

  border-radius:30px;

  margin-bottom:22px;

  background:
    linear-gradient(
      145deg,
      #172f4b,
      #0c1d31
    );

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 18px 45px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.08);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  font-size:46px;

  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.logo img{

  width:100%;
  height:100%;

  object-fit:cover;
}


.business-name{

  font-size:
    clamp(30px, 8vw, 44px);

  font-weight:800;

  line-height:1.1;

  letter-spacing:-1px;

  text-align:center;

  max-width:100%;

  word-break:break-word;
}


.subtitle{

  margin-top:13px;

  color:#aeb9c8;

  font-size:
    clamp(17px, 4.5vw, 21px);

  line-height:1.45;

  text-align:center;

  max-width:560px;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content{

  width:100%;
  max-width:650px;

  margin:0 auto;

  flex:1;

  display:flex;
  flex-direction:column;

  justify-content:center;

  position:relative;
  z-index:1;
}


/* =========================================================
   RATING TITLE
   ========================================================= */

.rating-title{

  text-align:center;

  font-size:
    clamp(21px, 5vw, 26px);

  font-weight:700;

  margin-bottom:24px;

  color:#f4f7fb;
}


/* =========================================================
   STARS
   ========================================================= */

.stars{

  width:100%;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:
    clamp(5px, 2vw, 15px);

  margin-bottom:22px;
}


.star{

  appearance:none;
  -webkit-appearance:none;

  border:0;
  outline:none;

  background:transparent;

  box-shadow:none;

  color:#39495d;

  font-size:
    clamp(54px, 14vw, 82px);

  line-height:1;

  cursor:pointer;

  padding:3px;

  margin:0;

  position:relative;

  user-select:none;
  -webkit-user-select:none;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;

  transition:
    color .22s ease,
    transform .22s cubic-bezier(.2,.8,.2,1),
    text-shadow .22s ease;
}


/*
  IMPORTANT:

  Remove the ugly browser focus/tap square.

  Keyboard users can still get a proper focus
  indicator with :focus-visible.
*/

.star:focus{
  outline:none !important;
  box-shadow:none !important;
}

.star:focus-visible{

  outline:
    3px solid rgba(255,200,61,.65);

  outline-offset:6px;

  border-radius:14px;
}


.star::-moz-focus-inner{
  border:0;
}


/* hover */

.star:hover{

  transform:
    scale(1.10);

  color:#d7a92e;
}


/* pressed */

.star:active{

  transform:
    scale(.88);

}


/* selected stars */

.star.active{

  color:#ffc83d;

  text-shadow:
    0 0 12px rgba(255,200,61,.35),
    0 0 28px rgba(255,200,61,.18);

  animation:
    starPop .38s cubic-bezier(.2,.8,.2,1);
}


@keyframes starPop{

  0%{
    transform:scale(.72);
    opacity:.55;
  }

  55%{
    transform:scale(1.18);
    opacity:1;
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{

  min-height:32px;

  text-align:center;

  color:#b8c3d1;

  font-size:
    clamp(16px, 4vw, 19px);

  font-weight:500;

  margin-bottom:28px;

  transition:
    opacity .2s ease,
    transform .2s ease;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{

  display:none;

  width:100%;

  animation:
    messageAppear .35s ease;
}


.message.show{
  display:block;
}


@keyframes messageAppear{

  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


.message h2{

  text-align:center;

  font-size:
    clamp(24px, 6vw, 31px);

  line-height:1.2;

  margin-bottom:12px;

  letter-spacing:-.5px;
}


.message p{

  text-align:center;

  color:#aeb9c8;

  font-size:
    clamp(16px, 4vw, 19px);

  line-height:1.55;

  margin-bottom:24px;
}


/* =========================================================
   GOOGLE / PRIVATE AREAS
   ========================================================= */

.google,
.private{

  width:100%;
}


.hidden{
  display:none !important;
}


/* =========================================================
   TEXTAREA
   ========================================================= */

textarea{

  width:100%;

  min-height:170px;

  resize:vertical;

  padding:18px;

  border-radius:18px;

  border:
    1px solid rgba(255,255,255,.10);

  background:
    rgba(4,12,22,.8);

  color:#fff;

  font-family:inherit;

  font-size:17px;

  line-height:1.5;

  outline:none;

  margin-bottom:12px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}


textarea::placeholder{
  color:#718096;
}


textarea:focus{

  border-color:
    rgba(255,200,61,.45);

  box-shadow:
    0 0 0 4px rgba(255,200,61,.07);
}


/* =========================================================
   BUTTONS
   ========================================================= */

.button{

  display:flex;

  width:100%;

  min-height:66px;

  padding:17px 20px;

  border-radius:18px;

  border:none;

  text-decoration:none;

  font-size:
    clamp(17px, 4.5vw, 20px);

  font-weight:800;

  cursor:pointer;

  margin-top:13px;

  align-items:center;
  justify-content:center;

  text-align:center;

  transition:
    transform .15s ease,
    box-shadow .2s ease,
    opacity .2s ease;

  -webkit-tap-highlight-color:transparent;
}


.button:focus{
  outline:none;
}


.button:focus-visible{

  outline:
    3px solid rgba(255,200,61,.7);

  outline-offset:4px;
}


.button:active{

  transform:
    scale(.975);

}


/* GOOGLE */

.google{

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #edf1f5
    );

  color:#111827;

  box-shadow:
    0 12px 30px rgba(0,0,0,.25);
}


.google:hover{

  box-shadow:
    0 15px 35px rgba(0,0,0,.32);

  transform:
    translateY(-2px);
}


/* PRIVATE */

.private{

  background:
    linear-gradient(
      135deg,
      #203c5c,
      #142b44
    );

  color:white;

  border:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    0 12px 30px rgba(0,0,0,.22);
}


.private:hover{

  transform:
    translateY(-2px);

}


/* =========================================================
   BOTTOM BRANDING
   ========================================================= */

.bottom-brand{

  width:100%;

  max-width:650px;

  margin:
    30px auto
    0;

  padding-top:18px;

  border-top:
    1px solid rgba(255,255,255,.06);

  display:flex;
  flex-direction:column;
  align-items:center;

  position:relative;
  z-index:1;
}


.smart-review{

  font-size:13px;

  font-weight:800;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#c4ccd7;
}


.smart-review span{

  color:#ffc83d;
}


.powered{

  margin-top:6px;

  color:#536174;

  font-size:11px;

  letter-spacing:.4px;
}


/* =========================================================
   ERROR
   ========================================================= */

.error{

  color:#ff9696;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  .app{

    padding-left:20px;
    padding-right:20px;
  }

  .logo{

    width:92px;
    height:92px;

    border-radius:28px;

    font-size:42px;
  }

  .content{

    justify-content:
      center;

    padding-top:20px;
  }

  .stars{

    gap:3px;
  }

  .star{

    font-size:
      clamp(55px, 16vw, 76px);

    padding:2px;
  }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media(max-height:700px){

  .app{

    padding-top:24px;
  }

  .logo{

    width:72px;
    height:72px;

    border-radius:22px;

    margin-bottom:13px;
  }

  .business-name{

    font-size:28px;
  }

  .subtitle{

    font-size:15px;
    margin-top:8px;
  }

  .rating-title{

    font-size:18px;
    margin-bottom:14px;
  }

  .stars{

    margin-bottom:12px;
  }

  .star{

    font-size:52px;
  }

  .bottom-brand{

    margin-top:18px;
  }

}


/* =========================================================
   REDUCE MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:.01ms !important;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =====================================================
       TOP
       ===================================================== -->

  <div class="top">


    <div
      class="logo"
      id="logo"
    >
      🍽️
    </div>


    <h1
      class="business-name"
      id="businessName"
    >
      Loading...
    </h1>


    <p
      class="subtitle"
      id="subtitle"
    >
      Loading your experience...
    </p>


  </div>


  <!-- =====================================================
       MAIN CONTENT
       ===================================================== -->

  <main class="content">


    <div
      id="feedbackArea"
      class="hidden"
    >


      <div class="rating-title">

        How was your experience?

      </div>


      <!-- =================================================
           STARS
           ================================================= -->

      <div
        class="stars"
        id="stars"
      >


        <button
          type="button"
          class="star"
          data-rating="1"
          aria-label="1 star"
        >
          ★
        </button>


        <button
          type="button"
          class="star"
          data-rating="2"
          aria-label="2 stars"
        >
          ★
        </button>


        <button
          type="button"
          class="star"
          data-rating="3"
          aria-label="3 stars"
        >
          ★
        </button>


        <button
          type="button"
          class="star"
          data-rating="4"
          aria-label="4 stars"
        >
          ★
        </button>


        <button
          type="button"
          class="star"
          data-rating="5"
          aria-label="5 stars"
        >
          ★
        </button>


      </div>


      <!-- =================================================
           RATING TEXT
           ================================================= -->

      <div
        class="rating-text"
        id="ratingText"
      >
        Tap a star to rate your experience
      </div>


      <!-- =================================================
           MESSAGE
           ================================================= -->

      <section
        class="message"
        id="message"
      >


        <h2
          id="messageTitle"
        ></h2>


        <p
          id="messageText"
        ></p>


        <!-- ===============================================
             3–5 STARS → GOOGLE
             =============================================== -->

        <div
          id="googleArea"
          class="hidden"
        >

          <a
            id="googleButton"
            class="button google"
            href="#"
            target="_blank"
            rel="noopener"
          >
            ⭐ Leave us a Google review
          </a>

        </div>


        <!-- ===============================================
             1–2 STARS → PRIVATE WHATSAPP
             =============================================== -->

        <div
          id="privateArea"
          class="hidden"
        >


          <textarea
            id="feedbackMessage"
            placeholder="Tell us what went wrong or how we can improve..."
          ></textarea>


          <button
            type="button"
            id="sendPrivate"
            class="button private"
          >
            💬 Send privately
          </button>


        </div>


      </section>


    </div>


  </main>


  <!-- =====================================================
       BRANDING
       ===================================================== -->

  <footer class="bottom-brand">


    <div class="smart-review">

      SMART <span>REVIEW</span>

    </div>


    <div class="powered">

      Powered by Smart Review

    </div>


  </footer>


</div>



<script>


/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        method:"GET",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  if(!cardCode){

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try{


    /* ==========================================
       FIND CARD
       ========================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* ==========================================
       FIND BUSINESS
       ========================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* ==========================================
       BUSINESS NAME
       ========================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Your Experience`;


    subtitle.textContent =
      "Your opinion matters to us.";


    /* ==========================================
       LOGO
       ========================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      logo.appendChild(
        image
      );

    }


    /* ==========================================
       GOOGLE REVIEW LINK
       ========================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* ==========================================
       SHOW PAGE
       ========================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {


        selectedRating =
          Number(
            star.dataset.rating
          );


        /* ==========================================
           HIGHLIGHT STARS
           ========================================== */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        /* ==========================================
           RATING TEXT
           ========================================== */

        ratingText.textContent =
          `${selectedRating} out of 5 stars`;


        /* ==========================================
           SHOW MESSAGE
           ========================================== */

        message.classList.add(
          "show"
        );


        /* ==========================================
           1–2 STARS
           ========================================== */

        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* ==========================================
           3–5 STARS
           ========================================== */

        else{


          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(selectedRating === 3){

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if(selectedRating === 4){

            messageTitle.textContent =
              "We're glad you enjoyed your experience!";

          }

          else{

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }


      }
    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {


      const text =
        feedbackMessage
          .value
          .trim();


      /* ==========================================
         CHECK BUSINESS
         ========================================== */

      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      /* ==========================================
         CHECK WHATSAPP
         ========================================== */

      if(!currentBusiness.whatsapp_number){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      /* ==========================================
         CLEAN NUMBER
         ========================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      /* ==========================================
         MESSAGE
         ========================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      /* ==========================================
         ENCODE
         ========================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* ==========================================
         WHATSAPP URL
         ========================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* ==========================================
         OPEN
         ========================================== */

      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>


</body>
</html>
