<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#061a36"
>

<title>Smart Review</title>


<style>

/* =========================================================
   SMART REVIEW
   DIGITAL TWIN OF THE PHYSICAL NFC / QR CARD
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html{
  width:100%;
  min-height:100%;
  background:#ffffff;
}


body{

  width:100%;

  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  color:#071b38;

  background:#ffffff;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;

  /* Prevent browser text-size weirdness */
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}


button,
textarea,
a{
  font:inherit;
}


button{

  -webkit-tap-highlight-color:transparent;

  -webkit-touch-callout:none;

  user-select:none;
  -webkit-user-select:none;
}


/* =========================================================
   APP
   ========================================================= */

.app{

  width:100%;

  min-height:100vh;
  min-height:100dvh;

  position:relative;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:#ffffff;
}


/* =========================================================
   NAVY TOP
   ========================================================= */

.navy-zone{

  width:100%;

  min-height:54%;

  position:relative;

  display:flex;
  flex-direction:column;
  align-items:center;

  background:

    radial-gradient(
      circle at 50% 5%,
      rgba(30,89,150,.32),
      transparent 38%
    ),

    radial-gradient(
      circle at 15% 70%,
      rgba(0,119,255,.08),
      transparent 35%
    ),

    linear-gradient(
      180deg,
      #061a36 0%,
      #071d3b 55%,
      #061832 100%
    );

  color:white;

  padding:

    max(28px, env(safe-area-inset-top))
    20px
    85px
    20px;

  display:flex;
  justify-content:center;
}


/* subtle premium texture */

.navy-zone::before{

  content:"";

  position:absolute;

  inset:0;

  opacity:.20;

  pointer-events:none;

  background-image:

    radial-gradient(
      rgba(255,255,255,.18) 0.6px,
      transparent .6px
    );

  background-size:18px 18px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 75%
    );
}


/* =========================================================
   GOOGLE HEADER
   ========================================================= */

.google-header{

  position:relative;

  z-index:3;

  width:100%;

  max-width:700px;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  animation:
    headerIn .7s cubic-bezier(.2,.8,.2,1) both;
}


@keyframes headerIn{

  from{
    opacity:0;
    transform:translateY(-18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   GOOGLE LOGO
   ========================================================= */

.google-logo{

  width:92px;
  height:92px;

  border-radius:50%;

  background:#ffffff;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:18px;

  position:relative;

  box-shadow:

    0 12px 35px rgba(0,0,0,.28),

    0 0 0 2px
    rgba(241,165,28,.95),

    0 0 0 5px
    rgba(255,255,255,.06);

  overflow:hidden;
}


.google-g{

  font-family:
    Arial,
    sans-serif;

  font-size:68px;

  line-height:1;

  font-weight:700;

  background:

    conic-gradient(
      from -45deg,
      #4285f4 0deg 85deg,
      #34a853 85deg 170deg,
      #fbbc05 170deg 245deg,
      #ea4335 245deg 330deg,
      #4285f4 330deg 360deg
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}


/* =========================================================
   MAIN CARD TITLE
   ========================================================= */

.google-title{

  font-size:
    clamp(24px,6vw,42px);

  line-height:1.08;

  font-weight:850;

  letter-spacing:-.8px;

  color:#ffffff;

  text-transform:uppercase;

  max-width:720px;

  text-shadow:
    0 3px 20px rgba(0,0,0,.18);

}


/* =========================================================
   GOLD STARS DECORATION
   ========================================================= */

.decor-stars{

  display:flex;

  align-items:center;
  justify-content:center;

  gap:
    clamp(4px,2vw,12px);

  margin-top:22px;

  width:100%;
}


.decor-line{

  height:1px;

  width:
    clamp(25px,10vw,90px);

  background:
    linear-gradient(
      90deg,
      transparent,
      #1e8fff
    );
}


.decor-line.right{

  background:
    linear-gradient(
      90deg,
      #1e8fff,
      transparent
    );
}


.decor-star{

  color:#f6b62b;

  font-size:
    clamp(26px,7vw,43px);

  line-height:1;

  filter:
    drop-shadow(
      0 4px 8px
      rgba(246,182,43,.25)
    );
}


/* =========================================================
   BLUE WAVE
   ========================================================= */

.wave{

  position:absolute;

  z-index:2;

  left:-5%;

  width:110%;

  height:100px;

  bottom:-48px;

  background:#ffffff;

  border-top:
    6px solid #1769ff;

  border-radius:
    50% 50% 0 0 /
    100% 100% 0 0;

  box-shadow:
    0 -5px 18px
    rgba(23,105,255,.12);
}


/* gold inner line */

.wave::after{

  content:"";

  position:absolute;

  top:-10px;

  left:0;

  width:100%;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent 15%,
      rgba(221,145,15,.8) 50%,
      transparent 85%
    );
}


/* =========================================================
   WHITE EXPERIENCE ZONE
   ========================================================= */

.white-zone{

  flex:1;

  width:100%;

  min-height:46%;

  position:relative;

  background:

    radial-gradient(
      circle at 50% 0%,
      rgba(24,105,255,.045),
      transparent 42%
    ),

    linear-gradient(
      180deg,
      #ffffff 0%,
      #f9fafc 100%
    );

  display:flex;

  flex-direction:column;

  align-items:center;

  padding:

    48px
    20px
    max(22px,env(safe-area-inset-bottom));

}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.content{

  width:100%;

  max-width:700px;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  position:relative;

  z-index:4;

  margin-top:-10px;
}


/* =========================================================
   BUSINESS LOGO
   ========================================================= */

.business-logo{

  width:
    clamp(105px,28vw,155px);

  height:
    clamp(105px,28vw,155px);

  border-radius:
    clamp(25px,7vw,38px);

  background:

    linear-gradient(
      145deg,
      #ffffff,
      #f0f3f7
    );

  border:
    2px solid
    rgba(7,27,56,.10);

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  margin-bottom:18px;

  box-shadow:

    0 18px 40px
    rgba(7,27,56,.14),

    0 0 0 7px
    rgba(23,105,255,.035);

  animation:
    logoIn .65s .1s cubic-bezier(.2,.8,.2,1) both;
}


@keyframes logoIn{

  from{

    opacity:0;

    transform:
      translateY(15px)
      scale(.88);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


.business-logo img{

  width:100%;
  height:100%;

  object-fit:cover;
}


/* =========================================================
   BUSINESS NAME
   ========================================================= */

.business-name{

  color:#071b38;

  font-size:
    clamp(28px,7vw,46px);

  line-height:1.08;

  font-weight:850;

  letter-spacing:-1px;

  max-width:700px;

  overflow-wrap:anywhere;

  margin-bottom:7px;
}


/* =========================================================
   SUBTITLE
   ========================================================= */

.subtitle{

  color:#536277;

  font-size:
    clamp(16px,4vw,21px);

  line-height:1.4;

  max-width:600px;

  margin-bottom:24px;
}


/* =========================================================
   RATING QUESTION
   ========================================================= */

.rating-question{

  color:#071b38;

  font-size:
    clamp(20px,5vw,27px);

  font-weight:750;

  margin-bottom:12px;

  letter-spacing:-.35px;
}


/* =========================================================
   STARS
   ========================================================= */

.stars{

  width:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:
    clamp(2px,1.8vw,12px);

  margin-bottom:9px;
}


.star{

  appearance:none;
  -webkit-appearance:none;

  border:0 !important;

  outline:none !important;

  background:transparent !important;

  box-shadow:none !important;

  color:#cbd2db;

  width:
    clamp(55px,15vw,92px);

  height:
    clamp(63px,17vw,100px);

  padding:0;

  margin:0;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:
    clamp(52px,15vw,86px);

  line-height:1;

  cursor:pointer;

  border-radius:18px;

  position:relative;

  transition:

    color .18s ease,

    transform .18s
      cubic-bezier(.2,.8,.2,1),

    filter .18s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;

  user-select:none;
  -webkit-user-select:none;
}


/* Kill mobile blue tap box */

.star:focus,
.star:focus-visible,
.star:active{

  outline:none !important;

  border:none !important;

  background:transparent !important;

  box-shadow:none !important;
}


/* selected */

.star.active{

  color:#f2ad24;

  filter:
    drop-shadow(
      0 5px 10px
      rgba(242,173,36,.30)
    );

  animation:
    starPop .38s
    cubic-bezier(.2,.9,.25,1.4);
}


@keyframes starPop{

  0%{
    transform:scale(.70);
  }

  48%{
    transform:scale(1.20);
  }

  72%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


/* press */

.star:active{

  transform:scale(.86) !important;

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{

  min-height:28px;

  color:#536277;

  font-size:
    clamp(15px,4vw,18px);

  font-weight:650;

  margin-bottom:18px;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{

  width:100%;

  display:none;

  text-align:center;

  animation:
    messageIn .35s
    cubic-bezier(.2,.8,.2,1) both;
}


.message.show{

  display:block;

}


@keyframes messageIn{

  from{

    opacity:0;

    transform:
      translateY(12px)
      scale(.985);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


.message h2{

  color:#071b38;

  font-size:
    clamp(21px,5vw,29px);

  line-height:1.2;

  font-weight:800;

  letter-spacing:-.45px;

  margin-bottom:7px;
}


.message p{

  color:#5d697a;

  font-size:
    clamp(15px,3.8vw,18px);

  line-height:1.45;

  max-width:600px;

  margin:
    0 auto 16px;
}


/* =========================================================
   BUTTON
   ========================================================= */

.button{

  width:100%;

  min-height:
    clamp(62px,15vw,76px);

  padding:
    16px 22px;

  border-radius:18px;

  border:none;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  text-decoration:none;

  font-size:
    clamp(17px,4.3vw,21px);

  font-weight:800;

  cursor:pointer;

  transition:

    transform .15s ease,

    box-shadow .2s ease,

    background .2s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;
}


.button:active{

  transform:scale(.975);

}


/* =========================================================
   GOOGLE BUTTON
   ========================================================= */

.google{

  color:#ffffff;

  background:

    linear-gradient(
      135deg,
      #1769ff,
      #0755df
    );

  box-shadow:

    0 12px 28px
    rgba(23,105,255,.24),

    inset 0 1px 0
    rgba(255,255,255,.20);
}


.google:hover{

  transform:translateY(-2px);

  box-shadow:

    0 17px 34px
    rgba(23,105,255,.30);
}


/* =========================================================
   PRIVATE BUTTON
   ========================================================= */

.private{

  color:#ffffff;

  background:

    linear-gradient(
      135deg,
      #071f3e,
      #0b315b
    );

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:

    0 12px 28px
    rgba(7,27,56,.22);
}


/* =========================================================
   WHATSAPP ACTIVE STATE
   ========================================================= */

.private.opening{

  background:

    linear-gradient(
      135deg,
      #159447,
      #0b7134
    );

  box-shadow:

    0 12px 30px
    rgba(20,150,70,.25);

}


.private .button-icon{

  margin-right:9px;

}


/* =========================================================
   TEXTAREA
   ========================================================= */

textarea{

  width:100%;

  min-height:145px;

  resize:none;

  padding:17px;

  border-radius:17px;

  border:
    1.5px solid
    rgba(7,27,56,.13);

  background:#ffffff;

  color:#071b38;

  /*
    IMPORTANT:
    16px minimum prevents iPhone Safari
    from automatically zooming when typing.
  */

  font-size:16px;

  line-height:1.5;

  outline:none;

  margin-bottom:8px;

  -webkit-appearance:none;

  appearance:none;

  box-shadow:
    0 8px 24px
    rgba(7,27,56,.055);
}


textarea::placeholder{

  color:#8a95a5;

}


textarea:focus{

  border-color:#1769ff;

  box-shadow:

    0 0 0 4px
    rgba(23,105,255,.08),

    0 8px 24px
    rgba(7,27,56,.06);
}


/* =========================================================
   SMART REVIEW BRAND
   ========================================================= */

.smart-brand{

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  margin-top:27px;

  padding-bottom:4px;

  position:relative;
}


/* blue/gold divider */

.smart-divider{

  width:
    clamp(120px,42vw,230px);

  height:2px;

  margin-bottom:12px;

  background:

    linear-gradient(
      90deg,
      transparent,
      #1769ff 28%,
      #d99516 50%,
      #1769ff 72%,
      transparent
    );

  position:relative;
}


.smart-divider::after{

  content:"◆";

  position:absolute;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%);

  color:#1769ff;

  font-size:10px;

  background:#ffffff;

  padding:0 6px;
}


/* =========================================================
   SMART REVIEW LOGO
   ========================================================= */

.smart-review{

  font-size:
    clamp(30px,8vw,48px);

  line-height:1;

  font-weight:800;

  letter-spacing:-1.3px;

  /*
    Navy + silver + gold
    inspired directly by the physical card.
  */

  background:

    linear-gradient(
      100deg,
      #071b38 0%,
      #28476b 26%,
      #aab5c2 44%,
      #ffffff 50%,
      #d89b24 62%,
      #8d5d08 76%,
      #071b38 100%
    );

  background-size:220% auto;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  animation:
    premiumShine 7s
    ease-in-out infinite;

  text-shadow:
    0 4px 18px
    rgba(7,27,56,.08);
}


@keyframes premiumShine{

  0%{
    background-position:0% center;
  }

  50%{
    background-position:100% center;
  }

  100%{
    background-position:0% center;
  }

}


.smart-review-sub{

  margin-top:7px;

  color:#657286;

  font-size:
    clamp(10px,2.7vw,13px);

  font-weight:700;

  letter-spacing:
    2px;

  text-transform:uppercase;

}


/* =========================================================
   LOADING
   ========================================================= */

.loading{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:6px;
}


.loading-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#d99b22;

  animation:
    pulse 1.1s infinite ease-in-out;
}


.loading-dot:nth-child(2){

  animation-delay:.15s;

}


.loading-dot:nth-child(3){

  animation-delay:.30s;

}


@keyframes pulse{

  0%,80%,100%{

    opacity:.25;

    transform:scale(.7);

  }

  40%{

    opacity:1;

    transform:scale(1);

  }

}


/* =========================================================
   ERROR
   ========================================================= */

.error{

  color:#c62828;

  font-weight:700;

}


.hidden{

  display:none !important;

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-height:700px){

  .navy-zone{

    min-height:48%;

    padding-bottom:72px;

  }

  .google-logo{

    width:72px;
    height:72px;

    margin-bottom:12px;

  }

  .google-g{

    font-size:53px;

  }

  .decor-stars{

    margin-top:13px;

  }

  .business-logo{

    width:92px;
    height:92px;

  }

  .business-name{

    font-size:27px;

  }

  .white-zone{

    padding-top:40px;

  }

}


/* =========================================================
   TABLETS
   ========================================================= */

@media(min-width:700px){

  .navy-zone{

    min-height:55%;

  }

  .google-logo{

    width:105px;
    height:105px;

  }

  .google-g{

    font-size:78px;

  }

  .white-zone{

    padding-top:60px;

  }

}


/* =========================================================
   ACCESSIBILITY
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =====================================================
       NAVY CARD-INSPIRED HEADER
       ===================================================== -->

  <section class="navy-zone">


    <div class="google-header">


      <!-- GOOGLE -->

      <div
        class="google-logo"
        aria-label="Google"
      >

        <div class="google-g">
          G
        </div>

      </div>


      <!-- TITLE -->

      <h2 class="google-title">

        LAISSEZ-NOUS VOTRE AVIS
        SUR GOOGLE

      </h2>


      <!-- DECORATIVE STARS -->

      <div class="decor-stars">

        <div class="decor-line"></div>

        <div class="decor-star">★</div>
        <div class="decor-star">★</div>
        <div class="decor-star">★</div>
        <div class="decor-star">★</div>
        <div class="decor-star">★</div>

        <div class="decor-line right"></div>

      </div>


    </div>


    <div class="wave"></div>


  </section>



  <!-- =====================================================
       WHITE EXPERIENCE AREA
       ===================================================== -->

  <section class="white-zone">


    <main class="content">


      <!-- =================================================
           BUSINESS
           ================================================= -->

      <div
        class="business-logo"
        id="logo"
        aria-label="Logo de l'établissement"
      >

        🍽️

      </div>


      <h1
        class="business-name"
        id="businessName"
      >

        Chargement...

      </h1>


      <p
        class="subtitle"
        id="subtitle"
      >

        <span class="loading">

          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>

        </span>

      </p>



      <!-- =================================================
           FEEDBACK
           ================================================= -->

      <section
        id="feedbackArea"
        class="hidden"
      >


        <div class="rating-question">

          Comment s'est passée
          votre expérience ?

        </div>


        <!-- =================================================
             INTERACTIVE STARS
             ================================================= -->

        <div
          class="stars"
          id="stars"
          role="radiogroup"
          aria-label="Évaluez votre expérience"
        >


          <button
            type="button"
            class="star"
            data-rating="1"
            aria-label="1 étoile"
          >★</button>


          <button
            type="button"
            class="star"
            data-rating="2"
            aria-label="2 étoiles"
          >★</button>


          <button
            type="button"
            class="star"
            data-rating="3"
            aria-label="3 étoiles"
          >★</button>


          <button
            type="button"
            class="star"
            data-rating="4"
            aria-label="4 étoiles"
          >★</button>


          <button
            type="button"
            class="star"
            data-rating="5"
            aria-label="5 étoiles"
          >★</button>


        </div>


        <!-- RATING TEXT -->

        <div
          class="rating-text"
          id="ratingText"
        >

          Touchez une étoile
          pour noter votre expérience

        </div>



        <!-- =================================================
             MESSAGE
             ================================================= -->

        <section
          class="message"
          id="message"
        >


          <h2
            id="messageTitle"
          ></h2>


          <p
            id="messageText"
          ></p>



          <!-- =================================================
               GOOGLE
               ================================================= -->

          <div
            id="googleArea"
            class="hidden"
          >


            <a
              id="googleButton"
              class="button google"
              href="#"
              target="_blank"
              rel="noopener"
            >

              ⭐
              &nbsp;
              Laisser un avis Google

            </a>


          </div>



          <!-- =================================================
               PRIVATE
               ================================================= -->

          <div
            id="privateArea"
            class="hidden"
          >


            <textarea
              id="feedbackMessage"
              placeholder="Dites-nous ce qui n'a pas été et comment nous pouvons nous améliorer..."
              aria-label="Votre commentaire privé"
            ></textarea>


            <button
              type="button"
              id="sendPrivate"
              class="button private"
            >

              <span class="button-icon">
                💬
              </span>

              <span id="privateButtonText">
                Nous écrire en privé
              </span>

            </button>


          </div>


        </section>


      </section>



      <!-- =================================================
           SMART REVIEW
           ================================================= -->

      <footer class="smart-brand">


        <div class="smart-divider"></div>


        <div class="smart-review">

          Smart Review

        </div>


        <div class="smart-review-sub">

          Better feedback. Better businesses.

        </div>


      </footer>


    </main>


  </section>


</div>



<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        method:"GET",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* =======================================================
     NO CARD
     ======================================================= */

  if(!cardCode){

    businessName.textContent =
      "Carte introuvable";


    subtitle.innerHTML =
      `<span class="error">
        Aucun code de carte n'a été fourni.
      </span>`;


    return;

  }


  try{


    /* =====================================================
       FIND CARD
       ===================================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* =====================================================
       FIND BUSINESS
       ===================================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* =====================================================
       BUSINESS NAME
       ===================================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Votre établissement";


    document.title =
      `${currentBusiness.name || "Smart Review"} — Smart Review`;


    subtitle.textContent =
      "Votre opinion compte pour nous.";


    /* =====================================================
       BUSINESS LOGO
       ===================================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW URL
       ===================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* =====================================================
       SHOW
       ===================================================== */

    feedbackArea
      .classList
      .remove("hidden");


  }


  catch(error){

    console.error(error);


    businessName.textContent =
      "Carte introuvable";


    subtitle.innerHTML =
      `<span class="error">
        Cette carte est inactive ou n'existe pas.
      </span>`;

  }

}


/* =========================================================
   STAR ELEMENTS
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {


    star.addEventListener(
      "click",
      function(){


        selectedRating =
          Number(
            this.dataset.rating
          );


        /* =================================================
           HIGHLIGHT
           ================================================= */

        stars.forEach(
          s => {

            const rating =
              Number(
                s.dataset.rating
              );


            s.classList.toggle(
              "active",
              rating <= selectedRating
            );

          }
        );


        /* =================================================
           RATING TEXT
           ================================================= */

        const ratingLabels = {

          1:
            "Nous aimerions faire mieux.",

          2:
            "Merci de nous l'avoir signalé.",

          3:
            "Merci pour votre retour.",

          4:
            "Ravi de l'entendre !",

          5:
            "Excellent ! Merci beaucoup !"

        };


        ratingText.textContent =
          ratingLabels[selectedRating];


        /* =================================================
           REPLAY MESSAGE ANIMATION
           ================================================= */

        message.classList.remove(
          "show"
        );


        requestAnimationFrame(
          () => {

            requestAnimationFrame(
              () => {

                message.classList.add(
                  "show"
                );

              }
            );

          }
        );


        /* =================================================
           1–2 STARS
           ================================================= */

        if(
          selectedRating <= 2
        ){

          messageTitle.textContent =
            "Nous sommes désolés de votre expérience.";


          messageText.textContent =
            "Dites-nous ce qui s'est passé. Votre retour nous aide à nous améliorer.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";


          /* Reset button */

          const privateButton =
            document.getElementById(
              "sendPrivate"
            );


          privateButton.classList.remove(
            "opening"
          );


          document.getElementById(
            "privateButtonText"
          ).textContent =
            "Nous écrire en privé";

        }


        /* =================================================
           3–5 STARS
           ================================================= */

        else{


          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(
            selectedRating === 3
          ){

            messageTitle.textContent =
              "Merci pour votre retour !";

          }


          else if(
            selectedRating === 4
          ){

            messageTitle.textContent =
              "Nous sommes ravis !";

          }


          else{

            messageTitle.textContent =
              "Merci ! Vous êtes incroyable ❤️";

          }


          messageText.textContent =
            "Nous apprécierions énormément que vous partagiez votre expérience sur Google.";

        }

      }
    );

  }
);


/* =========================================================
   PRIVATE WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    function(){


      const button =
        this;


      const buttonText =
        document.getElementById(
          "privateButtonText"
        );


      const text =
        feedbackMessage
          .value
          .trim();


      /* =====================================================
         CHECK BUSINESS
         ===================================================== */

      if(!currentBusiness){

        alert(
          "Les informations de l'établissement sont indisponibles."
        );

        return;

      }


      /* =====================================================
         CHECK WHATSAPP
         ===================================================== */

      if(
        !currentBusiness.whatsapp_number
      ){

        alert(
          "Le numéro WhatsApp n'est pas configuré."
        );

        return;

      }


      /* =====================================================
         CLEAN NUMBER
         ===================================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      if(
        number.startsWith("0")
      ){

        number =
          "213" +
          number.substring(1);

      }


      /* =====================================================
         MESSAGE
         ===================================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Retour privé — ${businessName}

⭐ Note : ${selectedRating}/5`;


      if(
        text.length > 0
      ){

        whatsappMessage +=
`

💬 Message du client :
${text}`;

      }


      /* =====================================================
         URL
         ===================================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* =====================================================
         ACTIVE BUTTON
         ===================================================== */

      button.classList.add(
        "opening"
      );


      buttonText.textContent =
        "Ouverture de WhatsApp…";


      /* Small visual delay so customer
         actually sees the state */

      setTimeout(
        () => {

          window.location.href =
            whatsappURL;

        },
        420
      );

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>


</body>

  </html>
