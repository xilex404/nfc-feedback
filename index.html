<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Customer Feedback</title>

<style>

/* =========================================================
   SMART REVIEW — AAA PREMIUM FULLSCREEN UI
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  width:100%;
  min-height:100%;
  background:#040913;
}

body{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(214,184,112,.095),
      transparent 27%
    ),
    radial-gradient(
      circle at 50% 55%,
      rgba(54,91,132,.10),
      transparent 38%
    ),
    radial-gradient(
      circle at 15% 100%,
      rgba(30,74,117,.18),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #07111f 0%,
      #040913 100%
    );

  color:#fff;

  display:flex;
  justify-content:center;
  align-items:stretch;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}


/* =========================================================
   FORM CONTROLS
   ========================================================= */

button,
a,
textarea{
  font:inherit;
}

textarea{
  font-size:16px !important;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   APP
   ========================================================= */

.app{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  position:relative;

  overflow:hidden;
}


/* =========================================================
   PREMIUM LIGHT EFFECTS
   ========================================================= */

.top-glow{
  position:absolute;

  width:700px;
  height:700px;

  top:-430px;
  left:50%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(218,190,124,.13) 0%,
      rgba(100,127,156,.045) 30%,
      transparent 68%
    );

  pointer-events:none;

  filter:blur(2px);
}


.app::before{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      115deg,
      transparent 20%,
      rgba(255,255,255,.018) 48%,
      transparent 65%
    );

  pointer-events:none;
}


/* =========================================================
   MAIN — TRUE CENTER
   ========================================================= */

.main{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  position:relative;
  z-index:2;

  padding:
    max(28px,env(safe-area-inset-top))
    22px
    max(24px,env(safe-area-inset-bottom))
    22px;
}


/* =========================================================
   CONTENT GROUP
   ========================================================= */

.content{
  width:100%;
  max-width:680px;

  display:flex;
  flex-direction:column;
  align-items:center;

  justify-content:center;

  text-align:center;
}


/* =========================================================
   BUSINESS BRANDING
   ========================================================= */

.business-section{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  margin-bottom:30px;
}


/* =========================================================
   CLIENT LOGO
   ========================================================= */

.logo{
  width:142px;
  height:142px;

  border-radius:38px;

  background:
    linear-gradient(
      145deg,
      #193653,
      #0a1728
    );

  border:
    1px solid rgba(255,255,255,.14);

  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    0 0 0 8px rgba(255,255,255,.018),
    0 0 55px rgba(75,112,148,.12),
    inset 0 1px 0 rgba(255,255,255,.11);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  font-size:60px;

  margin-bottom:25px;

  animation:
    logoEnter .7s cubic-bezier(.2,.8,.2,1) both;
}

.logo img{
  width:100%;
  height:100%;

  object-fit:cover;
}


@keyframes logoEnter{

  from{
    opacity:0;
    transform:
      translateY(-18px)
      scale(.88);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


/* =========================================================
   BUSINESS NAME
   ========================================================= */

.business-name{
  font-size:
    clamp(32px,8vw,52px);

  line-height:1.04;

  font-weight:850;

  letter-spacing:-1.5px;

  color:#f8fafc;

  max-width:100%;

  overflow-wrap:anywhere;

  margin-bottom:13px;

  text-shadow:
    0 8px 30px rgba(0,0,0,.25);
}


/* =========================================================
   SUBTITLE
   ========================================================= */

.subtitle{
  color:#aebccc;

  font-size:
    clamp(17px,4.5vw,22px);

  line-height:1.45;

  max-width:580px;

  margin-bottom:0;

  font-weight:500;
}


/* =========================================================
   FEEDBACK AREA
   ========================================================= */

.feedback-area{
  width:100%;
  max-width:680px;

  display:flex;
  flex-direction:column;
  align-items:center;

  animation:
    contentEnter .55s .12s cubic-bezier(.2,.8,.2,1) both;
}


@keyframes contentEnter{

  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   QUESTION
   ========================================================= */

.rating-question{
  font-size:
    clamp(21px,5.5vw,29px);

  font-weight:760;

  color:#f3f6fa;

  text-align:center;

  margin-bottom:22px;

  letter-spacing:-.4px;
}


/* =========================================================
   STARS
   ========================================================= */

.stars{
  width:100%;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:
    clamp(4px,2vw,14px);

  margin-bottom:15px;
}


.star{
  appearance:none;
  -webkit-appearance:none;

  border:0 !important;
  outline:none !important;

  background:transparent !important;

  color:#46566c;

  width:
    clamp(55px,14vw,94px);

  height:
    clamp(65px,16vw,102px);

  padding:0;
  margin:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:
    clamp(54px,15vw,90px);

  line-height:1;

  cursor:pointer;

  position:relative;

  border-radius:20px;

  transition:
    color .22s ease,
    transform .18s cubic-bezier(.2,.8,.2,1),
    filter .22s ease;

  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;

  user-select:none;
  -webkit-user-select:none;

  touch-action:manipulation;

  box-shadow:none !important;
}


/* Kill browser focus square */

.star:focus,
.star:focus-visible{
  outline:none !important;
  background:transparent !important;
  box-shadow:none !important;
}


/* Press */

.star:active{
  transform:scale(.84);

  background:transparent !important;
}


/* Selected */

.star.active{
  color:#f4c95d;

  filter:
    drop-shadow(
      0 5px 15px
      rgba(244,201,93,.28)
    );

  animation:
    starPop .34s cubic-bezier(.2,.9,.25,1.4);
}


@keyframes starPop{

  0%{
    transform:scale(.72);
  }

  55%{
    transform:scale(1.18);
  }

  78%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{
  min-height:31px;

  color:#aebccc;

  font-size:
    clamp(15px,4vw,19px);

  font-weight:600;

  text-align:center;

  margin-bottom:26px;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{
  width:100%;

  display:none;

  text-align:center;

  animation:
    messageEnter .4s cubic-bezier(.2,.8,.2,1) both;
}


.message.show{
  display:block;
}


@keyframes messageEnter{

  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


.message h2{
  font-size:
    clamp(23px,5.8vw,31px);

  line-height:1.2;

  font-weight:800;

  letter-spacing:-.5px;

  margin-bottom:10px;
}


.message p{
  color:#aebccc;

  font-size:
    clamp(16px,4vw,19px);

  line-height:1.55;

  max-width:590px;

  margin:
    0 auto 23px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.button{
  width:100%;

  min-height:70px;

  padding:18px 22px;

  border-radius:20px;

  border:none;

  text-decoration:none;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:
    clamp(17px,4.3vw,21px);

  font-weight:800;

  cursor:pointer;

  margin-top:12px;

  transition:
    transform .16s ease,
    box-shadow .2s ease,
    opacity .2s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;
}


.button:active{
  transform:scale(.975);
}


.google{
  background:
    linear-gradient(
      135deg,
      #ffffff,
      #e9eef3
    );

  color:#101722;

  box-shadow:
    0 16px 40px rgba(0,0,0,.30);
}


.google:hover{
  transform:translateY(-2px);

  box-shadow:
    0 20px 46px rgba(0,0,0,.36);
}


.private{
  background:
    linear-gradient(
      135deg,
      #244b70,
      #152f49
    );

  color:#fff;

  border:
    1px solid rgba(255,255,255,.10);

  box-shadow:
    0 16px 40px rgba(0,0,0,.28);
}


/* =========================================================
   TEXTAREA
   ========================================================= */

textarea{
  width:100%;

  min-height:160px;

  resize:none;

  padding:18px;

  border-radius:20px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    linear-gradient(
      145deg,
      rgba(9,22,37,.92),
      rgba(3,9,17,.92)
    );

  color:#fff;

  /*
    IMPORTANT:
    16px minimum prevents mobile Safari
    from auto-zooming when the field is focused.
  */

  font-size:16px !important;

  line-height:1.55;

  outline:none;

  margin-bottom:7px;

  -webkit-appearance:none;

  appearance:none;

  transform:none !important;
}


textarea::placeholder{
  color:#718198;

  opacity:1;
}


textarea:focus{
  border-color:
    rgba(211,184,111,.55);

  box-shadow:
    0 0 0 4px
    rgba(211,184,111,.07),
    0 15px 40px rgba(0,0,0,.22);
}


/* =========================================================
   SMART REVIEW — PREMIUM SIGNATURE
   ========================================================= */

.brand-footer{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  margin-top:38px;

  padding:
    0
    0
    max(14px,env(safe-area-inset-bottom));
}


/* Elegant divider */

.brand-line{
  width:120px;
  height:1px;

  margin-bottom:21px;

  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(197,207,218,.35) 18%,
      rgba(235,197,108,.9) 50%,
      rgba(197,207,218,.35) 82%,
      transparent 100%
    );

  box-shadow:
    0 0 14px rgba(222,190,104,.12);
}


/* =========================================================
   SMART REVIEW WORDMARK
   ========================================================= */

.smart-review{

  /*
    Metallic premium blend:
    silver → champagne gold → silver
    with a hint of navy underneath.
  */

  background:
    linear-gradient(
      105deg,
      #8d9bab 0%,
      #e9edf1 18%,
      #f4d37a 39%,
      #fff0b2 50%,
      #d6b35d 62%,
      #cbd4de 82%,
      #718196 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  -webkit-text-fill-color:transparent;

  color:transparent;

  font-size:
    clamp(34px,9vw,52px);

  font-weight:900;

  letter-spacing:
    clamp(2px,1vw,5px);

  line-height:1;

  text-transform:none;

  position:relative;

  text-shadow:none;

  filter:
    drop-shadow(
      0 7px 22px
      rgba(192,166,91,.18)
    );

  animation:
    brandReveal .8s .35s cubic-bezier(.2,.8,.2,1) both;
}


@keyframes brandReveal{

  from{
    opacity:0;
    transform:
      translateY(10px)
      scale(.96);

    filter:
      blur(4px)
      drop-shadow(
        0 7px 22px
        rgba(192,166,91,.18)
      );
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);

    filter:
      blur(0)
      drop-shadow(
        0 7px 22px
        rgba(192,166,91,.18)
      );
  }

}


/* Sub-brand */

.smart-review-sub{

  margin-top:11px;

  color:#8291a5;

  font-size:
    clamp(11px,3vw,14px);

  font-weight:650;

  letter-spacing:
    clamp(1.5px,.6vw,2.5px);

  text-transform:uppercase;

  opacity:.9;
}


/* =========================================================
   LOADING / ERROR
   ========================================================= */

.error{
  color:#ff9090;
}


.hidden{
  display:none !important;
}


.loading-dot{
  display:inline-block;

  width:8px;
  height:8px;

  border-radius:50%;

  background:#d8b963;

  margin:0 3px;

  animation:
    loadingPulse 1s infinite ease-in-out;
}


.loading-dot:nth-child(2){
  animation-delay:.15s;
}


.loading-dot:nth-child(3){
  animation-delay:.3s;
}


@keyframes loadingPulse{

  0%,80%,100%{
    opacity:.25;
    transform:scale(.75);
  }

  40%{
    opacity:1;
    transform:scale(1);
  }

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:390px){

  .main{
    padding-left:15px;
    padding-right:15px;
  }

  .business-section{
    margin-bottom:24px;
  }

  .logo{
    width:112px;
    height:112px;
    border-radius:30px;
  }

  .business-name{
    font-size:30px;
  }

  .subtitle{
    font-size:17px;
  }

  .rating-question{
    font-size:20px;
  }

  .stars{
    gap:0;
  }

  .star{
    width:59px;
    height:69px;
    font-size:55px;
  }

  .smart-review{
    font-size:34px;
  }

}


/* =========================================================
   TABLETS / DESKTOP
   ========================================================= */

@media(min-width:700px){

  .main{
    padding-left:40px;
    padding-right:40px;
  }

  .business-section{
    margin-bottom:34px;
  }

  .logo{
    width:150px;
    height:150px;
  }

  .smart-review{
    font-size:52px;
  }

}


/* =========================================================
   VERY SHORT SCREENS
   ========================================================= */

@media(max-height:700px){

  .main{
    justify-content:flex-start;

    padding-top:
      max(18px,env(safe-area-inset-top));
  }

  .business-section{
    margin-bottom:18px;
  }

  .logo{
    width:92px;
    height:92px;

    border-radius:25px;

    margin-bottom:14px;
  }

  .business-name{
    font-size:28px;
  }

  .subtitle{
    font-size:15px;
  }

  .rating-question{
    margin-bottom:10px;
  }

  .star{
    height:60px;
  }

  .rating-text{
    margin-bottom:14px;
  }

  .brand-footer{
    margin-top:24px;
  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;
  }

}

</style>
</head>


<body>

<div class="app">

  <div class="top-glow"></div>


  <main class="main">

    <div class="content">


      <!-- =================================================
           BUSINESS
           ================================================= -->

      <section class="business-section">

        <div
          class="logo"
          id="logo"
          aria-label="Business logo"
        >
          🍽️
        </div>


        <h1
          class="business-name"
          id="businessName"
        >
          Loading...
        </h1>


        <p
          class="subtitle"
          id="subtitle"
        >
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        </p>

      </section>


      <!-- =================================================
           FEEDBACK
           ================================================= -->

      <section
        id="feedbackArea"
        class="feedback-area hidden"
      >

        <div class="rating-question">
          How was your experience?
        </div>


        <!-- STARS -->

        <div
          class="stars"
          id="stars"
          role="radiogroup"
          aria-label="Rate your experience"
        >

          <button
            type="button"
            class="star"
            data-rating="1"
            aria-label="1 star"
          >★</button>

          <button
            type="button"
            class="star"
            data-rating="2"
            aria-label="2 stars"
          >★</button>

          <button
            type="button"
            class="star"
            data-rating="3"
            aria-label="3 stars"
          >★</button>

          <button
            type="button"
            class="star"
            data-rating="4"
            aria-label="4 stars"
          >★</button>

          <button
            type="button"
            class="star"
            data-rating="5"
            aria-label="5 stars"
          >★</button>

        </div>


        <div
          class="rating-text"
          id="ratingText"
        >
          Tap a star to rate your experience
        </div>


        <!-- =================================================
             MESSAGE
             ================================================= -->

        <section
          class="message"
          id="message"
        >

          <h2 id="messageTitle"></h2>

          <p id="messageText"></p>


          <!-- GOOGLE -->

          <div
            id="googleArea"
            class="hidden"
          >

            <a
              id="googleButton"
              class="button google"
              href="#"
              target="_blank"
              rel="noopener"
            >
              ⭐ Leave us a Google review
            </a>

          </div>


          <!-- PRIVATE -->

          <div
            id="privateArea"
            class="hidden"
          >

            <textarea
              id="feedbackMessage"
              placeholder="Tell us what went wrong or how we can improve..."
              aria-label="Private feedback"
            ></textarea>


            <button
              type="button"
              id="sendPrivate"
              class="button private"
            >
              💬 Send privately
            </button>

          </div>

        </section>

      </section>


      <!-- =================================================
           SMART REVIEW
           ================================================= -->

      <footer class="brand-footer">

        <div class="brand-line"></div>

        <div class="smart-review">
          Smart Review
        </div>

        <div class="smart-review-sub">
          Better feedback. Better businesses.
        </div>

      </footer>

    </div>

  </main>

</div>



<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"
        }
      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* No card */

  if(!cardCode){

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try{

    /* =====================================================
       FIND CARD
       ===================================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* =====================================================
       FIND BUSINESS
       ===================================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* =====================================================
       BUSINESS NAME
       ===================================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Smart Review`;


    subtitle.textContent =
      "Your opinion matters to us.";


    /* =====================================================
       LOGO
       ===================================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML = "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW LINK
       ===================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* =====================================================
       SHOW
       ===================================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {

        selectedRating =
          Number(
            star.dataset.rating
          );


        /* Highlight */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        /* Rating text */

        const ratingLabels = {

          1:
            "We'd like to do better.",

          2:
            "Thanks for telling us.",

          3:
            "Thanks for your feedback.",

          4:
            "Great to hear!",

          5:
            "Amazing! We're thrilled!"

        };


        ratingText.textContent =
          ratingLabels[selectedRating] ||
          `${selectedRating} out of 5 stars`;


        /* Replay message animation */

        message.classList.remove(
          "show"
        );


        requestAnimationFrame(
          () => {

            message.classList.add(
              "show"
            );

          }
        );


        /* =================================================
           1–2 STARS
           ================================================= */

        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* =================================================
           3–5 STARS
           ================================================= */

        else{

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(selectedRating === 3){

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if(selectedRating === 4){

            messageTitle.textContent =
              "We're glad you enjoyed it!";

          }

          else{

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {

      const text =
        feedbackMessage
          .value
          .trim();


      /* =====================================================
         CHECK BUSINESS
         ===================================================== */

      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      /* =====================================================
         CHECK WHATSAPP
         ===================================================== */

      if(
        !currentBusiness.whatsapp_number
      ){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      /* =====================================================
         CLEAN NUMBER
         ===================================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      /* =====================================================
         MESSAGE
         ===================================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      /* =====================================================
         ENCODE
         ===================================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* =====================================================
         WHATSAPP URL
         ===================================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* =====================================================
         OPEN
         ===================================================== */

      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>
