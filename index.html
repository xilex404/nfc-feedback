<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Customer Feedback</title>

<style>

/* =========================================================
   TAPREVIEW — AAA CUSTOMER EXPERIENCE
   ========================================================= */

:root {
  --bg: #050a12;
  --bg-2: #091321;

  --panel: rgba(13, 27, 45, 0.82);
  --panel-solid: #0d1b2d;

  --white: #ffffff;
  --muted: #91a0b3;
  --muted-2: #627187;

  --gold: #ffc83d;
  --gold-2: #ffe39a;

  --blue: #2b78ff;
  --whatsapp: #25d366;

  --border: rgba(255,255,255,0.09);

  --shadow:
    0 35px 100px rgba(0,0,0,0.55);
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


html {
  min-height: 100%;
  background: var(--bg);
}


body {

  min-height: 100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(31,72,122,0.38),
      transparent 38%
    ),

    radial-gradient(
      circle at 0% 100%,
      rgba(255,200,61,0.06),
      transparent 32%
    ),

    linear-gradient(
      145deg,
      #040810 0%,
      #07111f 48%,
      #050a12 100%
    );

  color: var(--white);

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;

  overflow-x: hidden;
}


/* =========================================================
   BACKGROUND DETAIL
   ========================================================= */

body::before {

  content: "";

  position: fixed;

  width: 420px;
  height: 420px;

  left: 50%;
  top: 40%;

  transform: translate(-50%, -50%);

  background:
    radial-gradient(
      circle,
      rgba(255,200,61,0.045),
      transparent 68%
    );

  pointer-events: none;

  filter: blur(20px);

}


body::after {

  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  opacity: 0.035;

  background-image:
    radial-gradient(
      rgba(255,255,255,0.8) 0.5px,
      transparent 0.5px
    );

  background-size: 7px 7px;

}


/* =========================================================
   MAIN CARD
   ========================================================= */

.card {

  position: relative;

  width: 100%;

  max-width: 470px;

  padding: 34px 26px 25px;

  background:
    linear-gradient(
      145deg,
      rgba(19,40,66,0.88),
      rgba(8,19,33,0.92)
    );

  border:
    1px solid var(--border);

  border-radius: 32px;

  box-shadow: var(--shadow);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  overflow: hidden;

  animation:
    cardEntrance
    0.65s cubic-bezier(.16,1,.3,1);

}


@keyframes cardEntrance {

  from {

    opacity: 0;

    transform:
      translateY(22px)
      scale(0.97);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* =========================================================
   TOP ACCENT
   ========================================================= */

.card::before {

  content: "";

  position: absolute;

  top: 0;
  left: 12%;

  width: 76%;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,200,61,0.75),
      transparent
    );

}


/* =========================================================
   LOGO
   ========================================================= */

.logo-wrap {

  position: relative;

  width: 92px;
  height: 92px;

  margin:
    0 auto 20px;

}


.logo-glow {

  position: absolute;

  inset: -10px;

  border-radius: 29px;

  background:
    radial-gradient(
      circle,
      rgba(255,200,61,0.14),
      transparent 68%
    );

  filter: blur(9px);

}


.logo {

  position: relative;

  width: 92px;
  height: 92px;

  border-radius: 27px;

  background:
    linear-gradient(
      145deg,
      #172e4b,
      #0b1a2c
    );

  border:
    1px solid rgba(255,255,255,0.12);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 38px;

  overflow: hidden;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 18px 40px rgba(0,0,0,0.32);

}


.logo img {

  width: 100%;
  height: 100%;

  object-fit: cover;

}


/* =========================================================
   BRAND
   ========================================================= */

.eyebrow {

  display: flex;

  justify-content: center;
  align-items: center;

  gap: 7px;

  margin-bottom: 9px;

  color: var(--gold);

  font-size: 10px;

  font-weight: 800;

  text-transform: uppercase;

  letter-spacing: 1.8px;

}


.eyebrow-dot {

  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: var(--gold);

  box-shadow:
    0 0 12px rgba(255,200,61,0.8);

}


h1 {

  font-size: 29px;

  line-height: 1.15;

  font-weight: 800;

  letter-spacing: -0.8px;

  text-align: center;

  word-break: break-word;

}


.subtitle {

  max-width: 330px;

  margin:
    10px auto 29px;

  color: var(--muted);

  font-size: 14px;

  line-height: 1.55;

  text-align: center;

}


/* =========================================================
   FEEDBACK AREA
   ========================================================= */

.feedback-area {

  animation:
    contentIn
    0.5s
    cubic-bezier(.16,1,.3,1);

}


.hidden {

  display: none !important;

}


@keyframes contentIn {

  from {

    opacity: 0;

    transform: translateY(12px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}


/* =========================================================
   RATING LABEL
   ========================================================= */

.rating-label {

  text-align: center;

  color: #d9e1eb;

  font-size: 12px;

  font-weight: 700;

  letter-spacing: 0.7px;

  text-transform: uppercase;

  margin-bottom: 12px;

}


/* =========================================================
   STARS
   ========================================================= */

.stars {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 5px;

  margin-bottom: 13px;

}


.star {

  width: 58px;
  height: 58px;

  border: 0;

  background: transparent;

  color: #405069;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0;

  outline: none;

  -webkit-tap-highlight-color: transparent;

  touch-action: manipulation;

}


.star span {

  display: inline-block;

  font-size: 46px;

  line-height: 1;

  transition:
    color 0.18s ease,
    transform 0.18s cubic-bezier(.16,1,.3,1),
    filter 0.18s ease;

}


.star:hover span {

  transform: scale(1.12);

}


.star.active {

  color: var(--gold);

}


.star.active span {

  filter:
    drop-shadow(
      0 0 9px
      rgba(255,200,61,0.20)
    );

  transform: scale(1.04);

}


.star.pop span {

  animation:
    starPop
    0.27s
    cubic-bezier(.16,1,.3,1);

}


@keyframes starPop {

  0% {

    transform:
      scale(1.04);

  }

  45% {

    transform:
      scale(1.27);

    filter:
      drop-shadow(
        0 0 15px
        rgba(255,200,61,0.48)
      );

  }

  100% {

    transform:
      scale(1.04);

  }

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text {

  min-height: 23px;

  color: var(--muted);

  font-size: 13px;

  text-align: center;

  margin-bottom: 24px;

  transition:
    color 0.2s ease;

}


/* =========================================================
   MESSAGE
   ========================================================= */

.message {

  display: none;

  padding-top: 4px;

  text-align: left;

}


.message.show {

  display: block;

  animation:
    messageIn
    0.38s
    cubic-bezier(.16,1,.3,1);

}


@keyframes messageIn {

  from {

    opacity: 0;

    transform: translateY(14px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}


/* =========================================================
   MESSAGE HEADER
   ========================================================= */

.message-header {

  display: flex;

  align-items: flex-start;

  gap: 13px;

  margin-bottom: 17px;

}


.message-icon {

  flex-shrink: 0;

  width: 42px;
  height: 42px;

  border-radius: 13px;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    rgba(255,200,61,0.09);

  border:
    1px solid
    rgba(255,200,61,0.16);

  color: var(--gold);

  font-size: 18px;

}


.message h2 {

  font-size: 18px;

  line-height: 1.25;

  margin-bottom: 5px;

}


.message p {

  color: var(--muted);

  font-size: 13px;

  line-height: 1.55;

}


/* =========================================================
   TEXTAREA
   ========================================================= */

.textarea-wrap {

  position: relative;

}


textarea {

  width: 100%;

  min-height: 128px;

  resize: vertical;

  padding:
    16px;

  padding-bottom: 30px;

  border-radius: 17px;

  border:
    1px solid
    rgba(255,255,255,0.09);

  background:
    rgba(3,9,17,0.72);

  color: white;

  font-family: inherit;

  font-size: 14px;

  line-height: 1.5;

  outline: none;

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease;

}


textarea::placeholder {

  color: #56667b;

}


textarea:focus {

  border-color:
    rgba(255,200,61,0.4);

  box-shadow:
    0 0 0 4px
    rgba(255,200,61,0.06);

}


.char-hint {

  position: absolute;

  right: 13px;
  bottom: 10px;

  color: #4f6075;

  font-size: 10px;

  pointer-events: none;

}


/* =========================================================
   BUTTONS
   ========================================================= */

.button {

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  width: 100%;

  min-height: 54px;

  padding:
    14px 18px;

  border-radius: 16px;

  border: 1px solid transparent;

  text-decoration: none;

  font-size: 14px;

  font-weight: 800;

  letter-spacing: -0.1px;

  cursor: pointer;

  margin-top: 11px;

  text-align: center;

  transition:
    transform 0.16s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease,
    background 0.2s ease;

  touch-action: manipulation;

}


.button:active {

  transform:
    scale(0.985);

}


.button:focus-visible {

  outline:
    2px solid
    var(--gold);

  outline-offset: 3px;

}


/* =========================================================
   GOOGLE
   ========================================================= */

.google {

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #e9edf2
    );

  color: #111827;

  box-shadow:
    0 12px 28px
    rgba(0,0,0,0.20);

}


.google:hover {

  transform:
    translateY(-2px);

  box-shadow:
    0 16px 34px
    rgba(0,0,0,0.28);

}


.google-icon {

  width: 23px;
  height: 23px;

  border-radius: 50%;

  background: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 15px;

}


/* =========================================================
   WHATSAPP
   ========================================================= */

.private {

  background:
    linear-gradient(
      180deg,
      #28dc6d,
      #1fc45d
    );

  color: #04130a;

  box-shadow:
    0 12px 30px
    rgba(37,211,102,0.17);

}


.private:hover {

  transform:
    translateY(-2px);

  box-shadow:
    0 16px 36px
    rgba(37,211,102,0.25);

}


.whatsapp-icon {

  width: 23px;
  height: 23px;

  border-radius: 50%;

  background:
    rgba(0,0,0,0.12);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 14px;

}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider {

  display: flex;

  align-items: center;

  gap: 10px;

  margin:
    19px 0 2px;

  color: #46566a;

  font-size: 10px;

  text-transform: uppercase;

  letter-spacing: 1px;

}


.divider::before,
.divider::after {

  content: "";

  flex: 1;

  height: 1px;

  background:
    rgba(255,255,255,0.06);

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 6px;

  margin-top: 25px;

  color: #4e5e72;

  font-size: 10px;

  letter-spacing: 0.2px;

}


.footer-dot {

  width: 4px;
  height: 4px;

  border-radius: 50%;

  background:
    rgba(255,200,61,0.5);

}


/* =========================================================
   SUCCESS
   ========================================================= */

.success {

  display: none;

  text-align: center;

  padding:
    12px 0 5px;

}


.success.show {

  display: block;

  animation:
    successIn
    0.5s
    cubic-bezier(.16,1,.3,1);

}


@keyframes successIn {

  from {

    opacity: 0;

    transform:
      scale(0.94)
      translateY(10px);

  }

  to {

    opacity: 1;

    transform:
      scale(1)
      translateY(0);

  }

}


.success-icon {

  width: 68px;
  height: 68px;

  margin:
    0 auto 17px;

  border-radius: 22px;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    rgba(37,211,102,0.10);

  border:
    1px solid
    rgba(37,211,102,0.18);

  color: #42e879;

  font-size: 30px;

  box-shadow:
    0 0 35px
    rgba(37,211,102,0.08);

}


.success h2 {

  font-size: 22px;

  margin-bottom: 8px;

}


.success p {

  max-width: 300px;

  margin: auto;

  color: var(--muted);

  font-size: 13px;

  line-height: 1.55;

}


/* =========================================================
   ERROR
   ========================================================= */

.error {

  color: #ff8f8f;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 500px) {

  body {

    padding:
      12px;

    align-items:
      center;

  }


  .card {

    padding:
      29px 18px 22px;

    border-radius:
      27px;

  }


  .logo,
  .logo-wrap {

    width: 82px;
    height: 82px;

  }


  h1 {

    font-size:
      26px;

  }


  .star {

    width:
      56px;

    height:
      56px;

  }


  .star span {

    font-size:
      43px;

  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration:
      0.01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      0.01ms !important;

  }

}

</style>

</head>


<body>


<main class="card">


  <!-- =====================================================
       LOGO
       ===================================================== -->

  <div class="logo-wrap">

    <div class="logo-glow"></div>

    <div
      class="logo"
      id="logo"
      aria-label="Business logo">

      🍽️

    </div>

  </div>


  <!-- =====================================================
       BRAND
       ===================================================== -->

  <div class="eyebrow">

    <span class="eyebrow-dot"></span>

    Your experience matters

    <span class="eyebrow-dot"></span>

  </div>


  <h1 id="businessName">

    Loading...

  </h1>


  <p
    class="subtitle"
    id="subtitle">

  </p>


  <!-- =====================================================

       ===================================================== -->

  <div
    id="feedbackArea"

    <div class="rating-label">

      How did we do?

    </div>


    <!-- ===================================================
         STARS
         =================================================== -->

    <div
      class="stars"
      id="stars"
      role="group"
      aria-label="Rate your experience from 1 to 5 stars">


      <button
        class="star"
        type="button"
        data-rating="1"
        aria-label="1 star">

      </button>


      <button
        class="star"
        type="button"
        data-rating="2"
        aria-label="2 stars">

        <span>★</span>

      </button>


      <button
        class="star"
        type="button"
        data-rating="3"
        aria-label="3 stars">

        <span>★</span>

      </button>


      <button
        class="star"
        type="button"
        data-rating="4"
        aria-label="4 stars">

        <span>★</span>

      </button>


      <button
        class="star"
        type="button"
        data-rating="5"
        aria-label="5 stars">

        <span>★</span>

      </button>


    </div>


    <div
      class="rating-text"
      id="ratingText"
      aria-live="polite">

      Tap a star to rate your experience

    </div>


    <!-- ===================================================
         MESSAGE
         =================================================== -->

    <section
      class="message"
      id="message">


      <div class="message-header">


        <div
          class="message-icon"
          id="messageIcon">

          ✦

        </div>


        <div>

          <h2
            id="messageTitle">
          </h2>


          <p
            id="messageText">
          </p>

        </div>


      </div>


      <!-- =================================================
           GOOGLE
           ================================================= -->

      <div
        id="googleArea"
        class="hidden">


        <a
          id="googleButton"
          class="button google"
          href="#"
          target="_blank"
          rel="noopener noreferrer">

          <span class="google-icon">
            G
          </span>

          Leave us a Google review

        </a>


        <div class="divider">

          Share your experience

        </div>


      </div>


      <!-- =================================================
           PRIVATE
           ================================================= -->

      <div
        id="privateArea"
        class="hidden">


        <div class="textarea-wrap">


          <textarea
            id="feedbackMessage"
            maxlength="1000"
            aria-label="Private feedback"
            placeholder="Tell us what happened or how we can improve..."></textarea>


          <span
            class="char-hint"
            id="charHint">

            0 / 1000

          </span>


        </div>


        <button
          id="sendPrivate"
          class="button private"
          type="button">

          <span class="whatsapp-icon">
            💬
          </span>

    </section>


    <!-- ===================================================
         SUCCESS STATE

    <section
      id="success"

      <div class="success-icon">

      <p id="successText">

      </p>


    </section>


  </div>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <div class="footer">

    <span>Secure feedback</span>

    <span class="footer-dot"></span>

    <span>Thank you for helping us improve</span>

  </div>


</main>



<script>


/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint) {

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        method: "GET",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   DOM
   ========================================================= */

const businessName =
  document.getElementById(
    "businessName"
  );


const subtitle =
  document.getElementById(
    "subtitle"
  );


const feedbackArea =
  document.getElementById(
    "feedbackArea"
  );


const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const messageIcon =
  document.getElementById(
    "messageIcon"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const googleButton =
  document.getElementById(
    "googleButton"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


const charHint =
  document.getElementById(
    "charHint"
  );


const sendPrivate =
  document.getElementById(
    "sendPrivate"
  );


const success =
  document.getElementById(
    "success"
  );


const successText =
  document.getElementById(
    "successText"
  );


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard() {

  const cardCode =
    getCardCode();


  /* ---------------------------------------------
     NO CARD CODE
     --------------------------------------------- */

  if (!cardCode) {

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try {


    /* ---------------------------------------------
       FIND CARD
       --------------------------------------------- */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if (!cards.length) {

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* ---------------------------------------------
       FIND BUSINESS
       --------------------------------------------- */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if (!businesses.length) {

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* ---------------------------------------------
       BUSINESS NAME
       --------------------------------------------- */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Your Experience`;


    subtitle.textContent =
      "Take a moment to tell us about your experience.";


    /* ---------------------------------------------
       LOGO
       --------------------------------------------- */

    if (
      currentBusiness.logo_url
    ) {

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      image.onerror =
        function() {

          logo.textContent =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* ---------------------------------------------
       PRIMARY COLOR
       --------------------------------------------- */

    if (
      currentBusiness.primary_color
    ) {

      document.documentElement
        .style
        .setProperty(
          "--gold",
          currentBusiness.primary_color
        );

    }


    /* ---------------------------------------------
       GOOGLE LINK
       --------------------------------------------- */

    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* ---------------------------------------------
       SHOW
       --------------------------------------------- */

    feedbackArea
      .classList
      .remove(
        "hidden"
      );

  }


  catch (error) {

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {


        selectedRating =
          Number(
            star.dataset.rating
          );


        /* -----------------------------------------
           RESET POP
           ----------------------------------------- */

        stars.forEach(
          s => {

            s.classList.remove(
              "pop"
            );

          }
        );


        /*
          Force browser reflow so the
          animation can restart.
        */

        void star.offsetWidth;


        /* -----------------------------------------
           HIGHLIGHT
           ----------------------------------------- */

        stars.forEach(
          s => {

            const rating =
              Number(
                s.dataset.rating
              );


            s.classList.toggle(
              "active",
              rating <= selectedRating
            );

          }
        );


        /* -----------------------------------------
           POP SELECTED STAR
           ----------------------------------------- */

        star.classList.add(
          "pop"
        );


        /* -----------------------------------------
           TEXT
           ----------------------------------------- */

        ratingText.textContent =
          `${selectedRating} out of 5 stars`;


        /* -----------------------------------------
           SHOW MESSAGE
           ----------------------------------------- */

        message.classList.add(
          "show"
        );


        /* -----------------------------------------
           1–2 STARS
           ----------------------------------------- */

        if (
          selectedRating <= 2
        ) {


          messageIcon.textContent =
            "♡";


          messageTitle.textContent =
            "We're sorry we missed the mark.";


          messageText.textContent =
            "Tell us what happened. Your message goes directly to the business privately.";


          googleArea
            .classList
            .add(
              "hidden"
            );


          privateArea
            .classList
            .remove(
              "hidden"
            );


          feedbackMessage.value =
            "";


          updateCharCount();

        }


        /* -----------------------------------------
           3–5 STARS
           ----------------------------------------- */

        else {


          privateArea
            .classList
            .add(
              "hidden"
            );


          googleArea
            .classList
            .remove(
              "hidden"
            );


          messageIcon.textContent =
            "★";


          if (
            selectedRating === 3
          ) {

            messageTitle.textContent =
              "Thank you for your feedback.";

          }


          else if (
            selectedRating === 4
          ) {

            messageTitle.textContent =
              "We're glad you enjoyed it.";

          }


          else {

            messageTitle.textContent =
              "We're thrilled you loved it!";

          }


          messageText.textContent =
            "If you have a moment, we'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   CHARACTER COUNT
   ========================================================= */

function updateCharCount() {

  charHint.textContent =
    `${feedbackMessage.value.length} / 1000`;

}


feedbackMessage.addEventListener(
  "input",
  updateCharCount
);


/* =========================================================
   SEND PRIVATE FEEDBACK
   ========================================================= */

sendPrivate.addEventListener(
  "click",
  () => {


    /* -----------------------------------------
       CHECK BUSINESS
       ----------------------------------------- */

    if (
      !currentBusiness
    ) {

      alert(
        "Business information is unavailable."
      );

      return;

    }


    /* -----------------------------------------
       CHECK WHATSAPP
       ----------------------------------------- */

    if (
      !currentBusiness.whatsapp_number
    ) {

      alert(
        "WhatsApp contact is not configured for this business."
      );

      return;

    }


    /* -----------------------------------------
       GET COMMENT
       ----------------------------------------- */

    const text =
      feedbackMessage
        .value
        .trim();


    /* -----------------------------------------
       CLEAN NUMBER
       ----------------------------------------- */

    let number =
      String(
        currentBusiness.whatsapp_number
      )
      .replace(
        /\D/g,
        ""
      );


    /*
      Algeria:

      0555123456

      becomes:

      213555123456
    */

    if (
      number.startsWith("0")
    ) {

      number =
        "213" +
        number.substring(1);

    }


    /* -----------------------------------------
       MESSAGE
       ----------------------------------------- */

    const name =
      currentBusiness.name ||
      "Business";


    let whatsappMessage =
`🔒 Private feedback — ${name}

⭐ Rating: ${selectedRating}/5`;


    if (
      text.length > 0
    ) {

      whatsappMessage +=
`

💬 Customer feedback:
${text}`;

    }


    /* -----------------------------------------
       URL
       ----------------------------------------- */

    const encodedMessage =
      encodeURIComponent(
        whatsappMessage
      );


    const whatsappURL =
      `https://wa.me/${number}?text=${encodedMessage}`;


    /* -----------------------------------------
       UI FEEDBACK
       ----------------------------------------- */

    sendPrivate.disabled =
      true;

    sendPrivate.style.opacity =
      "0.65";

    sendPrivate.innerHTML =
      `<span class="whatsapp-icon">✓</span>
       Opening WhatsApp...`;


    /*
      Small delay makes the button state
      visible before navigation.
    */

    setTimeout(
      () => {

        window.location.href =
          whatsappURL;

      },
      180
    );

  }
);


/* =========================================================
   START
   ========================================================= */

loadCard();


</script>
