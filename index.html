<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Customer Feedback</title>

<style>

/* =========================================================
   SMART REVIEW — PREMIUM FULL-SCREEN UI
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  width:100%;
  min-height:100%;
  background:#050b14;
}

body{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,200,61,.10),
      transparent 38%
    ),
    radial-gradient(
      circle at 10% 100%,
      rgba(46,102,160,.14),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #07111f 0%,
      #050b14 100%
    );

  color:#fff;

  display:flex;
  justify-content:center;
  align-items:stretch;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,
a,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   APP
   ========================================================= */

.app{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  position:relative;

  overflow:hidden;
}


/* =========================================================
   TOP DECORATION
   ========================================================= */

.top-glow{
  position:absolute;

  width:420px;
  height:420px;

  top:-260px;
  left:50%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(255,200,61,.16) 0%,
      rgba(255,200,61,.05) 30%,
      transparent 70%
    );

  pointer-events:none;
}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.main{
  width:100%;

  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    max(34px,env(safe-area-inset-top))
    24px
    20px
    24px;

  position:relative;
  z-index:2;
}


/* =========================================================
   BUSINESS BRANDING
   ========================================================= */

.business-section{
  width:100%;
  max-width:650px;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  margin-top:8px;
}


.logo{
  width:128px;
  height:128px;

  border-radius:34px;

  background:
    linear-gradient(
      145deg,
      #172f4d,
      #0c1b2d
    );

  border:
    1px solid rgba(255,255,255,.13);

  box-shadow:
    0 18px 50px rgba(0,0,0,.38),
    0 0 0 7px rgba(255,255,255,.025),
    inset 0 1px 0 rgba(255,255,255,.08);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  font-size:55px;

  margin-bottom:24px;

  animation:
    logoEnter .65s cubic-bezier(.2,.8,.2,1) both;
}

.logo img{
  width:100%;
  height:100%;

  object-fit:cover;
}


@keyframes logoEnter{

  from{
    opacity:0;
    transform:
      translateY(-15px)
      scale(.88);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


/* =========================================================
   BUSINESS NAME
   ========================================================= */

.business-name{
  font-size:
    clamp(30px,7vw,48px);

  line-height:1.08;

  font-weight:850;

  letter-spacing:-1.2px;

  color:#fff;

  max-width:100%;

  overflow-wrap:anywhere;

  margin-bottom:13px;
}


.subtitle{
  color:#aebccc;

  font-size:
    clamp(17px,4.4vw,22px);

  line-height:1.45;

  max-width:560px;

  margin-bottom:40px;
}


/* =========================================================
   FEEDBACK AREA
   ========================================================= */

.feedback-area{
  width:100%;
  max-width:650px;

  display:flex;
  flex-direction:column;
  align-items:center;

  animation:
    contentEnter .55s .12s cubic-bezier(.2,.8,.2,1) both;
}


@keyframes contentEnter{

  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   RATING QUESTION
   ========================================================= */

.rating-question{
  font-size:
    clamp(20px,5vw,28px);

  font-weight:750;

  color:#f3f6fa;

  text-align:center;

  margin-bottom:25px;

  letter-spacing:-.3px;
}


/* =========================================================
   STARS
   ========================================================= */

.stars{
  width:100%;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:
    clamp(4px,2vw,14px);

  margin-bottom:19px;
}


.star{
  appearance:none;
  -webkit-appearance:none;

  border:0;
  outline:none;

  background:transparent !important;

  color:#46566c;

  width:
    clamp(54px,14vw,92px);

  height:
    clamp(64px,16vw,100px);

  padding:0;

  margin:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:
    clamp(53px,15vw,88px);

  line-height:1;

  cursor:pointer;

  border-radius:20px;

  position:relative;

  transition:
    color .22s ease,
    transform .18s cubic-bezier(.2,.8,.2,1),
    filter .22s ease;

  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;

  user-select:none;
  -webkit-user-select:none;

  touch-action:manipulation;

  box-shadow:none !important;
}


/* Absolutely no browser blue focus rectangle */

.star:focus{
  outline:none !important;
  background:transparent !important;
  box-shadow:none !important;
}


/* Keep accessibility focus for keyboard users */

.star:focus-visible{
  outline:
    3px solid rgba(255,200,61,.65) !important;

  outline-offset:4px;

  background:transparent !important;
}


/* Press animation */

.star:active{
  transform:scale(.84);
  background:transparent !important;
}


/* Gold selected stars */

.star.active{
  color:#ffc83d;

  filter:
    drop-shadow(
      0 5px 14px
      rgba(255,200,61,.24)
    );

  animation:
    starPop .34s cubic-bezier(.2,.9,.25,1.4);
}


@keyframes starPop{

  0%{
    transform:scale(.72);
  }

  55%{
    transform:scale(1.18);
  }

  78%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{
  min-height:31px;

  color:#aebccc;

  font-size:
    clamp(15px,4vw,19px);

  font-weight:600;

  text-align:center;

  margin-bottom:29px;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{
  width:100%;

  display:none;

  text-align:center;

  animation:
    messageEnter .4s cubic-bezier(.2,.8,.2,1) both;
}


.message.show{
  display:block;
}


@keyframes messageEnter{

  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


.message h2{
  font-size:
    clamp(22px,5.5vw,30px);

  line-height:1.2;

  font-weight:800;

  letter-spacing:-.4px;

  margin-bottom:11px;
}


.message p{
  color:#aebccc;

  font-size:
    clamp(16px,4vw,19px);

  line-height:1.55;

  max-width:580px;

  margin:
    0 auto 24px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.button{
  width:100%;

  min-height:68px;

  padding:18px 22px;

  border-radius:19px;

  border:none;

  text-decoration:none;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:
    clamp(17px,4.3vw,21px);

  font-weight:800;

  cursor:pointer;

  margin-top:13px;

  transition:
    transform .16s ease,
    box-shadow .2s ease,
    opacity .2s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;
}


.button:active{
  transform:scale(.975);
}


.google{
  background:
    linear-gradient(
      135deg,
      #ffffff,
      #edf1f5
    );

  color:#101722;

  box-shadow:
    0 14px 35px rgba(0,0,0,.28);
}


.google:hover{
  box-shadow:
    0 18px 42px rgba(0,0,0,.34);

  transform:translateY(-2px);
}


.private{
  background:
    linear-gradient(
      135deg,
      #1e4265,
      #17334f
    );

  color:#fff;

  border:
    1px solid rgba(255,255,255,.10);

  box-shadow:
    0 14px 35px rgba(0,0,0,.25);
}


/* =========================================================
   TEXTAREA
   ========================================================= */

textarea{
  width:100%;

  min-height:155px;

  resize:none;

  padding:18px;

  border-radius:19px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(4,10,18,.78);

  color:#fff;

  font-size:
    clamp(16px,4vw,19px);

  line-height:1.5;

  outline:none;

  margin-bottom:7px;

  -webkit-appearance:none;
}


textarea::placeholder{
  color:#697a8f;
}


textarea:focus{
  border-color:
    rgba(255,200,61,.55);

  box-shadow:
    0 0 0 4px
    rgba(255,200,61,.08);
}


/* =========================================================
   SMART REVIEW BRANDING
   ========================================================= */

.brand-footer{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  margin-top:auto;

  padding:
    38px
    0
    max(18px,env(safe-area-inset-bottom));
}


.brand-line{
  width:80px;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,200,61,.65),
      transparent
    );

  margin-bottom:18px;
}


.smart-review{
  color:#ffc83d;

  font-size:
    clamp(21px,5.5vw,29px);

  font-weight:900;

  letter-spacing:
    3px;

  text-transform:uppercase;

  line-height:1;

  text-shadow:
    0 5px 25px
    rgba(255,200,61,.14);
}


.smart-review-sub{
  margin-top:8px;

  color:#72839a;

  font-size:
    clamp(11px,3vw,14px);

  font-weight:650;

  letter-spacing:2.2px;

  text-transform:uppercase;
}


/* =========================================================
   LOADING / ERROR
   ========================================================= */

.error{
  color:#ff9090;
}


.hidden{
  display:none !important;
}


.loading-dot{
  display:inline-block;

  width:8px;
  height:8px;

  border-radius:50%;

  background:#ffc83d;

  margin:0 3px;

  animation:
    loadingPulse 1s infinite ease-in-out;
}


.loading-dot:nth-child(2){
  animation-delay:.15s;
}


.loading-dot:nth-child(3){
  animation-delay:.3s;
}


@keyframes loadingPulse{

  0%,80%,100%{
    opacity:.25;
    transform:scale(.75);
  }

  40%{
    opacity:1;
    transform:scale(1);
  }

}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media(max-width:390px){

  .main{
    padding-left:16px;
    padding-right:16px;
  }

  .logo{
    width:108px;
    height:108px;
    border-radius:29px;
  }

  .business-name{
    font-size:30px;
  }

  .subtitle{
    margin-bottom:28px;
  }

  .rating-question{
    font-size:20px;
  }

  .stars{
    gap:1px;
  }

  .star{
    width:59px;
    height:68px;
    font-size:55px;
  }

}


/* =========================================================
   TABLET / DESKTOP
   ========================================================= */

@media(min-width:700px){

  .main{
    padding-top:55px;
  }

  .business-section{
    margin-top:5px;
  }

  .logo{
    width:145px;
    height:145px;
  }

  .feedback-area{
    margin-top:4px;
  }

  .brand-footer{
    padding-bottom:30px;
  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }

}

</style>
</head>


<body>

<div class="app">

  <div class="top-glow"></div>


  <main class="main">


    <!-- =====================================================
         BUSINESS
         ===================================================== -->

    <section class="business-section">

      <div
        class="logo"
        id="logo"
        aria-label="Business logo"
      >
        🍽️
      </div>


      <h1
        class="business-name"
        id="businessName"
      >
        Loading...
      </h1>


      <p
        class="subtitle"
        id="subtitle"
      >
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </p>

    </section>


    <!-- =====================================================
         FEEDBACK
         ===================================================== -->

    <section
      id="feedbackArea"
      class="feedback-area hidden"
    >

      <div class="rating-question">
        How was your experience?
      </div>


      <!-- STARS -->

      <div
        class="stars"
        id="stars"
        role="radiogroup"
        aria-label="Rate your experience"
      >

        <button
          type="button"
          class="star"
          data-rating="1"
          aria-label="1 star"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="2"
          aria-label="2 stars"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="3"
          aria-label="3 stars"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="4"
          aria-label="4 stars"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="5"
          aria-label="5 stars"
        >★</button>

      </div>


      <div
        class="rating-text"
        id="ratingText"
      >
        Tap a star to rate your experience
      </div>


      <!-- ===================================================
           MESSAGE
           =================================================== -->

      <section
        class="message"
        id="message"
      >

        <h2 id="messageTitle"></h2>

        <p id="messageText"></p>


        <!-- GOOGLE -->

        <div
          id="googleArea"
          class="hidden"
        >

          <a
            id="googleButton"
            class="button google"
            href="#"
            target="_blank"
            rel="noopener"
          >
            ⭐ Leave us a Google review
          </a>

        </div>


        <!-- PRIVATE -->

        <div
          id="privateArea"
          class="hidden"
        >

          <textarea
            id="feedbackMessage"
            placeholder="Tell us what went wrong or how we can improve..."
            aria-label="Private feedback"
          ></textarea>


          <button
            type="button"
            id="sendPrivate"
            class="button private"
          >
            💬 Send privately
          </button>

        </div>

      </section>

    </section>


    <!-- =====================================================
         SMART REVIEW BRAND
         ===================================================== -->

    <footer class="brand-footer">

      <div class="brand-line"></div>

      <div class="smart-review">
        Smart Review
      </div>

      <div class="smart-review-sub">
        Better feedback. Better businesses.
      </div>

    </footer>

  </main>

</div>



<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"
        }
      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* No card code */

  if(!cardCode){

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try{

    /* =====================================================
       FIND CARD
       ===================================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* =====================================================
       FIND BUSINESS
       ===================================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* =====================================================
       BUSINESS NAME
       ===================================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Smart Review`;


    subtitle.textContent =
      "Your opinion matters to us.";


    /* =====================================================
       LOGO
       ===================================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML = "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW LINK
       ===================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* =====================================================
       SHOW PAGE
       ===================================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {

        selectedRating =
          Number(
            star.dataset.rating
          );


        /* =================================================
           HIGHLIGHT STARS

           Keep this logic exactly simple:
           every star <= selected rating becomes gold.
           ================================================= */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        /* =================================================
           RATING TEXT
           ================================================= */

        const ratingLabels = {
          1:"We'd like to do better.",
          2:"Thanks for telling us.",
          3:"Thanks for your feedback.",
          4:"Great to hear!",
          5:"Amazing! We're thrilled!"
        };


        ratingText.textContent =
          ratingLabels[selectedRating] ||
          `${selectedRating} out of 5 stars`;


        /* =================================================
           SHOW MESSAGE
           ================================================= */

        message.classList.remove(
          "show"
        );


        /*
          Small timeout lets the browser
          replay the entrance animation
          even when the user changes rating.
        */

        requestAnimationFrame(
          () => {

            message.classList.add(
              "show"
            );

          }
        );


        /* =================================================
           1–2 STARS
           ================================================= */

        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* =================================================
           3–5 STARS
           ================================================= */

        else{

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(selectedRating === 3){

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if(selectedRating === 4){

            messageTitle.textContent =
              "We're glad you enjoyed it!";

          }

          else{

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {

      const text =
        feedbackMessage
          .value
          .trim();


      /* =====================================================
         CHECK BUSINESS
         ===================================================== */

      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      /* =====================================================
         CHECK WHATSAPP
         ===================================================== */

      if(
        !currentBusiness.whatsapp_number
      ){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      /* =====================================================
         CLEAN WHATSAPP NUMBER
         ===================================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      /*
        Algeria:

        0555123456

        becomes:

        213555123456
      */

      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      /* =====================================================
         MESSAGE
         ===================================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      /* =====================================================
         ENCODE
         ===================================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* =====================================================
         WHATSAPP URL
         ===================================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* =====================================================
         OPEN
         ===================================================== */

      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>
