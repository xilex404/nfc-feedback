<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
>

<meta
  name="theme-color"
  content="#07182d"
>

<title>Smart Review</title>


<style>

/* =========================================================
   SMART REVIEW
   CARD-INSPIRED DIGITAL EXPERIENCE
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  width:100%;
  min-height:100%;
  background:#07182d;
}

body{

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:#07182d;

  color:#111827;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;

  overscroll-behavior:none;
}

button,
textarea,
a{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   APP
   ========================================================= */

.app{

  position:relative;

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #07182d 0%,
      #0a213c 34%,
      #ffffff 62%,
      #ffffff 100%
    );
}


/* =========================================================
   NAVY BACKGROUND LIGHT
   ========================================================= */

.navy-light{

  position:absolute;

  width:520px;
  height:520px;

  left:50%;
  top:-310px;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,210,91,.17) 0%,
      rgba(255,210,91,.06) 27%,
      transparent 68%
    );

  pointer-events:none;
}


/* =========================================================
   SUBTLE CARD TEXTURE
   ========================================================= */

.app::before{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  opacity:.18;

  background-image:
    radial-gradient(
      rgba(255,255,255,.18) .6px,
      transparent .7px
    );

  background-size:7px 7px;

  mask-image:
    linear-gradient(
      to bottom,
      black 0%,
      transparent 58%
    );

}


/* =========================================================
   MAIN
   ========================================================= */

.main{

  position:relative;
  z-index:2;

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    max(28px,env(safe-area-inset-top))
    20px
    max(20px,env(safe-area-inset-bottom));

}


/* =========================================================
   BUSINESS HEADER
   ========================================================= */

.business{

  width:100%;
  max-width:680px;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  color:white;

  padding-top:8px;

}


/* =========================================================
   BUSINESS LOGO
   ========================================================= */

.logo{

  width:
    clamp(104px,28vw,150px);

  height:
    clamp(104px,28vw,150px);

  border-radius:
    clamp(27px,7vw,40px);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  margin-bottom:20px;

  background:
    linear-gradient(
      145deg,
      #173b61,
      #0b2038
    );

  border:
    1px solid
    rgba(255,255,255,.20);

  box-shadow:

    0 24px 65px
    rgba(0,0,0,.35),

    0 0 0 7px
    rgba(255,255,255,.035),

    inset 0 1px 0
    rgba(255,255,255,.16);

  font-size:54px;

  animation:
    logoIn .65s
    cubic-bezier(.2,.85,.2,1)
    both;

}


.logo img{

  width:100%;
  height:100%;

  object-fit:cover;

}


@keyframes logoIn{

  from{

    opacity:0;

    transform:
      translateY(-20px)
      scale(.86);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* =========================================================
   BUSINESS NAME
   ========================================================= */

.business-name{

  width:100%;

  font-size:
    clamp(30px,8vw,48px);

  line-height:1.05;

  font-weight:850;

  letter-spacing:-1.5px;

  color:#ffffff;

  overflow-wrap:anywhere;

  margin-bottom:10px;

  text-shadow:
    0 5px 25px
    rgba(0,0,0,.20);

}


/* =========================================================
   SUBTITLE
   ========================================================= */

.subtitle{

  color:#c3d0df;

  font-size:
    clamp(16px,4.5vw,21px);

  line-height:1.4;

  max-width:600px;

  margin-bottom:32px;

}


/* =========================================================
   WAVE TRANSITION
   ========================================================= */

.wave{

  position:absolute;

  z-index:1;

  left:-5%;

  width:110%;

  height:150px;

  top:
    clamp(370px,43vh,510px);

  pointer-events:none;

  overflow:hidden;

}


.wave svg{

  display:block;

  width:100%;
  height:100%;

}


/* =========================================================
   FEEDBACK PANEL
   ========================================================= */

.feedback{

  position:relative;
  z-index:3;

  width:100%;
  max-width:680px;

  margin-top:
    clamp(35px,8vh,95px);

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  color:#102039;

  animation:
    feedbackIn .65s
    .1s
    cubic-bezier(.2,.8,.2,1)
    both;

}


@keyframes feedbackIn{

  from{

    opacity:0;

    transform:
      translateY(28px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   QUESTION
   ========================================================= */

.question{

  font-size:
    clamp(22px,6vw,31px);

  line-height:1.15;

  font-weight:850;

  letter-spacing:-.6px;

  color:#102039;

  margin-bottom:22px;

}


/* =========================================================
   GOLD DECORATIVE LINE
   ========================================================= */

.gold-line{

  width:92px;
  height:3px;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #b98920,
      #ffd66b,
      #b98920
    );

  margin-bottom:25px;

  box-shadow:
    0 3px 12px
    rgba(194,145,35,.20);

}


/* =========================================================
   STARS
   ========================================================= */

.stars{

  width:100%;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:
    clamp(1px,1.5vw,12px);

  margin-bottom:12px;

}


.star{

  appearance:none;
  -webkit-appearance:none;

  border:none !important;
  outline:none !important;

  background:transparent !important;

  width:
    clamp(58px,16vw,94px);

  height:
    clamp(65px,17vw,100px);

  padding:0;
  margin:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#b7c0ca;

  font-size:
    clamp(55px,15vw,86px);

  line-height:1;

  cursor:pointer;

  position:relative;

  border-radius:20px;

  transition:
    color .20s ease,
    transform .16s
      cubic-bezier(.2,.8,.2,1),
    filter .20s ease;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  touch-action:manipulation;

  box-shadow:none !important;

}


.star:hover{

  transform:translateY(-2px) scale(1.05);

}


.star:focus,
.star:focus-visible{

  outline:none !important;

  background:transparent !important;

  box-shadow:none !important;

}


.star:active{

  transform:scale(.82) !important;

  background:transparent !important;

}


/* GOLD STAR */

.star.active{

  color:#e7b62f;

  filter:
    drop-shadow(
      0 6px 12px
      rgba(214,166,43,.27)
    );

  animation:
    starPop .34s
    cubic-bezier(.2,.9,.25,1.4);

}


@keyframes starPop{

  0%{

    transform:scale(.70);

  }

  52%{

    transform:scale(1.18);

  }

  78%{

    transform:scale(.94);

  }

  100%{

    transform:scale(1);

  }

}


/* =========================================================
   RATING LABEL
   ========================================================= */

.rating-text{

  min-height:29px;

  color:#718096;

  font-size:
    clamp(15px,4vw,19px);

  font-weight:650;

  margin-bottom:24px;

}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{

  width:100%;

  display:none;

  padding:
    0
    4px;

  animation:
    messageIn .4s
    cubic-bezier(.2,.8,.2,1)
    both;

}


.message.show{

  display:block;

}


@keyframes messageIn{

  from{

    opacity:0;

    transform:
      translateY(14px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


.message h2{

  color:#102039;

  font-size:
    clamp(22px,5.8vw,30px);

  line-height:1.18;

  font-weight:850;

  letter-spacing:-.5px;

  margin-bottom:9px;

}


.message p{

  color:#64748b;

  font-size:
    clamp(16px,4.2vw,19px);

  line-height:1.5;

  max-width:600px;

  margin:
    0 auto 20px;

}


/* =========================================================
   GOOGLE CTA
   ========================================================= */

.google-area{

  width:100%;

}


.google-button{

  width:100%;

  min-height:76px;

  padding:
    14px
    20px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:15px;

  text-decoration:none;

  border-radius:21px;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #f4f5f7
    );

  border:
    1px solid
    #d2d5d9;

  color:#202124;

  font-size:
    clamp(17px,4.4vw,21px);

  font-weight:800;

  box-shadow:

    0 13px 30px
    rgba(16,32,57,.14),

    0 3px 8px
    rgba(16,32,57,.08);

  transition:
    transform .16s ease,
    box-shadow .20s ease;

  -webkit-tap-highlight-color:transparent;

}


.google-button:hover{

  transform:translateY(-2px);

  box-shadow:

    0 18px 38px
    rgba(16,32,57,.18);

}


.google-button:active{

  transform:scale(.975);

}


/* =========================================================
   REALISTIC GOOGLE G MARK
   ========================================================= */

.google-g{

  width:31px;
  height:31px;

  flex:0 0 31px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:white;

  position:relative;

  overflow:hidden;

}


/*
   Multicolor G constructed from the Google palette.
   It remains inside the white button surface.
*/

.google-g::before{

  content:"G";

  font-family:
    Arial,
    sans-serif;

  font-size:31px;

  line-height:1;

  font-weight:700;

  background:
    conic-gradient(
      from 45deg,
      #4285f4 0deg 92deg,
      #34a853 92deg 180deg,
      #fbbc05 180deg 252deg,
      #ea4335 252deg 325deg,
      #4285f4 325deg 360deg
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

}


/* =========================================================
   GOOGLE MICRO LABEL
   ========================================================= */

.google-note{

  margin-top:9px;

  color:#8a95a3;

  font-size:11px;

  font-weight:650;

  letter-spacing:.4px;

}


/* =========================================================
   PRIVATE FEEDBACK
   ========================================================= */

.private-area{

  width:100%;

}


textarea{

  width:100%;

  min-height:150px;

  resize:none;

  padding:18px;

  border-radius:20px;

  border:
    1px solid #d8dde4;

  background:
    #f8fafc;

  color:#152238;

  font-size:
    clamp(16px,4.2vw,19px);

  line-height:1.5;

  outline:none;

  -webkit-appearance:none;

  -webkit-tap-highlight-color:transparent;

}


textarea::placeholder{

  color:#8b97a8;

}


textarea:focus{

  border-color:#c5a347;

  box-shadow:
    0 0 0 4px
    rgba(197,163,71,.10);

}


/* =========================================================
   PRIVATE BUTTON
   ========================================================= */

.private-button{

  width:100%;

  min-height:70px;

  margin-top:12px;

  border:none;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #102b49,
      #173e63
    );

  color:white;

  font-size:
    clamp(17px,4.4vw,21px);

  font-weight:850;

  cursor:pointer;

  box-shadow:

    0 15px 32px
    rgba(16,43,73,.23);

  transition:
    transform .16s ease,
    background .25s ease,
    box-shadow .25s ease;

  -webkit-tap-highlight-color:transparent;

}


.private-button:active{

  transform:scale(.975);

}


.private-button.sending{

  background:
    linear-gradient(
      135deg,
      #17834b,
      #20a861
    );

  box-shadow:
    0 15px 34px
    rgba(23,131,75,.25);

}


.private-button.sending::after{

  content:"";

}


/* =========================================================
   SMART REVIEW BRAND
   ========================================================= */

.smart-brand{

  width:100%;

  max-width:680px;

  margin-top:auto;

  padding-top:34px;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

}


.brand-divider{

  width:120px;
  height:2px;

  border-radius:999px;

  margin-bottom:17px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #b28a2e,
      #d9dce0,
      #193957,
      transparent
    );

}


.smart-review{

  font-size:
    clamp(30px,8vw,44px);

  line-height:1;

  font-weight:900;

  letter-spacing:
    2.2px;

  background:
    linear-gradient(
      100deg,
      #8d681b 0%,
      #d8b34e 24%,
      #f1f2f3 43%,
      #bfc5cb 55%,
      #365875 73%,
      #102e4d 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  text-shadow:
    0 7px 25px
    rgba(24,47,70,.10);

}


.smart-review-sub{

  margin-top:9px;

  color:#7b8796;

  font-size:
    clamp(11px,3vw,14px);

  font-weight:700;

  letter-spacing:2px;

  text-transform:uppercase;

}


/* =========================================================
   LOADING
   ========================================================= */

.loading{

  display:flex;

  align-items:center;
  justify-content:center;

  gap:5px;

}


.dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#d8b34e;

  animation:
    dotPulse 1s infinite ease-in-out;

}


.dot:nth-child(2){

  animation-delay:.15s;

}


.dot:nth-child(3){

  animation-delay:.30s;

}


@keyframes dotPulse{

  0%,80%,100%{

    opacity:.25;
    transform:scale(.75);

  }

  40%{

    opacity:1;
    transform:scale(1);

  }

}


/* =========================================================
   ERROR
   ========================================================= */

.error{

  color:#ffb0b0;

}


.hidden{

  display:none !important;

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:390px){

  .main{

    padding-left:15px;
    padding-right:15px;

  }

  .logo{

    width:104px;
    height:104px;

    margin-bottom:16px;

  }

  .business-name{

    font-size:30px;

  }

  .subtitle{

    margin-bottom:23px;

  }

  .feedback{

    margin-top:25px;

  }

  .star{

    width:58px;
    height:67px;

    font-size:55px;

  }

  .stars{

    gap:0;

  }

}


/* =========================================================
   LANDSCAPE
   ========================================================= */

@media(
  orientation:landscape
) and (max-height:600px){

  .main{

    padding-top:15px;

  }

  .logo{

    width:75px;
    height:75px;

    border-radius:22px;

    margin-bottom:10px;

  }

  .business-name{

    font-size:27px;

  }

  .subtitle{

    margin-bottom:12px;

  }

  .feedback{

    margin-top:5px;

  }

  .star{

    height:62px;
    font-size:53px;

  }

  .smart-brand{

    padding-top:15px;

  }

}


/* =========================================================
   TABLETS / DESKTOP
   ========================================================= */

@media(min-width:700px){

  .main{

    padding-top:45px;

  }

  .business-name{

    font-size:48px;

  }

  .feedback{

    margin-top:80px;

  }

  .stars{

    gap:8px;

  }

  .star{

    width:90px;
    height:95px;

    font-size:84px;

  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

  }

}

</style>

</head>


<body>


<div class="app">

  <div class="navy-light"></div>


  <!-- =====================================================
       NAVY / WHITE CARD-STYLE WAVE
       ===================================================== -->

  <div class="wave">

    <svg
      viewBox="0 0 1200 180"
      preserveAspectRatio="none"
      aria-hidden="true"
    >

      <path
        d="
          M0,65
          C130,120 260,145 410,108
          C570,68 670,25 830,70
          C990,115 1080,145 1200,90
          L1200,180
          L0,180
          Z
        "
        fill="#ffffff"
      />

    </svg>

  </div>


  <main class="main">


    <!-- ===================================================
         BUSINESS
         =================================================== -->

    <section class="business">


      <div
        class="logo"
        id="logo"
        aria-label="Business logo"
      >

        🍽️

      </div>


      <h1
        class="business-name"
        id="businessName"
      >

        Loading...

      </h1>


      <p
        class="subtitle"
        id="subtitle"
      >

        <span class="loading">

          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>

        </span>

      </p>


    </section>


    <!-- ===================================================
         FEEDBACK
         =================================================== -->

    <section
      id="feedbackArea"
      class="feedback hidden"
    >


      <div class="question">

        How was your experience?

      </div>


      <div class="gold-line"></div>


      <!-- STARS -->

      <div
        class="stars"
        id="stars"
        role="radiogroup"
        aria-label="Rate your experience"
      >


        <button
          type="button"
          class="star"
          data-rating="1"
          aria-label="1 star"
        >

          ★

        </button>


        <button
          type="button"
          class="star"
          data-rating="2"
          aria-label="2 stars"
        >

          ★

        </button>


        <button
          type="button"
          class="star"
          data-rating="3"
          aria-label="3 stars"
        >

          ★

        </button>


        <button
          type="button"
          class="star"
          data-rating="4"
          aria-label="4 stars"
        >

          ★

        </button>


        <button
          type="button"
          class="star"
          data-rating="5"
          aria-label="5 stars"
        >

          ★

        </button>


      </div>


      <div
        class="rating-text"
        id="ratingText"
      >

        Tap a star to rate your experience

      </div>


      <!-- =================================================
           MESSAGE
           ================================================= -->

      <section
        class="message"
        id="message"
      >


        <h2
          id="messageTitle"
        ></h2>


        <p
          id="messageText"
        ></p>


        <!-- ===============================================
             GOOGLE
             =============================================== -->

        <div
          id="googleArea"
          class="google-area hidden"
        >


          <a
            id="googleButton"
            class="google-button"
            href="#"
            target="_blank"
            rel="noopener"
          >

            <span
              class="google-g"
              aria-hidden="true"
            ></span>


            <span>

              Share your experience on Google

            </span>

          </a>


          <div class="google-note">

            Your review helps this business grow.

          </div>


        </div>


        <!-- ===============================================
             PRIVATE FEEDBACK
             =============================================== -->

        <div
          id="privateArea"
          class="private-area hidden"
        >


          <textarea
            id="feedbackMessage"
            placeholder="Tell us what went wrong or how we can improve..."
            aria-label="Private feedback"
          ></textarea>


          <button
            type="button"
            id="sendPrivate"
            class="private-button"
          >

            💬 Send privately

          </button>


        </div>


      </section>


    </section>


    <!-- ===================================================
         SMART REVIEW BRAND
         =================================================== -->

    <footer class="smart-brand">


      <div class="brand-divider"></div>


      <div class="smart-review">

        Smart Review

      </div>


      <div class="smart-review-sub">

        Better feedback. Better businesses.

      </div>


    </footer>


  </main>

</div>



<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        method:"GET",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* =======================================================
     NO CARD CODE
     ======================================================= */

  if(!cardCode){

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try{

    /* =====================================================
       FIND CARD
       ===================================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* =====================================================
       FIND BUSINESS
       ===================================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* =====================================================
       BUSINESS NAME
       ===================================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Smart Review`;


    subtitle.textContent =
      "Your opinion matters to us.";


    /* =====================================================
       LOGO
       ===================================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW URL
       ===================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* =====================================================
       SHOW FEEDBACK
       ===================================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   ELEMENTS
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR SYSTEM
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {


        selectedRating =
          Number(
            star.dataset.rating
          );


        /* ===============================================
           HIGHLIGHT STARS
           =============================================== */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        /* ===============================================
           RATING TEXT
           =============================================== */

        const ratingLabels = {

          1:
            "We're sorry. We'd like to do better.",

          2:
            "Thanks for telling us.",

          3:
            "Thanks for your feedback.",

          4:
            "Great to hear!",

          5:
            "Amazing! We're thrilled!"

        };


        ratingText.textContent =
          ratingLabels[selectedRating] ||
          `${selectedRating} out of 5 stars`;


        /* ===============================================
           REPLAY MESSAGE ANIMATION
           =============================================== */

        message.classList.remove(
          "show"
        );


        requestAnimationFrame(
          () => {

            requestAnimationFrame(
              () => {

                message.classList.add(
                  "show"
                );

              }
            );

          }
        );


        /* ===============================================
           1–2 STARS
           =============================================== */

        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* ===============================================
           3–5 STARS
           =============================================== */

        else{

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(selectedRating === 3){

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if(selectedRating === 4){

            messageTitle.textContent =
              "We're glad you enjoyed it!";

          }

          else{

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   PRIVATE WHATSAPP FEEDBACK
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {


      const button =
        document.getElementById(
          "sendPrivate"
        );


      const text =
        feedbackMessage
          .value
          .trim();


      /* ===================================================
         CHECK BUSINESS
         =================================================== */

      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      /* ===================================================
         CHECK WHATSAPP
         =================================================== */

      if(
        !currentBusiness.whatsapp_number
      ){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      /* ===================================================
         CLEAN NUMBER
         =================================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      /* ===================================================
         ALGERIA NUMBER
         =================================================== */

      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      /* ===================================================
         MESSAGE
         =================================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      /* ===================================================
         ENCODE
         =================================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* ===================================================
         URL
         =================================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* ===================================================
         ACTIVE BUTTON STATE
         =================================================== */

      button.classList.add(
        "sending"
      );


      button.textContent =
        "✓ Opening WhatsApp…";


      button.disabled =
        true;


      /* ===================================================
         OPEN
         =================================================== */

      setTimeout(
        () => {

          window.location.href =
            whatsappURL;

        },
        350
      );

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>
