<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Customer Feedback</title>

<style>

/* =========================================================
   SMART REVIEW — AAA FULL SCREEN EXPERIENCE
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  width:100%;
  min-height:100%;
  background:#040912;
}

body{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 12%,
      rgba(105,145,190,.13),
      transparent 34%
    ),
    radial-gradient(
      circle at 50% 88%,
      rgba(130,155,185,.08),
      transparent 34%
    ),
    radial-gradient(
      circle at 10% 50%,
      rgba(30,75,120,.10),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #07111f 0%,
      #040912 100%
    );

  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,
a,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   APP
   ========================================================= */

.app{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}


/* =========================================================
   PREMIUM BACKGROUND GLOW
   ========================================================= */

.top-glow{
  position:absolute;

  width:650px;
  height:650px;

  top:-300px;
  left:50%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(180,205,230,.12) 0%,
      rgba(100,140,180,.06) 30%,
      transparent 70%
    );

  pointer-events:none;

  filter:blur(2px);
}


/* =========================================================
   MAIN — TRUE CENTER
   ========================================================= */

.main{
  width:100%;
  max-width:760px;

  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;

  padding:
    max(32px,env(safe-area-inset-top))
    24px
    max(32px,env(safe-area-inset-bottom))
    24px;

  position:relative;
  z-index:2;
}


/* =========================================================
   CENTER CONTENT GROUP
   ========================================================= */

.business-section,
.feedback-area{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
}


/* =========================================================
   BUSINESS BRANDING
   ========================================================= */

.business-section{
  animation:
    contentEnter .65s cubic-bezier(.2,.8,.2,1) both;
}


.logo{
  width:138px;
  height:138px;

  border-radius:36px;

  background:
    linear-gradient(
      145deg,
      #193451,
      #0a1728
    );

  border:
    1px solid rgba(220,235,250,.15);

  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    0 0 0 8px rgba(170,200,230,.025),
    inset 0 1px 0 rgba(255,255,255,.10);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  font-size:60px;

  margin-bottom:25px;

  flex-shrink:0;

  animation:
    logoEnter .7s cubic-bezier(.2,.8,.2,1) both;
}


.logo img{
  width:100%;
  height:100%;

  object-fit:cover;
}


@keyframes logoEnter{

  from{
    opacity:0;
    transform:
      translateY(-18px)
      scale(.86);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


/* =========================================================
   BUSINESS NAME
   ========================================================= */

.business-name{
  font-size:
    clamp(31px,7vw,50px);

  line-height:1.08;

  font-weight:850;

  letter-spacing:-1.4px;

  color:#ffffff;

  max-width:100%;

  overflow-wrap:anywhere;

  margin-bottom:12px;
}


.subtitle{
  color:#aebdce;

  font-size:
    clamp(17px,4.4vw,22px);

  line-height:1.45;

  max-width:600px;

  margin-bottom:34px;
}


/* =========================================================
   FEEDBACK
   ========================================================= */

.feedback-area{
  animation:
    contentEnter .6s .1s cubic-bezier(.2,.8,.2,1) both;
}


@keyframes contentEnter{

  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   RATING QUESTION
   ========================================================= */

.rating-question{
  font-size:
    clamp(21px,5vw,29px);

  font-weight:750;

  color:#f4f7fa;

  margin-bottom:24px;

  letter-spacing:-.35px;
}


/* =========================================================
   STARS
   ========================================================= */

.stars{
  width:100%;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:
    clamp(4px,2vw,14px);

  margin-bottom:17px;
}


.star{
  appearance:none;
  -webkit-appearance:none;

  border:0;
  outline:none;

  background:transparent !important;

  color:#46566c;

  width:
    clamp(55px,14vw,94px);

  height:
    clamp(65px,16vw,102px);

  padding:0;
  margin:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:
    clamp(54px,15vw,90px);

  line-height:1;

  cursor:pointer;

  border-radius:20px;

  position:relative;

  transition:
    color .22s ease,
    transform .18s cubic-bezier(.2,.8,.2,1),
    filter .22s ease;

  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;

  user-select:none;
  -webkit-user-select:none;

  touch-action:manipulation;

  box-shadow:none !important;
}


/* Remove ugly mobile focus box */

.star:focus{
  outline:none !important;
  background:transparent !important;
  box-shadow:none !important;
}


/* Keyboard accessibility */

.star:focus-visible{
  outline:
    3px solid rgba(180,205,230,.65) !important;

  outline-offset:4px;

  background:transparent !important;
}


/* Press */

.star:active{
  transform:scale(.84);

  background:transparent !important;
}


/* Selected */

.star.active{
  color:#ffc83d;

  filter:
    drop-shadow(
      0 5px 15px
      rgba(255,200,61,.25)
    );

  animation:
    starPop .34s cubic-bezier(.2,.9,.25,1.4);
}


@keyframes starPop{

  0%{
    transform:scale(.72);
  }

  55%{
    transform:scale(1.18);
  }

  78%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{
  min-height:31px;

  color:#aebdce;

  font-size:
    clamp(15px,4vw,19px);

  font-weight:600;

  text-align:center;

  margin-bottom:25px;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{
  width:100%;

  display:none;

  text-align:center;

  animation:
    messageEnter .4s cubic-bezier(.2,.8,.2,1) both;
}


.message.show{
  display:block;
}


@keyframes messageEnter{

  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


.message h2{
  font-size:
    clamp(22px,5.5vw,31px);

  line-height:1.2;

  font-weight:800;

  letter-spacing:-.45px;

  margin-bottom:10px;
}


.message p{
  color:#aebdce;

  font-size:
    clamp(16px,4vw,19px);

  line-height:1.55;

  max-width:620px;

  margin:
    0 auto 23px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.button{
  width:100%;

  min-height:70px;

  padding:18px 22px;

  border-radius:20px;

  border:none;

  text-decoration:none;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:
    clamp(17px,4.3vw,21px);

  font-weight:800;

  cursor:pointer;

  margin-top:12px;

  transition:
    transform .16s ease,
    box-shadow .2s ease,
    opacity .2s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;
}


.button:active{
  transform:scale(.975);
}


/* Google */

.google{
  background:
    linear-gradient(
      135deg,
      #ffffff,
      #e9eef3
    );

  color:#101722;

  box-shadow:
    0 16px 40px rgba(0,0,0,.30);
}


.google:hover{
  box-shadow:
    0 20px 48px rgba(0,0,0,.36);

  transform:translateY(-2px);
}


/* Private */

.private{
  background:
    linear-gradient(
      135deg,
      #244b70,
      #173650
    );

  color:#fff;

  border:
    1px solid rgba(220,235,250,.13);

  box-shadow:
    0 16px 40px rgba(0,0,0,.27);
}


/* =========================================================
   TEXTAREA
   ========================================================= */

textarea{
  width:100%;

  min-height:155px;

  resize:none;

  padding:18px;

  border-radius:20px;

  border:
    1px solid rgba(220,235,250,.12);

  background:
    rgba(3,9,16,.78);

  color:#fff;

  font-size:
    clamp(16px,4vw,19px);

  line-height:1.5;

  outline:none;

  margin-bottom:7px;

  -webkit-appearance:none;
}


textarea::placeholder{
  color:#718196;
}


textarea:focus{
  border-color:
    rgba(180,205,230,.50);

  box-shadow:
    0 0 0 4px
    rgba(180,205,230,.07);
}


/* =========================================================
   SMART REVIEW — HERO BRANDING
   ========================================================= */

.brand-footer{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  margin-top:34px;

  padding:0 0 4px;

  animation:
    brandEnter .7s .25s cubic-bezier(.2,.8,.2,1) both;
}


@keyframes brandEnter{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* Elegant separator */

.brand-line{
  width:130px;
  height:1px;

  margin-bottom:20px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(180,205,230,.65),
      transparent
    );

  box-shadow:
    0 0 16px rgba(170,200,230,.12);
}


/* =========================================================
   SMART REVIEW WORDMARK
   ========================================================= */

.smart-review{

  font-size:
    clamp(30px,8vw,46px);

  line-height:1;

  font-weight:800;

  letter-spacing:
    clamp(3px,1vw,6px);

  text-transform:uppercase;

  /* Premium silver metallic gradient */

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #e8edf2 25%,
      #aeb9c5 52%,
      #f7f9fb 75%,
      #9da9b6 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  /* Subtle metallic depth */

  text-shadow:
    0 0 20px rgba(190,210,230,.08),
    0 8px 30px rgba(0,0,0,.28);

  position:relative;
}


/* Subtle premium shine */

.smart-review::after{

  content:"";

  position:absolute;

  left:0;
  right:0;

  bottom:-7px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(220,235,250,.35),
      transparent
    );

  opacity:.7;
}


/* =========================================================
   SMART REVIEW SUBLINE
   ========================================================= */

.smart-review-sub{

  margin-top:17px;

  color:#7f91a5;

  font-size:
    clamp(12px,3vw,15px);

  font-weight:650;

  letter-spacing:
    clamp(2px,0.7vw,3px);

  text-transform:uppercase;

  line-height:1;

}


/* =========================================================
   LOADING
   ========================================================= */

.error{
  color:#ff9090;
}


.hidden{
  display:none !important;
}


.loading-dot{
  display:inline-block;

  width:8px;
  height:8px;

  border-radius:50%;

  background:#b9c9d9;

  margin:0 3px;

  animation:
    loadingPulse 1s infinite ease-in-out;
}


.loading-dot:nth-child(2){
  animation-delay:.15s;
}


.loading-dot:nth-child(3){
  animation-delay:.3s;
}


@keyframes loadingPulse{

  0%,80%,100%{
    opacity:.25;
    transform:scale(.75);
  }

  40%{
    opacity:1;
    transform:scale(1);
  }

}


/* =========================================================
   SHORT MOBILE HEIGHT
   ========================================================= */

@media(max-height:760px){

  .main{
    justify-content:flex-start;

    padding-top:
      max(24px,env(safe-area-inset-top));
  }

  .logo{
    width:105px;
    height:105px;

    border-radius:29px;

    margin-bottom:17px;
  }

  .business-name{
    font-size:30px;
  }

  .subtitle{
    margin-bottom:22px;
  }

  .rating-question{
    margin-bottom:15px;
  }

  .star{
    height:65px;
    font-size:55px;
  }

  .rating-text{
    margin-bottom:18px;
  }

  .brand-footer{
    margin-top:24px;
  }

}


/* =========================================================
   SMALL MOBILE WIDTH
   ========================================================= */

@media(max-width:390px){

  .main{
    padding-left:14px;
    padding-right:14px;
  }

  .logo{
    width:102px;
    height:102px;
  }

  .business-name{
    font-size:29px;
  }

  .stars{
    gap:0;
  }

  .star{
    width:59px;
    height:67px;
    font-size:55px;
  }

  .smart-review{
    font-size:30px;
    letter-spacing:3px;
  }

}


/* =========================================================
   TABLET / DESKTOP
   ========================================================= */

@media(min-width:700px){

  .main{
    max-width:820px;

    padding-left:40px;
    padding-right:40px;
  }

  .logo{
    width:150px;
    height:150px;
  }

  .smart-review{
    font-size:48px;
  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }

}

</style>
</head>


<body>

<div class="app">

  <div class="top-glow"></div>


  <main class="main">


    <!-- =====================================================
         BUSINESS
         ===================================================== -->

    <section class="business-section">

      <div
        class="logo"
        id="logo"
        aria-label="Business logo"
      >
        🍽️
      </div>


      <h1
        class="business-name"
        id="businessName"
      >
        Loading...
      </h1>


      <p
        class="subtitle"
        id="subtitle"
      >
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </p>

    </section>


    <!-- =====================================================
         FEEDBACK
         ===================================================== -->

    <section
      id="feedbackArea"
      class="feedback-area hidden"
    >

      <div class="rating-question">
        How was your experience?
      </div>


      <!-- STARS -->

      <div
        class="stars"
        id="stars"
        role="radiogroup"
        aria-label="Rate your experience"
      >

        <button
          type="button"
          class="star"
          data-rating="1"
          aria-label="1 star"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="2"
          aria-label="2 stars"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="3"
          aria-label="3 stars"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="4"
          aria-label="4 stars"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="5"
          aria-label="5 stars"
        >★</button>

      </div>


      <div
        class="rating-text"
        id="ratingText"
      >
        Tap a star to rate your experience
      </div>


      <!-- ===================================================
           MESSAGE
           =================================================== -->

      <section
        class="message"
        id="message"
      >

        <h2 id="messageTitle"></h2>

        <p id="messageText"></p>


        <!-- GOOGLE -->

        <div
          id="googleArea"
          class="hidden"
        >

          <a
            id="googleButton"
            class="button google"
            href="#"
            target="_blank"
            rel="noopener"
          >
            ⭐ Leave us a Google review
          </a>

        </div>


        <!-- PRIVATE -->

        <div
          id="privateArea"
          class="hidden"
        >

          <textarea
            id="feedbackMessage"
            placeholder="Tell us what went wrong or how we can improve..."
            aria-label="Private feedback"
          ></textarea>


          <button
            type="button"
            id="sendPrivate"
            class="button private"
          >
            💬 Send privately
          </button>

        </div>

      </section>

    </section>


    <!-- =====================================================
         SMART REVIEW
         ===================================================== -->

    <footer class="brand-footer">

      <div class="brand-line"></div>

      <div class="smart-review">
        Smart Review
      </div>

      <div class="smart-review-sub">
        Better feedback. Better businesses.
      </div>

    </footer>

  </main>

</div>



<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"
        }
      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  if(!cardCode){

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try{

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Smart Review`;


    subtitle.textContent =
      "Your opinion matters to us.";


    /* =====================================================
       LOGO
       ===================================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML = "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW LINK
       ===================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {

        selectedRating =
          Number(
            star.dataset.rating
          );


        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        const ratingLabels = {

          1:
            "We'd like to do better.",

          2:
            "Thanks for telling us.",

          3:
            "Thanks for your feedback.",

          4:
            "Great to hear!",

          5:
            "Amazing! We're thrilled!"

        };


        ratingText.textContent =
          ratingLabels[selectedRating] ||
          `${selectedRating} out of 5 stars`;


        message.classList.remove(
          "show"
        );


        requestAnimationFrame(
          () => {

            message.classList.add(
              "show"
            );

          }
        );


        /* =================================================
           1–2 STARS
           ================================================= */

        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* =================================================
           3–5 STARS
           ================================================= */

        else{

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(selectedRating === 3){

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if(selectedRating === 4){

            messageTitle.textContent =
              "We're glad you enjoyed it!";

          }

          else{

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {

      const text =
        feedbackMessage
          .value
          .trim();


      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      if(
        !currentBusiness.whatsapp_number
      ){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>
