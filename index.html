<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Customer Feedback</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  min-height:100%;
}

body{
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(34,65,100,.55),
      transparent 45%
    ),
    #07111f;

  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:
    max(22px, env(safe-area-inset-top))
    max(18px, env(safe-area-inset-right))
    max(22px, env(safe-area-inset-bottom))
    max(18px, env(safe-area-inset-left));

  overflow-x:hidden;
}


/* =========================================================
   MAIN CARD
========================================================= */

.card{

  width:100%;

  /*
    Bigger than before.
    Still responsive so it never becomes wider
    than the available screen.
  */

  max-width:520px;

  min-height:650px;

  background:
    linear-gradient(
      145deg,
      rgba(17,36,59,.98),
      rgba(9,23,39,.98)
    );

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:32px;

  padding:52px 38px 38px;

  text-align:center;

  box-shadow:
    0 35px 100px rgba(0,0,0,.42),
    0 0 0 1px rgba(255,255,255,.015);

  position:relative;

  overflow:hidden;

}


/* subtle premium glow */

.card::before{

  content:"";

  position:absolute;

  width:300px;
  height:300px;

  top:-180px;
  left:50%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(255,200,61,.12),
      transparent 70%
    );

  pointer-events:none;

}


/* =========================================================
   LOGO
========================================================= */

.logo{

  width:94px;
  height:94px;

  border-radius:27px;

  margin:0 auto 23px;

  background:
    linear-gradient(
      145deg,
      #183653,
      #10263e
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:42px;

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 14px 35px rgba(0,0,0,.25);

  overflow:hidden;

  position:relative;

  z-index:1;

}


.logo img{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

}


/* =========================================================
   BUSINESS NAME
========================================================= */

h1{

  font-size:31px;

  line-height:1.15;

  margin-bottom:10px;

  letter-spacing:-.7px;

  font-weight:800;

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

  color:#9eacbd;

  font-size:16px;

  line-height:1.55;

  margin-bottom:38px;

}


/* =========================================================
   STARS
========================================================= */

.stars{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:9px;

  margin-bottom:17px;

}


.star{

  border:none;

  background:transparent;

  color:#536174;

  font-size:52px;

  line-height:1;

  cursor:pointer;

  padding:4px;

  appearance:none;

  -webkit-appearance:none;

  transition:
    transform .16s ease,
    color .16s ease,
    filter .16s ease;

  outline:none;

  -webkit-tap-highlight-color:transparent;

}


/*
  IMPORTANT:
  Keep the active class behavior stable.
*/

.star.active{

  color:#ffc83d;

  filter:
    drop-shadow(
      0 0 8px rgba(255,200,61,.25)
    );

}


.star:hover{

  transform:scale(1.12);

}


.star:active{

  transform:scale(.94);

}


/* =========================================================
   RATING TEXT
========================================================= */

.rating-text{

  min-height:26px;

  color:#b8c3d1;

  font-size:15px;

  margin-bottom:30px;

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

  display:none;

  text-align:left;

  animation:
    appear .25s ease;

}


.message.show{

  display:block;

}


@keyframes appear{

  from{

    opacity:0;

    transform:
      translateY(10px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   MESSAGE TITLE
========================================================= */

.message h2{

  font-size:21px;

  line-height:1.3;

  margin-bottom:9px;

}


/* =========================================================
   MESSAGE TEXT
========================================================= */

.message p{

  color:#aab7c7;

  font-size:15px;

  line-height:1.55;

  margin-bottom:20px;

}


/* =========================================================
   TEXTAREA
========================================================= */

textarea{

  width:100%;

  min-height:145px;

  resize:vertical;

  padding:16px;

  border-radius:17px;

  border:
    1px solid rgba(255,255,255,.11);

  background:#07111f;

  color:white;

  font-family:inherit;

  font-size:15px;

  line-height:1.5;

  outline:none;

  margin-bottom:11px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;

}


textarea:focus{

  border-color:#607994;

  box-shadow:
    0 0 0 3px rgba(96,121,148,.10);

}


textarea::placeholder{

  color:#65758a;

}


/* =========================================================
   BUTTONS
========================================================= */

.button{

  display:block;

  width:100%;

  padding:16px 20px;

  border-radius:16px;

  border:none;

  text-decoration:none;

  font-size:16px;

  font-weight:750;

  cursor:pointer;

  margin-top:12px;

  text-align:center;

  transition:
    transform .15s ease,
    opacity .15s ease,
    box-shadow .15s ease;

}


.button:active{

  transform:scale(.985);

}


.google{

  background:#fff;

  color:#111827;

  box-shadow:
    0 8px 24px rgba(0,0,0,.18);

}


.private{

  background:
    linear-gradient(
      135deg,
      #203b59,
      #172f49
    );

  color:white;

  border:
    1px solid rgba(255,255,255,.07);

}


.google:hover,
.private:hover{

  opacity:.94;

}


/* =========================================================
   SMALL FOOTER
========================================================= */

.small{

  margin-top:28px;

  color:#66758a;

  font-size:12px;

}


/* =========================================================
   ERROR
========================================================= */

.error{

  color:#ff8f8f;

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{

  display:none !important;

}


/* =========================================================
   TABLET / LARGE PHONE
========================================================= */

@media (min-width:600px){

  body{

    padding:35px;

  }

  .card{

    max-width:540px;

    min-height:680px;

    padding:
      58px
      46px
      42px;

  }

  .logo{

    width:100px;
    height:100px;

  }

  h1{

    font-size:33px;

  }

  .stars{

    gap:10px;

  }

  .star{

    font-size:55px;

  }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width:430px){

  body{

    align-items:center;

    padding:
      16px
      12px
      16px
      12px;

  }

  .card{

    max-width:none;

    min-height:620px;

    border-radius:29px;

    padding:
      42px
      22px
      30px;

  }

  .logo{

    width:86px;
    height:86px;

    border-radius:24px;

    margin-bottom:20px;

    font-size:38px;

  }

  h1{

    font-size:28px;

  }

  .subtitle{

    font-size:15px;

    margin-bottom:32px;

  }

  .stars{

    gap:5px;

  }

  .star{

    font-size:45px;

    padding:3px;

  }

  .rating-text{

    font-size:14px;

    margin-bottom:25px;

  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width:360px){

  .card{

    padding:
      34px
      17px
      27px;

  }

  .logo{

    width:78px;
    height:78px;

  }

  h1{

    font-size:25px;

  }

  .subtitle{

    margin-bottom:27px;

  }

  .stars{

    gap:2px;

  }

  .star{

    font-size:39px;

  }

}


/* =========================================================
   SHORT SCREENS
========================================================= */

@media (max-height:720px){

  body{

    align-items:flex-start;

  }

  .card{

    margin-top:10px;

    min-height:auto;

    padding-top:32px;

    padding-bottom:28px;

  }

  .logo{

    width:76px;
    height:76px;

    margin-bottom:16px;

  }

  h1{

    font-size:27px;

  }

  .subtitle{

    margin-bottom:24px;

  }

  .stars{

    margin-bottom:12px;

  }

  .star{

    font-size:43px;

  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion:reduce){

  *{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

  }

}

</style>
</head>


<body>


<main class="card">


  <!-- =====================================================
       LOGO
  ====================================================== -->

  <div
    class="logo"
    id="logo">

    🍽️

  </div>


  <!-- =====================================================
       BUSINESS NAME
  ====================================================== -->

  <h1 id="businessName">

    Loading...

  </h1>


  <!-- =====================================================
       SUBTITLE
  ====================================================== -->

  <p
    class="subtitle"
    id="subtitle">

    Loading your experience...

  </p>


  <!-- =====================================================
       FEEDBACK AREA
  ====================================================== -->

  <div
    id="feedbackArea"
    class="hidden">


    <!-- ===================================================
         STARS
    ==================================================== -->

    <div
      class="stars"
      id="stars">

      <button
        type="button"
        class="star"
        data-rating="1"
        aria-label="1 star">

        ★

      </button>

      <button
        type="button"
        class="star"
        data-rating="2"
        aria-label="2 stars">

        ★

      </button>

      <button
        type="button"
        class="star"
        data-rating="3"
        aria-label="3 stars">

        ★

      </button>

      <button
        type="button"
        class="star"
        data-rating="4"
        aria-label="4 stars">

        ★

      </button>

      <button
        type="button"
        class="star"
        data-rating="5"
        aria-label="5 stars">

        ★

      </button>

    </div>


    <!-- ===================================================
         RATING TEXT
    ==================================================== -->

    <div
      class="rating-text"
      id="ratingText">

      Tap a star to rate your experience

    </div>


    <!-- ===================================================
         MESSAGE
    ==================================================== -->

    <section
      class="message"
      id="message">


      <h2
        id="messageTitle">
      </h2>


      <p
        id="messageText">
      </p>


      <!-- =================================================
           3–5 STARS → GOOGLE
      ================================================== -->

      <div
        id="googleArea"
        class="hidden">


        <a
          id="googleButton"
          class="button google"
          href="#"
          target="_blank"
          rel="noopener">

          ⭐ Leave us a Google review

        </a>


      </div>


      <!-- =================================================
           1–2 STARS → PRIVATE WHATSAPP
      ================================================== -->

      <div
        id="privateArea"
        class="hidden">


        <textarea
          id="feedbackMessage"
          placeholder="Tell us what went wrong or how we can improve..."
        ></textarea>


        <button
          type="button"
          id="sendPrivate"
          class="button private">

          💬 Send privately

        </button>


      </div>


    </section>


  </div>


  <div class="small">

    Your feedback helps us improve.

  </div>


</main>



<script>


/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"
        }
      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  if(!cardCode){

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try{


    /* ==========================================
       FIND CARD
    ========================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* ==========================================
       FIND BUSINESS
    ========================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* ==========================================
       BUSINESS NAME
    ========================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Your Experience`;


    subtitle.textContent =
      "How was your experience with us?";


    /* ==========================================
       LOGO
    ========================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      logo.appendChild(
        image
      );

    }


    /* ==========================================
       GOOGLE REVIEW LINK
    ========================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* ==========================================
       SHOW PAGE
    ========================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(error);


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {

        selectedRating =
          Number(
            star.dataset.rating
          );


        /* ==========================================
           HIGHLIGHT SELECTED STARS
        ========================================== */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        ratingText.textContent =
          `${selectedRating} out of 5 stars`;


        message.classList.add(
          "show"
        );


        /* ==========================================
           1–2 STARS
        ========================================== */

        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* ==========================================
           3–5 STARS
        ========================================== */

        else{

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(selectedRating === 3){

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if(selectedRating === 4){

            messageTitle.textContent =
              "We're glad you enjoyed your experience!";

          }

          else{

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {


      const text =
        feedbackMessage
          .value
          .trim();


      /* ==========================================
         CHECK BUSINESS
      ========================================== */

      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      /* ==========================================
         CHECK WHATSAPP
      ========================================== */

      if(!currentBusiness.whatsapp_number){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      /* ==========================================
         CLEAN NUMBER
      ========================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      /* ==========================================
         ALGERIAN NUMBER
      ========================================== */

      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      /* ==========================================
         CREATE MESSAGE
      ========================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      /* ==========================================
         ENCODE
      ========================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* ==========================================
         WHATSAPP URL
      ========================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* ==========================================
         OPEN WHATSAPP
      ========================================== */

      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
========================================================= */

loadCard();

</script>

</body>
</html>
