<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#07111f">

  <title>Customer Feedback</title>


  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      width: 100%;
      min-height: 100%;
      background: #07111f;
    }


    body {

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(36, 72, 111, 0.38),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #07111f 0%,
          #081421 50%,
          #06101c 100%
        );

      color: white;

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

    }


    button,
    textarea,
    input {
      font: inherit;
    }


    button {
      -webkit-tap-highlight-color: transparent;
    }


    /* =====================================================
       APP
       ===================================================== */

    .app {

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;

      position: relative;

      overflow: hidden;

    }


    /* =====================================================
       DECORATIVE BACKGROUND
       ===================================================== */

    .background-glow {

      position: fixed;

      width: 420px;
      height: 420px;

      left: 50%;
      top: -250px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 200, 61, 0.09),
          transparent 68%
        );

      pointer-events: none;

      z-index: 0;

    }


    .background-glow.two {

      width: 300px;
      height: 300px;

      top: auto;
      bottom: -180px;

      background:
        radial-gradient(
          circle,
          rgba(43, 112, 178, 0.10),
          transparent 68%
        );

    }


    /* =====================================================
       MAIN CONTENT
       ===================================================== */

    .content {

      position: relative;
      z-index: 1;

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;

      padding:
        clamp(34px, 7vh, 72px)
        clamp(22px, 6vw, 70px)
        clamp(28px, 6vh, 55px);

    }


    /* =====================================================
       BUSINESS HEADER
       ===================================================== */

    .business-header {

      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      margin-bottom:
        clamp(30px, 6vh, 55px);

    }


    .logo {

      width:
        clamp(88px, 22vw, 128px);

      height:
        clamp(88px, 22vw, 128px);

      border-radius:
        clamp(25px, 6vw, 34px);

      margin-bottom: 22px;

      background:
        linear-gradient(
          145deg,
          #172f4a,
          #0d2034
        );

      border:
        1px solid rgba(255,255,255,.11);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size:
        clamp(38px, 9vw, 54px);

      overflow: hidden;

      box-shadow:
        0 18px 50px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.06);

    }


    .logo img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

    }


    h1 {

      font-size:
        clamp(28px, 7vw, 42px);

      line-height: 1.1;

      font-weight: 800;

      letter-spacing: -.7px;

      max-width: 850px;

      margin-bottom: 11px;

    }


    .subtitle {

      color: #9eacbd;

      font-size:
        clamp(15px, 3.8vw, 19px);

      line-height: 1.55;

      max-width: 650px;

    }


    /* =====================================================
       FEEDBACK AREA
       ===================================================== */

    #feedbackArea {

      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      flex: 1;

    }


    .hidden {

      display: none !important;

    }


    /* =====================================================
       STAR AREA
       ===================================================== */

    .rating-section {

      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

    }


    .stars {

      width: 100%;

      display: flex;

      justify-content: center;
      align-items: center;

      gap:
        clamp(5px, 2vw, 18px);

      margin-bottom: 16px;

    }


    .star {

      border: none;

      background: transparent;

      color: #3c4b5e;

      font-size:
        clamp(55px, 13vw, 88px);

      line-height: 1;

      cursor: pointer;

      padding:
        clamp(3px, 1vw, 8px);

      width:
        clamp(58px, 15vw, 105px);

      height:
        clamp(68px, 16vw, 105px);

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        color .18s ease,
        transform .18s cubic-bezier(.2,.8,.2,1),
        filter .18s ease;

      transform-origin: center;

    }


    .star:hover {

      transform: scale(1.08);

      color: #69798c;

    }


    .star:active {

      transform: scale(.88);

    }


    .star.active {

      color: #ffc83d;

      filter:
        drop-shadow(
          0 0 13px
          rgba(255,200,61,.24)
        );

      animation:
        starPop .28s cubic-bezier(.2,.9,.3,1.4);

    }


    @keyframes starPop {

      0% {
        transform: scale(.72);
      }

      55% {
        transform: scale(1.17);
      }

      100% {
        transform: scale(1);
      }

    }


    .rating-text {

      min-height: 28px;

      color: #aebbc9;

      font-size:
        clamp(14px, 3.6vw, 17px);

      font-weight: 500;

      text-align: center;

      margin-bottom:
        clamp(25px, 5vh, 42px);

      transition:
        opacity .2s ease,
        transform .2s ease;

    }


    /* =====================================================
       MESSAGE PANEL
       ===================================================== */

    .message {

      width: 100%;

      max-width: 760px;

      text-align: center;

      padding:
        clamp(20px, 5vw, 34px);

      border-radius:
        clamp(22px, 5vw, 30px);

      background:
        linear-gradient(
          145deg,
          rgba(18,39,61,.88),
          rgba(9,25,41,.78)
        );

      border:
        1px solid rgba(255,255,255,.075);

      box-shadow:
        0 25px 70px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.035);

      animation:
        messageIn .28s cubic-bezier(.2,.8,.2,1);

    }


    @keyframes messageIn {

      from {
        opacity: 0;
        transform: translateY(14px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    .message h2 {

      font-size:
        clamp(21px, 5.5vw, 30px);

      line-height: 1.2;

      margin-bottom: 10px;

      letter-spacing: -.35px;

    }


    .message p {

      color: #aab7c7;

      font-size:
        clamp(14px, 3.7vw, 17px);

      line-height: 1.55;

      margin-bottom: 22px;

    }


    /* =====================================================
       TEXTAREA
       ===================================================== */

    textarea {

      width: 100%;

      min-height:
        clamp(130px, 24vh, 190px);

      resize: vertical;

      padding:
        clamp(15px, 4vw, 20px);

      border-radius:
        clamp(16px, 4vw, 20px);

      border:
        1px solid rgba(255,255,255,.10);

      background:
        rgba(4,14,25,.82);

      color: white;

      font-size:
        clamp(15px, 4vw, 17px);

      line-height: 1.55;

      outline: none;

      margin-bottom: 10px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;

    }


    textarea::placeholder {

      color: #66778b;

    }


    textarea:focus {

      border-color:
        rgba(255,200,61,.42);

      box-shadow:
        0 0 0 4px
        rgba(255,200,61,.055);

    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    .button {

      display: flex;

      width: 100%;

      min-height:
        clamp(58px, 9vh, 72px);

      padding:
        15px 20px;

      border-radius:
        clamp(16px, 4vw, 20px);

      border: none;

      text-decoration: none;

      font-size:
        clamp(15px, 4vw, 18px);

      font-weight: 750;

      cursor: pointer;

      margin-top: 12px;

      text-align: center;

      align-items: center;
      justify-content: center;

      transition:
        transform .15s ease,
        opacity .15s ease,
        box-shadow .2s ease;

    }


    .button:hover {

      transform: translateY(-2px);

    }


    .button:active {

      transform: scale(.975);

    }


    .google {

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #e9edf2
        );

      color: #101722;

      box-shadow:
        0 12px 30px rgba(0,0,0,.22);

    }


    .google:hover {

      box-shadow:
        0 16px 36px rgba(0,0,0,.28);

    }


    .private {

      background:
        linear-gradient(
          135deg,
          #203c59,
          #152d46
        );

      color: white;

      border:
        1px solid rgba(255,255,255,.07);

      box-shadow:
        0 12px 30px rgba(0,0,0,.20);

    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .small {

      margin-top: auto;

      padding-top:
        clamp(30px, 6vh, 55px);

      text-align: center;

      color: #53657a;

      font-size:
        clamp(11px, 3vw, 13px);

      letter-spacing: .15px;

    }


    /* =====================================================
       ERROR
       ===================================================== */

    .error {

      color: #ff8f8f;

    }


    /* =====================================================
       LARGE SCREENS
       ===================================================== */

    @media (min-width: 700px) {

      .content {

        justify-content: center;

      }


      .business-header {

        margin-bottom: 55px;

      }


      #feedbackArea {

        flex: initial;

      }


      .stars {

        margin-bottom: 20px;

      }


      .message {

        margin-top: 5px;

      }

    }


    /* =====================================================
       VERY SMALL PHONES
       ===================================================== */

    @media (max-height: 680px) {

      .content {

        padding-top: 24px;
        padding-bottom: 20px;

      }


      .business-header {

        margin-bottom: 20px;

      }


      .logo {

        width: 70px;
        height: 70px;

        border-radius: 20px;

        margin-bottom: 12px;

      }


      h1 {

        font-size: 25px;

      }


      .subtitle {

        font-size: 14px;

      }


      .star {

        font-size: 48px;

        width: 53px;
        height: 60px;

      }


      .rating-text {

        margin-bottom: 15px;

      }


      .message {

        padding: 17px;

      }

    }


  </style>

</head>


<body>


<div class="app">


  <div class="background-glow"></div>
  <div class="background-glow two"></div>


  <main class="content">


    <!-- =================================================
         BUSINESS HEADER
         ================================================= -->

    <section class="business-header">


      <div
        class="logo"
        id="logo"
      >
        🍽️
      </div>


      <h1 id="businessName">
        Loading...
      </h1>


      <p
        class="subtitle"
        id="subtitle"
      >
        Loading your experience...
      </p>


    </section>



    <!-- =================================================
         FEEDBACK AREA
         ================================================= -->

    <div
      id="feedbackArea"
      class="hidden"
    >


      <section class="rating-section">


        <!-- STARS -->

        <div
          class="stars"
          id="stars"
        >

          <button
            class="star"
            data-rating="1"
            type="button"
            aria-label="1 star"
          >
            ★
          </button>


          <button
            class="star"
            data-rating="2"
            type="button"
            aria-label="2 stars"
          >
            ★
          </button>


          <button
            class="star"
            data-rating="3"
            type="button"
            aria-label="3 stars"
          >
            ★
          </button>


          <button
            class="star"
            data-rating="4"
            type="button"
            aria-label="4 stars"
          >
            ★
          </button>


          <button
            class="star"
            data-rating="5"
            type="button"
            aria-label="5 stars"
          >
            ★
          </button>

        </div>


        <!-- RATING TEXT -->

        <div
          class="rating-text"
          id="ratingText"
        >
          Tap a star to rate your experience
        </div>


        <!-- =================================================
             MESSAGE
             ================================================= -->

        <section
          class="message"
          id="message"
        >


          <h2
            id="messageTitle"
          ></h2>


          <p
            id="messageText"
          ></p>


          <!-- ===============================================
               3–5 STARS → GOOGLE
               =============================================== -->

          <div
            id="googleArea"
            class="hidden"
          >

            <a
              id="googleButton"
              class="button google"
              href="#"
              target="_blank"
              rel="noopener"
            >
              ⭐ Leave us a Google review
            </a>

          </div>


          <!-- ===============================================
               1–2 STARS → PRIVATE WHATSAPP
               =============================================== -->

          <div
            id="privateArea"
            class="hidden"
          >


            <textarea
              id="feedbackMessage"
              placeholder="Tell us what went wrong or how we can improve..."
            ></textarea>


            <button
              id="sendPrivate"
              class="button private"
              type="button"
            >
              💬 Send privately
            </button>


          </div>


        </section>


      </section>


    </div>


    <!-- FOOTER -->

    <div class="small">

      Your feedback helps us improve.

    </div>


  </main>


</div>



<script>


/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint) {

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        method: "GET",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard() {

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* No card code */

  if (!cardCode) {

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try {

    /* ==========================================
       FIND CARD
       ========================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if (!cards.length) {

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* ==========================================
       FIND BUSINESS
       ========================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if (!businesses.length) {

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* ==========================================
       BUSINESS NAME
       ========================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Your Experience`;


    subtitle.textContent =
      "How was your experience with us?";


    /* ==========================================
       LOGO
       ========================================== */

    if (
      currentBusiness.logo_url
    ) {

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      logo.appendChild(
        image
      );

    }


    /* ==========================================
       GOOGLE REVIEW LINK
       ========================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* ==========================================
       SHOW PAGE
       ========================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch (error) {

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {

        selectedRating =
          Number(
            star.dataset.rating
          );


        /* Highlight stars */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        ratingText.textContent =
          `${selectedRating} out of 5 stars`;


        message.classList.add(
          "show"
        );


        /* ==========================================
           1–2 STARS
           ========================================== */

        if (
          selectedRating <= 2
        ) {

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* ==========================================
           3–5 STARS
           ========================================== */

        else {

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if (
            selectedRating === 3
          ) {

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if (
            selectedRating === 4
          ) {

            messageTitle.textContent =
              "We're glad you enjoyed your experience!";

          }

          else {

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {

      const text =
        feedbackMessage
          .value
          .trim();


      /* ==========================================
         CHECK BUSINESS
         ========================================== */

      if (
        !currentBusiness
      ) {

        alert(
          "Business information is unavailable."
        );

        return;

      }


      /* ==========================================
         CHECK WHATSAPP NUMBER
         ========================================== */

      if (
        !currentBusiness.whatsapp_number
      ) {

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      /* ==========================================
         CLEAN WHATSAPP NUMBER
         ========================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      /*
        Algeria example:

        0555123456

        becomes:

        213555123456
      */

      if (
        number.startsWith("0")
      ) {

        number =
          "213" +
          number.substring(1);

      }


      /* ==========================================
         CREATE BASE MESSAGE
         ========================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      /* ==========================================
         ADD COMMENT ONLY IF PROVIDED
         ========================================== */

      if (text.length > 0) {

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      /* ==========================================
         ENCODE MESSAGE
         ========================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* ==========================================
         CREATE WHATSAPP URL
         ========================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* ==========================================
         OPEN WHATSAPP
         ========================================== */

      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();


</script>


</body>

</html>
