<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Customer Feedback</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}


/* =========================================================
   BODY — APP STYLE
========================================================= */

body{

  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(41,78,120,.65),
      transparent 48%
    ),
    linear-gradient(
      180deg,
      #07111f 0%,
      #050d18 100%
    );

  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);

  overflow-x:hidden;

}


/* =========================================================
   MAIN APP
========================================================= */

.card{

  width:100%;

  /*
    Large application-style surface.
  */

  max-width:580px;

  min-height:
    min(900px, 94dvh);

  background:
    linear-gradient(
      145deg,
      rgba(17,37,61,.99),
      rgba(7,19,33,.99)
    );

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:36px;

  padding:
    58px
    48px
    42px;

  text-align:center;

  position:relative;

  overflow:hidden;

  box-shadow:
    0 40px 120px rgba(0,0,0,.48),
    0 0 0 1px rgba(255,255,255,.015);

}


/* =========================================================
   PREMIUM GLOW
========================================================= */

.card::before{

  content:"";

  position:absolute;

  width:420px;
  height:420px;

  top:-260px;
  left:50%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(255,200,61,.14),
      transparent 68%
    );

  pointer-events:none;

}


/* =========================================================
   LOGO
========================================================= */

.logo{

  width:120px;
  height:120px;

  border-radius:34px;

  margin:
    0 auto
    28px;

  background:
    linear-gradient(
      145deg,
      #1b3d60,
      #102a44
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:52px;

  border:
    1px solid rgba(255,255,255,.13);

  box-shadow:
    0 20px 45px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.05);

  overflow:hidden;

  position:relative;

  z-index:1;

}


.logo img{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

}


/* =========================================================
   BUSINESS NAME
========================================================= */

h1{

  font-size:36px;

  line-height:1.12;

  margin-bottom:12px;

  letter-spacing:-.9px;

  font-weight:850;

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

  color:#a5b3c4;

  font-size:17px;

  line-height:1.55;

  margin-bottom:48px;

}


/* =========================================================
   FEEDBACK AREA
========================================================= */

#feedbackArea{

  width:100%;

}


/* =========================================================
   STARS
========================================================= */

.stars{

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:12px;

  margin-bottom:19px;

}


.star{

  border:none;

  background:transparent;

  color:#536174;

  font-size:61px;

  line-height:1;

  cursor:pointer;

  padding:5px;

  appearance:none;

  -webkit-appearance:none;

  outline:none;

  -webkit-tap-highlight-color:transparent;

  transition:
    transform .16s ease,
    color .16s ease,
    filter .16s ease;

}


/* SELECTED STARS */

.star.active{

  color:#ffc83d;

  filter:
    drop-shadow(
      0 0 10px
      rgba(255,200,61,.28)
    );

}


/* HOVER */

.star:hover{

  transform:scale(1.12);

}


/* PRESS */

.star:active{

  transform:scale(.91);

}


/* =========================================================
   RATING TEXT
========================================================= */

.rating-text{

  min-height:27px;

  color:#bcc7d4;

  font-size:16px;

  margin-bottom:35px;

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

  display:none;

  text-align:left;

  animation:
    appear .25s ease;

}


.message.show{

  display:block;

}


@keyframes appear{

  from{

    opacity:0;

    transform:
      translateY(12px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   MESSAGE TITLE
========================================================= */

.message h2{

  font-size:23px;

  line-height:1.3;

  margin-bottom:10px;

  letter-spacing:-.3px;

}


/* =========================================================
   MESSAGE TEXT
========================================================= */

.message p{

  color:#aab7c7;

  font-size:16px;

  line-height:1.6;

  margin-bottom:22px;

}


/* =========================================================
   TEXTAREA
========================================================= */

textarea{

  width:100%;

  min-height:175px;

  resize:vertical;

  padding:18px;

  border-radius:18px;

  border:
    1px solid rgba(255,255,255,.11);

  background:#07111f;

  color:#fff;

  font-family:inherit;

  font-size:16px;

  line-height:1.55;

  outline:none;

  margin-bottom:12px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;

}


textarea:focus{

  border-color:#607994;

  box-shadow:
    0 0 0 4px
    rgba(96,121,148,.10);

}


textarea::placeholder{

  color:#64758a;

}


/* =========================================================
   BUTTONS
========================================================= */

.button{

  display:block;

  width:100%;

  min-height:60px;

  padding:
    17px
    20px;

  border-radius:18px;

  border:none;

  text-decoration:none;

  font-size:17px;

  font-weight:750;

  cursor:pointer;

  margin-top:13px;

  text-align:center;

  transition:
    transform .15s ease,
    opacity .15s ease,
    box-shadow .15s ease;

}


.button:active{

  transform:scale(.98);

}


.google{

  background:#fff;

  color:#111827;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.20);

}


.private{

  background:
    linear-gradient(
      135deg,
      #244563,
      #172f49
    );

  color:#fff;

  border:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    0 10px 28px
    rgba(0,0,0,.18);

}


.google:hover,
.private:hover{

  opacity:.94;

}


/* =========================================================
   FOOTER
========================================================= */

.small{

  margin-top:38px;

  color:#68788d;

  font-size:12px;

}


/* =========================================================
   ERROR
========================================================= */

.error{

  color:#ff8f8f;

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{

  display:none !important;

}


/* =========================================================
   TABLET / DESKTOP
========================================================= */

@media (min-width:600px){

  body{

    padding:24px;

  }

  .card{

    max-width:600px;

    min-height:
      min(900px, 94dvh);

    padding:
      65px
      55px
      48px;

  }

  .logo{

    width:130px;
    height:130px;

  }

  h1{

    font-size:39px;

  }

  .subtitle{

    font-size:18px;

  }

  .star{

    font-size:66px;

  }

}


/* =========================================================
   PHONES
========================================================= */

@media (max-width:599px){

  body{

    align-items:stretch;

    padding:0;

  }


  .card{

    width:100%;

    max-width:none;

    min-height:
      100vh;

    min-height:
      100dvh;

    height:auto;

    border-radius:0;

    border:none;

    padding:
      max(48px, env(safe-area-inset-top) + 28px)
      25px
      max(34px, env(safe-area-inset-bottom) + 22px);

    display:flex;

    flex-direction:column;

    justify-content:center;

  }


  .logo{

    width:120px;
    height:120px;

    border-radius:34px;

    margin-bottom:25px;

  }


  h1{

    font-size:
      clamp(30px, 8vw, 38px);

  }


  .subtitle{

    font-size:17px;

    margin-bottom:43px;

  }


  .stars{

    gap:
      clamp(4px, 1.8vw, 10px);

  }


  .star{

    font-size:
      clamp(48px, 14vw, 62px);

    padding:4px;

  }


  .rating-text{

    font-size:15px;

    margin-bottom:31px;

  }


  .message h2{

    font-size:22px;

  }


  .message p{

    font-size:15px;

  }


  .small{

    margin-top:31px;

  }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width:380px){

  .card{

    padding-left:18px;
    padding-right:18px;

  }


  .logo{

    width:100px;
    height:100px;

    border-radius:29px;

  }


  h1{

    font-size:28px;

  }


  .subtitle{

    font-size:15px;

    margin-bottom:34px;

  }


  .stars{

    gap:0;

  }


  .star{

    font-size:44px;

  }


  .button{

    min-height:56px;

    font-size:16px;

  }

}


/* =========================================================
   SHORT PHONES
========================================================= */

@media (
  max-height:700px
) and (
  max-width:599px
){

  .card{

    justify-content:flex-start;

    padding-top:
      max(25px, env(safe-area-inset-top) + 15px);

  }


  .logo{

    width:82px;
    height:82px;

    border-radius:24px;

    margin-bottom:15px;

  }


  h1{

    font-size:27px;

    margin-bottom:7px;

  }


  .subtitle{

    font-size:14px;

    margin-bottom:22px;

  }


  .star{

    font-size:42px;

  }


  .rating-text{

    margin-bottom:20px;

  }


  .small{

    margin-top:20px;

  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (
  prefers-reduced-motion:reduce
){

  *{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

  }

}

</style>

</head>


<body>


<main class="card">


<!-- =======================================================
     LOGO
======================================================= -->

<div
  class="logo"
  id="logo">

  🍽️

</div>


<!-- =======================================================
     BUSINESS NAME
======================================================= -->

<h1 id="businessName">

  Loading...

</h1>


<!-- =======================================================
     SUBTITLE
======================================================= -->

<p
  class="subtitle"
  id="subtitle">

  Loading your experience...

</p>


<!-- =======================================================
     FEEDBACK AREA
======================================================= -->

<div
  id="feedbackArea"
  class="hidden">


<!-- =====================================================
     STARS
====================================================== -->

<div
  class="stars"
  id="stars">


<button
  type="button"
  class="star"
  data-rating="1"
  aria-label="1 star">

  ★

</button>


<button
  type="button"
  class="star"
  data-rating="2"
  aria-label="2 stars">

  ★

</button>


<button
  type="button"
  class="star"
  data-rating="3"
  aria-label="3 stars">

  ★

</button>


<button
  type="button"
  class="star"
  data-rating="4"
  aria-label="4 stars">

  ★

</button>


<button
  type="button"
  class="star"
  data-rating="5"
  aria-label="5 stars">

  ★

</button>


</div>


<!-- =====================================================
     RATING TEXT
====================================================== -->

<div
  class="rating-text"
  id="ratingText">

  Tap a star to rate your experience

</div>


<!-- =====================================================
     MESSAGE
====================================================== -->

<section
  class="message"
  id="message">


<h2
  id="messageTitle">
</h2>


<p
  id="messageText">
</p>


<!-- ===================================================
     GOOGLE
==================================================== -->

<div
  id="googleArea"
  class="hidden">


<a
  id="googleButton"
  class="button google"
  href="#"
  target="_blank"
  rel="noopener">

  ⭐ Leave us a Google review

</a>


</div>


<!-- ===================================================
     PRIVATE WHATSAPP
==================================================== -->

<div
  id="privateArea"
  class="hidden">


<textarea
  id="feedbackMessage"
  placeholder="Tell us what went wrong or how we can improve..."
></textarea>


<button
  type="button"
  id="sendPrivate"
  class="button private">

  💬 Send privately

</button>


</div>


</section>


</div>


<div class="small">

  Your feedback helps us improve.

</div>


</main>



<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        method:"GET",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  if(!cardCode){

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try{


    /* FIND CARD */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* FIND BUSINESS */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* BUSINESS NAME */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Your Experience`;


    subtitle.textContent =
      "How was your experience with us?";


    /* LOGO */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      logo.appendChild(
        image
      );

    }


    /* GOOGLE LINK */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* SHOW */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(error);


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {

        selectedRating =
          Number(
            star.dataset.rating
          );


        /* HIGHLIGHT STARS */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        ratingText.textContent =
          `${selectedRating} out of 5 stars`;


        message.classList.add(
          "show"
        );


        /* 1–2 STARS */

        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* 3–5 STARS */

        else{

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(selectedRating === 3){

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if(selectedRating === 4){

            messageTitle.textContent =
              "We're glad you enjoyed your experience!";

          }

          else{

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   WHATSAPP
========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {


      const text =
        feedbackMessage
          .value
          .trim();


      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      if(!currentBusiness.whatsapp_number){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
========================================================= */

loadCard();

</script>


</body>

</html>
