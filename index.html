<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Customer Feedback</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  -webkit-text-size-adjust:100%;
}

body{

  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,200,61,.12),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #050d18 0%,
      #07111f 50%,
      #050c16 100%
    );

  color:#fff;

  display:flex;

  justify-content:center;
  align-items:center;

  padding:
    clamp(10px, 2.5vw, 24px);

  overflow-x:hidden;

  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   MAIN CUSTOMER CARD
========================================================= */

.card{

  width:
    min(
      94vw,
      560px
    );

  min-height:
    min(
      88vh,
      760px
    );

  min-height:
    min(
      88dvh,
      760px
    );

  display:flex;

  flex-direction:column;

  justify-content:center;

  background:
    linear-gradient(
      145deg,
      rgba(18,39,63,.98),
      rgba(8,22,38,.99)
    );

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:
    clamp(25px, 5vw, 34px);

  padding:
    clamp(35px, 7vw, 58px)
    clamp(22px, 6vw, 48px)
    clamp(28px, 6vw, 45px);

  text-align:center;

  box-shadow:
    0 35px 100px rgba(0,0,0,.50),
    0 0 0 1px rgba(255,255,255,.015);

  position:relative;

  overflow:hidden;
}


/* =========================================================
   PREMIUM LIGHT
========================================================= */

.card::before{

  content:"";

  position:absolute;

  width:
    clamp(220px, 60vw, 360px);

  height:
    clamp(220px, 60vw, 360px);

  top:
    clamp(-190px, -25vw, -120px);

  left:50%;

  transform:
    translateX(-50%);

  background:#ffc83d;

  opacity:.055;

  filter:blur(55px);

  pointer-events:none;
}


/* =========================================================
   LOGO
========================================================= */

.logo{

  width:
    clamp(82px, 21vw, 112px);

  height:
    clamp(82px, 21vw, 112px);

  border-radius:
    clamp(23px, 5vw, 30px);

  margin:
    0 auto
    clamp(20px, 4vw, 27px);

  background:
    linear-gradient(
      145deg,
      #193754,
      #10263d
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:
    clamp(36px, 8vw, 50px);

  border:
    1px solid
    rgba(255,255,255,.12);

  overflow:hidden;

  box-shadow:
    0 15px 35px
    rgba(0,0,0,.30);

  flex-shrink:0;
}


.logo img{

  width:100%;
  height:100%;

  object-fit:cover;
}


/* =========================================================
   BUSINESS NAME
========================================================= */

h1{

  font-size:
    clamp(27px, 6vw, 36px);

  line-height:1.15;

  margin-bottom:
    clamp(9px, 2vw, 13px);

  letter-spacing:-.7px;

  font-weight:800;

  word-break:break-word;
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

  color:#9eacbd;

  font-size:
    clamp(15px, 3.8vw, 18px);

  line-height:1.5;

  margin-bottom:
    clamp(28px, 6vw, 38px);

  max-width:430px;

  margin-left:auto;
  margin-right:auto;
}


/* =========================================================
   FEEDBACK AREA
========================================================= */

#feedbackArea{

  width:100%;
}


/* =========================================================
   STARS
========================================================= */

.stars{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:
    clamp(1px, 1vw, 6px);

  margin-bottom:
    clamp(14px, 3vw, 18px);

  padding:5px 0;

  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   STAR BUTTON
========================================================= */

.star{

  appearance:none;
  -webkit-appearance:none;

  border:0;
  outline:0;

  background:transparent;

  color:#536174;

  font-size:
    clamp(48px, 12vw, 64px);

  line-height:1;

  cursor:pointer;

  padding:
    clamp(4px, 1vw, 7px);

  margin:0;

  width:
    clamp(55px, 14vw, 72px);

  height:
    clamp(64px, 15vw, 78px);

  display:flex;

  align-items:center;
  justify-content:center;

  -webkit-tap-highlight-color:transparent;

  user-select:none;
  -webkit-user-select:none;

  opacity:1 !important;

  transition:
    color .20s ease,
    transform .20s cubic-bezier(.2,.9,.3,1.35),
    filter .20s ease;
}


/* =========================================================
   HOVER
========================================================= */

@media (hover:hover){

  .star:hover{

    color:#ffe08a;

    transform:
      translateY(-4px)
      scale(1.08);

    filter:
      drop-shadow(
        0 5px 11px
        rgba(255,200,61,.25)
      );
  }

}


/* =========================================================
   SELECTED STARS
========================================================= */

.star.selected{

  color:#ffc83d !important;

  opacity:1 !important;

  filter:
    drop-shadow(
      0 5px 11px
      rgba(255,200,61,.25)
    );
}


/* =========================================================
   STAR POP ANIMATION
========================================================= */

.star.selected.pop{

  animation:
    starPop
    .42s
    cubic-bezier(.2,.9,.3,1.35);
}


@keyframes starPop{

  0%{
    transform:scale(.72);
  }

  45%{
    transform:scale(1.20);
  }

  70%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================================
   FOCUS
========================================================= */

.star:focus-visible{

  outline:
    2px solid
    rgba(255,200,61,.7);

  outline-offset:3px;

  border-radius:12px;
}


/* =========================================================
   RATING TEXT
========================================================= */

.rating-text{

  min-height:
    clamp(24px, 5vw, 29px);

  color:#b8c3d1;

  font-size:
    clamp(14px, 3.5vw, 17px);

  margin-bottom:
    clamp(25px, 5vw, 33px);

  transition:
    opacity .2s ease,
    transform .2s ease;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

  display:none;

  text-align:left;

  animation:
    messageAppear
    .32s
    ease;
}


.message.show{

  display:block;
}


@keyframes messageAppear{

  from{

    opacity:0;

    transform:
      translateY(10px);
  }

  to{

    opacity:1;

    transform:
      translateY(0);
  }

}


/* =========================================================
   MESSAGE TITLE
========================================================= */

.message h2{

  font-size:
    clamp(20px, 4.8vw, 24px);

  line-height:1.25;

  margin-bottom:
    clamp(9px, 2vw, 12px);

  letter-spacing:-.25px;
}


/* =========================================================
   MESSAGE TEXT
========================================================= */

.message p{

  color:#aab7c7;

  font-size:
    clamp(14px, 3.5vw, 17px);

  line-height:1.55;

  margin-bottom:
    clamp(18px, 4vw, 23px);
}


/* =========================================================
   TEXTAREA
========================================================= */

textarea{

  width:100%;

  min-height:
    clamp(140px, 30vw, 175px);

  resize:vertical;

  padding:
    clamp(15px, 3.5vw, 19px);

  border-radius:
    clamp(15px, 4vw, 18px);

  border:
    1px solid
    rgba(255,255,255,.10);

  background:
    rgba(4,13,24,.78);

  color:white;

  font-family:inherit;

  font-size:
    clamp(15px, 3.8vw, 17px);

  line-height:1.5;

  outline:none;

  margin-bottom:10px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}


textarea::placeholder{

  color:#65758a;
}


textarea:focus{

  border-color:
    rgba(255,200,61,.55);

  box-shadow:
    0 0 0 3px
    rgba(255,200,61,.07);
}


/* =========================================================
   BUTTONS
========================================================= */

.button{

  display:block;

  width:100%;

  min-height:
    clamp(54px, 13vw, 64px);

  padding:
    15px 18px;

  border-radius:
    clamp(15px, 4vw, 18px);

  border:none;

  text-decoration:none;

  font-size:
    clamp(15px, 3.8vw, 18px);

  font-weight:750;

  cursor:pointer;

  margin-top:12px;

  text-align:center;

  display:flex;

  align-items:center;

  justify-content:center;

  transition:
    transform .15s ease,
    opacity .15s ease,
    box-shadow .2s ease;
}


.button:active{

  transform:scale(.985);
}


/* =========================================================
   GOOGLE BUTTON
========================================================= */

.google{

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #edf1f5
    );

  color:#111827;

  box-shadow:
    0 9px 25px
    rgba(0,0,0,.22);
}


.google:hover{

  box-shadow:
    0 13px 32px
    rgba(0,0,0,.30);

  transform:
    translateY(-2px);
}


/* =========================================================
   PRIVATE BUTTON
========================================================= */

.private{

  background:
    linear-gradient(
      135deg,
      #24415f,
      #172f49
    );

  color:white;

  border:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 9px 25px
    rgba(0,0,0,.22);
}


.private:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 13px 32px
    rgba(0,0,0,.30);
}


/* =========================================================
   FOOTER
========================================================= */

.small{

  margin-top:
    clamp(24px, 5vw, 32px);

  color:#66758a;

  font-size:
    clamp(11px, 2.7vw, 13px);

  letter-spacing:.1px;
}


/* =========================================================
   ERROR
========================================================= */

.error{

  color:#ff8f8f;
}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{

  display:none !important;
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:360px){

  body{

    padding:8px;
  }

  .card{

    width:96vw;

    min-height:
      92dvh;

    padding:
      28px 14px 23px;
  }

  .stars{

    gap:0;
  }

  .star{

    width:52px;

    font-size:46px;
  }

}


/* =========================================================
   TABLETS
========================================================= */

@media(min-width:600px){

  body{

    padding:24px;
  }

  .card{

    width:
      min(88vw, 600px);

    min-height:
      min(82dvh, 800px);
  }

}


/* =========================================================
   LARGE DESKTOP
========================================================= */

@media(min-width:1000px){

  .card{

    width:560px;

    min-height:760px;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;
  }

}

</style>
</head>


<body>


<main class="card">


  <!-- =====================================================
       LOGO
  ====================================================== -->

  <div
    class="logo"
    id="logo">

    🍽️

  </div>


  <!-- =====================================================
       BUSINESS NAME
  ====================================================== -->

  <h1 id="businessName">

    Loading...

  </h1>


  <!-- =====================================================
       SUBTITLE
  ====================================================== -->

  <p
    class="subtitle"
    id="subtitle">

    Loading your experience...

  </p>


  <!-- =====================================================
       FEEDBACK AREA
  ====================================================== -->

  <div
    id="feedbackArea"
    class="hidden">


    <!-- ===================================================
         STARS
    ==================================================== -->

    <div
      class="stars"
      id="stars">


      <button
        type="button"
        class="star"
        data-rating="1"
        aria-label="1 star"
        aria-pressed="false">

        ★

      </button>


      <button
        type="button"
        class="star"
        data-rating="2"
        aria-label="2 stars"
        aria-pressed="false">

        ★

      </button>


      <button
        type="button"
        class="star"
        data-rating="3"
        aria-label="3 stars"
        aria-pressed="false">

        ★

      </button>


      <button
        type="button"
        class="star"
        data-rating="4"
        aria-label="4 stars"
        aria-pressed="false">

        ★

      </button>


      <button
        type="button"
        class="star"
        data-rating="5"
        aria-label="5 stars"
        aria-pressed="false">

        ★

      </button>


    </div>


    <!-- ===================================================
         RATING TEXT
    ==================================================== -->

    <div
      class="rating-text"
      id="ratingText">

      Tap a star to rate your experience

    </div>


    <!-- ===================================================
         MESSAGE
    ==================================================== -->

    <section
      class="message"
      id="message">


      <h2
        id="messageTitle">
      </h2>


      <p
        id="messageText">
      </p>


      <!-- =================================================
           3–5 STARS → GOOGLE
      ================================================== -->

      <div
        id="googleArea"
        class="hidden">


        <a
          id="googleButton"
          class="button google"
          href="#"
          target="_blank"
          rel="noopener noreferrer">

          ⭐ Leave us a Google review

        </a>


      </div>


      <!-- =================================================
           1–2 STARS → PRIVATE WHATSAPP
      ================================================== -->

      <div
        id="privateArea"
        class="hidden">


        <textarea
          id="feedbackMessage"
          placeholder="Tell us what went wrong or how we can improve..."
          aria-label="Private feedback">
        </textarea>


        <button
          id="sendPrivate"
          class="button private"
          type="button">

          💬 Send privately

        </button>


      </div>


    </section>


  </div>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <div class="small">

    Your feedback helps us improve.

  </div>


</main>



<script>


/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        method:"GET",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* =======================================================
     NO CARD CODE
  ======================================================== */

  if(!cardCode){

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try{

    /* =====================================================
       FIND CARD
    ====================================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* =====================================================
       FIND BUSINESS
    ====================================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* =====================================================
       BUSINESS NAME
    ====================================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Your Experience`;


    subtitle.textContent =
      "How was your experience with us?";


    /* =====================================================
       LOGO
    ====================================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML = "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW LINK
    ====================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* =====================================================
       SHOW PAGE
    ====================================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR ELEMENTS
========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   UPDATE STAR VISUAL STATE
========================================================= */

function updateStars(){

  stars.forEach(
    star => {

      const rating =
        Number(
          star.dataset.rating
        );


      const isSelected =
        selectedRating !== null &&
        rating <= selectedRating;


      star.classList.toggle(
        "selected",
        isSelected
      );


      star.setAttribute(
        "aria-pressed",
        rating === selectedRating
          ? "true"
          : "false"
      );

    }
  );

}


/* =========================================================
   STAR CLICK
========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      function(){

        selectedRating =
          Number(
            this.dataset.rating
          );


        /* Update persistent gold state */

        updateStars();


        /*
          Remove old pop animation.
        */

        stars.forEach(
          s => {

            s.classList.remove(
              "pop"
            );

          }
        );


        /*
          Force reflow so animation can
          replay on every click.
        */

        void this.offsetWidth;


        /*
          Animate clicked star.
        */

        this.classList.add(
          "pop"
        );


        ratingText.textContent =
          `${selectedRating} out of 5 stars`;


        message.classList.add(
          "show"
        );


        /* =================================================
           1–2 STARS
        ================================================== */

        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* =================================================
           3–5 STARS
        ================================================== */

        else{

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(selectedRating === 3){

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if(selectedRating === 4){

            messageTitle.textContent =
              "We're glad you enjoyed your experience!";

          }

          else{

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    function(){

      const text =
        feedbackMessage
          .value
          .trim();


      /* ===================================================
         CHECK BUSINESS
      ==================================================== */

      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      /* ===================================================
         CHECK WHATSAPP
      ==================================================== */

      if(!currentBusiness.whatsapp_number){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      /* ===================================================
         CLEAN NUMBER
      ==================================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      /*
        Algeria:

        0555123456

        ↓

        213555123456
      */

      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      /* ===================================================
         MESSAGE
      ==================================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      /* ===================================================
         ENCODE
      ==================================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* ===================================================
         WHATSAPP URL
      ==================================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /*
        Nothing is saved in Supabase.

        The customer goes directly to WhatsApp.
      */

      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
========================================================= */

loadCard();
