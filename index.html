<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Feedback</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#ffc83d;
  --background:#07111f;
  --panel:#0d1b2d;
  --logo-bg:#132a45;
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--background);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

button,
input,
textarea{
  font:inherit;
}

.card{
  width:100%;
  max-width:430px;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:34px 24px 28px;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.logo{
  width:78px;
  height:78px;
  border-radius:22px;
  margin:0 auto 18px;
  background:var(--logo-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  border:1px solid rgba(255,255,255,.1);
  overflow:hidden;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-size:25px;
  margin-bottom:8px;
  letter-spacing:-.4px;
}

.subtitle{
  color:#9eacbd;
  font-size:15px;
  line-height:1.5;
  margin-bottom:30px;
}

.stars{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-bottom:14px;
}

.star{
  appearance:none;
  -webkit-appearance:none;

  border:none;
  outline:none;

  background:transparent;

  color:#536174;

  font-size:43px;
  line-height:1;

  cursor:pointer;

  padding:4px;

  transform:scale(1);

  transition:
    color .12s ease,
    transform .12s cubic-bezier(.2,.8,.3,1),
    filter .12s ease;
  
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.star:hover{
  transform:scale(1.10);
}

.star.active{
  color:var(--primary);

  transform:scale(1.08);

  filter:
    drop-shadow(
      0 0 7px
      color-mix(
        in srgb,
        var(--primary) 55%,
        transparent
      )
    );
}

/*
  The star that was just clicked
  gets a quick premium "pop".
*/

.star.selected-pop{
  animation:starPop .28s cubic-bezier(.2,.9,.3,1);
}

@keyframes starPop{

  0%{
    transform:scale(.82);
  }

  45%{
    transform:scale(1.28);
  }

  75%{
    transform:scale(1.04);
  }

  100%{
    transform:scale(1.08);
  }

}

.rating-text{
  min-height:24px;
  color:#b8c3d1;
  font-size:14px;
  margin-bottom:24px;
  transition:
    opacity .15s ease,
    transform .15s ease;
}

.rating-text.rating-change{
  animation:ratingChange .2s ease;
}

@keyframes ratingChange{

  0%{
    opacity:.3;
    transform:translateY(3px);
  }

  100%{
    opacity:1;
    transform:translateY(0);
  }

}

.message{
  display:none;
  text-align:left;
  animation:appear .25s ease;
}

.message.show{
  display:block;
}

@keyframes appear{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.message h2{
  font-size:19px;
  margin-bottom:8px;
}

.message p{
  color:#aab7c7;
  font-size:14px;
  line-height:1.5;
  margin-bottom:18px;
}

textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  padding:14px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  background:#07111f;
  color:white;
  font-family:inherit;
  font-size:14px;
  outline:none;
  margin-bottom:10px;
}

textarea:focus{
  border-color:var(--primary);
}

.button{
  display:block;
  width:100%;
  padding:15px 18px;
  border-radius:15px;
  border:none;
  text-decoration:none;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:11px;
  text-align:center;
  transition:
    transform .15s ease,
    opacity .15s ease;
}

.button:active{
  transform:scale(.98);
}

.button:disabled{
  opacity:.6;
  cursor:wait;
}

.google{
  background:white;
  color:#111827;
}

.private{
  background:#1b3049;
  color:white;
}

.small{
  margin-top:22px;
  color:#66758a;
  font-size:11px;
}

.error{
  color:#ff8f8f;
}

.hidden{
  display:none!important;
}

</style>
</head>

<body>

<main class="card">

  <div
    class="logo"
    id="logo">
    🍽️
  </div>

  <h1 id="businessName">
    Loading...
  </h1>

  <p
    class="subtitle"
    id="subtitle">
    Loading your experience...
  </p>

  <div
    id="feedbackArea"
    class="hidden">

    <div
      class="stars"
      id="stars">

      <button
        class="star"
        type="button"
        data-rating="1"
        aria-label="1 star">
        ★
      </button>

      <button
        class="star"
        type="button"
        data-rating="2"
        aria-label="2 stars">
        ★
      </button>

      <button
        class="star"
        type="button"
        data-rating="3"
        aria-label="3 stars">
        ★
      </button>

      <button
        class="star"
        type="button"
        data-rating="4"
        aria-label="4 stars">
        ★
      </button>

      <button
        class="star"
        type="button"
        data-rating="5"
        aria-label="5 stars">
        ★
      </button>

    </div>

    <div
      class="rating-text"
      id="ratingText">
      Tap a star to rate your experience
    </div>

    <section
      class="message"
      id="message">

      <h2 id="messageTitle"></h2>

      <p id="messageText"></p>

      <div
        id="googleArea"
        class="hidden">

        <a
          id="googleButton"
          class="button google"
          href="#"
          target="_blank"
          rel="noopener">
          ⭐ Leave us a Google review
        </a>

      </div>

      <div
        id="privateArea"
        class="hidden">

        <textarea
          id="feedbackMessage"
          placeholder="Tell us what went wrong or how we can improve...">
        </textarea>

        <button
          id="sendPrivate"
          class="button private"
          type="button">
          💬 Send privately
        </button>

      </div>

    </section>

  </div>

  <div
    class="small">
    Your feedback helps us improve.
  </div>

</main>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   ELEMENTS
   ========================================================= */

const businessName =
  document.getElementById("businessName");

const subtitle =
  document.getElementById("subtitle");

const logo =
  document.getElementById("logo");

const feedbackArea =
  document.getElementById("feedbackArea");

const ratingText =
  document.getElementById("ratingText");

const message =
  document.getElementById("message");

const messageTitle =
  document.getElementById("messageTitle");

const messageText =
  document.getElementById("messageText");

const googleArea =
  document.getElementById("googleArea");

const googleButton =
  document.getElementById("googleButton");

const privateArea =
  document.getElementById("privateArea");

const feedbackMessage =
  document.getElementById("feedbackMessage");

const sendPrivate =
  document.getElementById("sendPrivate");

const stars =
  document.querySelectorAll(".star");


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;
let selectedRating = null;


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("card");

  if(!code){
    return null;
  }

  return code.trim().toUpperCase();

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            `Bearer ${SUPABASE_KEY}`,
          "Content-Type":
            "application/json"
        }
      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   APPLY BUSINESS
   ========================================================= */

function applyBusinessSettings(business){

  currentBusiness =
    business;


  const name =
    business.name ||
    "Your Business";


  businessName.textContent =
    name;


  document.title =
    `${name} — Your Experience`;


  /* LOGO */

  if(business.logo_url){

    logo.innerHTML = "";

    const image =
      document.createElement("img");

    image.src =
      business.logo_url;

    image.alt =
      `${name} logo`;

    image.onerror =
      function(){
        logo.innerHTML = "🍽️";
      };

    logo.appendChild(image);

  }


  /* PRIMARY COLOR */

  if(
    business.primary_color &&
    /^#[0-9A-Fa-f]{6}$/.test(
      business.primary_color
    )
  ){

    document.documentElement
      .style
      .setProperty(
        "--primary",
        business.primary_color
      );

  }


  /* GOOGLE */

  if(
    business.google_review_url
  ){

    googleButton.href =
      business.google_review_url;

  }


  subtitle.textContent =
    "How was your experience with us?";


  feedbackArea
    .classList
    .remove("hidden");

}


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  if(!cardCode){

    businessName.textContent =
      "Card not found";

    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;

    return;

  }


  try{

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=id,business_id,card_code,active`
      );


    if(
      !cards ||
      cards.length === 0
    ){

      throw new Error(
        "Card not found."
      );

    }


    const card =
      cards[0];


    if(!card.business_id){

      throw new Error(
        "Card is not connected to a business."
      );

    }


    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=id,name,logo_url,google_review_url,whatsapp_number,primary_color`
      );


    if(
      !businesses ||
      businesses.length === 0
    ){

      throw new Error(
        "Business not found."
      );

    }


    applyBusinessSettings(
      businesses[0]
    );

  }

  catch(error){

    console.error(
      "Customer page error:",
      error
    );


    businessName.textContent =
      "Card unavailable";

    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

    feedbackArea
      .classList
      .add("hidden");

  }

}


/* =========================================================
   STAR CLICK — FAST PREMIUM ANIMATION
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      function(event){

        event.preventDefault();


        const rating =
          Number(
            star.dataset.rating
          );


        /*
          Update the rating FIRST.

          This happens immediately on the
          same click event before any other
          UI work.
        */

        selectedRating =
          rating;


        /* REMOVE OLD POP ANIMATIONS */

        stars.forEach(
          currentStar => {

            currentStar.classList.remove(
              "selected-pop"
            );

          }
        );


        /*
          Force a browser reflow.

          This allows the same star to
          animate again if the customer
          taps it repeatedly.
        */

        void star.offsetWidth;


        /*
          Highlight the stars immediately.
        */

        stars.forEach(
          currentStar => {

            const currentRating =
              Number(
                currentStar.dataset.rating
              );


            currentStar.classList.toggle(
              "active",
              currentRating <= rating
            );

          }
        );


        /*
          Pop ONLY the star that was
          actually tapped.
        */

        star.classList.add(
          "selected-pop"
        );


        /*
          Update rating text.
        */

        ratingText.textContent =
          `${rating} out of 5 stars`;


        ratingText.classList.remove(
          "rating-change"
        );

        void ratingText.offsetWidth;

        ratingText.classList.add(
          "rating-change"
        );


        /*
          Show feedback area.
        */

        message.classList.add(
          "show"
        );


        /* ==========================================
           1–2 STARS
           ========================================== */

        if(
          rating <= 2
        ){

          messageTitle.textContent =
            "We're sorry about your experience.";

          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";

          googleArea
            .classList
            .add("hidden");

          privateArea
            .classList
            .remove("hidden");

          feedbackMessage.value = "";

          return;

        }


        /* ==========================================
           3–5 STARS
           ========================================== */

        privateArea
          .classList
          .add("hidden");

        googleArea
          .classList
          .remove("hidden");


        if(
          rating === 3
        ){

          messageTitle.textContent =
            "Thanks for your feedback!";

        }
        else if(
          rating === 4
        ){

          messageTitle.textContent =
            "We're glad you enjoyed your experience!";

        }
        else{

          messageTitle.textContent =
            "We're thrilled you loved it! ❤️";

        }


        messageText.textContent =
          "Thank you! We'd really appreciate you sharing your experience on Google.";

      }
    );

  }
);


/* =========================================================
   SEND PRIVATE WHATSAPP
   ========================================================= */

sendPrivate.addEventListener(
  "click",
  function(){

    const text =
      feedbackMessage.value.trim();


    if(!currentBusiness){

      alert(
        "Business information is unavailable."
      );

      return;

    }


    if(
      !currentBusiness.whatsapp_number
    ){

      alert(
        "WhatsApp contact is not configured for this business."
      );

      return;

    }


    sendPrivate.disabled =
      true;

    sendPrivate.textContent =
      "Opening WhatsApp...";


    let number =
      String(
        currentBusiness.whatsapp_number
      )
      .replace(
        /\D/g,
        ""
      );


    if(
      number.startsWith("0")
    ){

      number =
        "213" +
        number.substring(1);

    }


    const name =
      currentBusiness.name ||
      "Business";


    let whatsappMessage =
`🔒 Private feedback — ${name}

⭐ Rating: ${selectedRating}/5`;


    if(
      text.length > 0
    ){

      whatsappMessage +=
`

💬 Customer feedback:
${text}`;

    }


    const encodedMessage =
      encodeURIComponent(
        whatsappMessage
      );


    const whatsappURL =
      `https://wa.me/${number}?text=${encodedMessage}`;


    window.location.href =
      whatsappURL;

  }
);


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>

</body>
</html>
