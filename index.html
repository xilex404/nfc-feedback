<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#07111f"
>

<title>Customer Feedback</title>


<style>

/* =========================================================
   TAPREVIEW — AAA FULL SCREEN CUSTOMER EXPERIENCE
   UI ONLY
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html{
  min-height:100%;
  background:#07111f;
}


body{

  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,200,61,.10),
      transparent 38%
    ),
    radial-gradient(
      circle at 0% 100%,
      rgba(46,117,255,.10),
      transparent 35%
    ),
    #07111f;

  color:#fff;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}


/* =========================================================
   APP
   ========================================================= */

.app{

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  position:relative;

  overflow:hidden;
}


/* =========================================================
   TOP AMBIENT LIGHT
   ========================================================= */

.app::before{

  content:"";

  position:absolute;

  width:420px;
  height:420px;

  top:-250px;
  left:50%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(255,200,61,.16),
      transparent 68%
    );

  pointer-events:none;

}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.main{

  width:100%;

  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  align-items:center;

  position:relative;
  z-index:1;

  padding:
    max(32px, env(safe-area-inset-top))
    22px
    max(30px, env(safe-area-inset-bottom));

}


/* =========================================================
   BRAND / LOGO
   ========================================================= */

.logo{

  width:112px;
  height:112px;

  margin-top:clamp(15px,5vh,55px);
  margin-bottom:28px;

  border-radius:32px;

  background:
    linear-gradient(
      145deg,
      #183552,
      #0d1f34
    );

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 20px 55px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.08);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:52px;

  overflow:hidden;

  flex-shrink:0;

  animation:
    logoEnter .65s cubic-bezier(.2,.8,.2,1);
}


@keyframes logoEnter{

  from{
    opacity:0;
    transform:
      translateY(-15px)
      scale(.88);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


.logo img{

  width:100%;
  height:100%;

  object-fit:cover;

}


/* =========================================================
   BUSINESS NAME
   ========================================================= */

h1{

  width:100%;
  max-width:700px;

  text-align:center;

  font-size:
    clamp(30px,8vw,48px);

  line-height:1.08;

  font-weight:850;

  letter-spacing:-1.2px;

  color:#fff;

  margin-bottom:13px;

  overflow-wrap:anywhere;

  animation:
    titleEnter .65s .05s both
    cubic-bezier(.2,.8,.2,1);

}


@keyframes titleEnter{

  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   SUBTITLE
   ========================================================= */

.subtitle{

  width:100%;
  max-width:650px;

  text-align:center;

  color:#aebdce;

  font-size:
    clamp(18px,4.8vw,23px);

  line-height:1.45;

  font-weight:500;

  margin-bottom:clamp(35px,7vh,60px);

  animation:
    titleEnter .65s .10s both
    cubic-bezier(.2,.8,.2,1);

}


/* =========================================================
   FEEDBACK AREA
   ========================================================= */

#feedbackArea{

  width:100%;
  max-width:760px;

  animation:
    contentEnter .7s .12s both
    cubic-bezier(.2,.8,.2,1);

}


@keyframes contentEnter{

  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   STAR AREA
   ========================================================= */

.stars{

  width:100%;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:
    clamp(4px,2vw,16px);

  margin-bottom:18px;

}


/* =========================================================
   STAR BUTTON
   IMPORTANT:
   We use explicit color + opacity + visibility.
   This prevents the selected star from disappearing.
   ========================================================= */

.star{

  appearance:none;
  -webkit-appearance:none;

  border:0;

  background:transparent;

  width:
    clamp(58px,16vw,105px);

  height:
    clamp(64px,17vw,110px);

  min-width:58px;
  min-height:64px;

  padding:0;

  margin:0;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  position:relative;

  color:#526174;

  opacity:1;

  visibility:visible;

  font-family:
    Arial,
    sans-serif;

  font-size:
    clamp(52px,15vw,92px);

  line-height:1;

  font-weight:900;

  -webkit-text-fill-color:#526174;

  text-shadow:
    0 3px 10px rgba(0,0,0,.30);

  transform:
    translateZ(0)
    scale(1);

  transition:
    color .18s ease,
    -webkit-text-fill-color .18s ease,
    transform .18s ease,
    text-shadow .18s ease,
    filter .18s ease;

  touch-action:manipulation;

}


/* =========================================================
   STAR HOVER
   ========================================================= */

.star:hover{

  color:#ffd968;

  -webkit-text-fill-color:#ffd968;

  transform:
    translateZ(0)
    scale(1.10);

}


/* =========================================================
   STAR ACTIVE
   ========================================================= */

.star.active{

  color:#ffc83d !important;

  -webkit-text-fill-color:#ffc83d !important;

  opacity:1 !important;

  visibility:visible !important;

  transform:
    translateZ(0)
    scale(1.08);

  text-shadow:
    0 0 8px rgba(255,200,61,.45),
    0 0 22px rgba(255,200,61,.28),
    0 4px 12px rgba(0,0,0,.35);

  filter:
    drop-shadow(
      0 0 7px
      rgba(255,200,61,.30)
    );

  animation:
    starPop .28s cubic-bezier(.2,1.5,.4,1);

}


@keyframes starPop{

  0%{

    opacity:1;

    transform:
      translateZ(0)
      scale(.72)
      rotate(-8deg);

  }

  55%{

    opacity:1;

    transform:
      translateZ(0)
      scale(1.18)
      rotate(3deg);

  }

  100%{

    opacity:1;

    transform:
      translateZ(0)
      scale(1.08)
      rotate(0);

  }

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{

  width:100%;

  min-height:32px;

  text-align:center;

  color:#9eacbd;

  font-size:
    clamp(16px,4.3vw,20px);

  line-height:1.4;

  font-weight:500;

  margin-bottom:32px;

  transition:
    color .2s ease,
    transform .2s ease;

}


.rating-text:not(:empty){

  color:#dce6f1;

}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{

  width:100%;

  display:none;

  text-align:center;

}


.message.show{

  display:block;

  animation:
    messageEnter .45s
    cubic-bezier(.2,.8,.2,1);

}


@keyframes messageEnter{

  from{

    opacity:0;

    transform:
      translateY(20px)
      scale(.98);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* =========================================================
   MESSAGE TITLE
   ========================================================= */

.message h2{

  width:100%;

  font-size:
    clamp(24px,6.5vw,34px);

  line-height:1.2;

  font-weight:800;

  letter-spacing:-.5px;

  margin-bottom:12px;

}


/* =========================================================
   MESSAGE DESCRIPTION
   ========================================================= */

.message p{

  width:100%;

  max-width:650px;

  margin:
    0 auto 27px;

  color:#aebdce;

  font-size:
    clamp(17px,4.6vw,21px);

  line-height:1.55;

}


/* =========================================================
   GOOGLE / PRIVATE AREAS
   ========================================================= */

#googleArea,
#privateArea{

  width:100%;

}


/* =========================================================
   BUTTONS
   ========================================================= */

.button{

  display:flex;

  width:100%;

  min-height:70px;

  padding:
    17px 22px;

  border-radius:20px;

  border:0;

  text-decoration:none;

  font-size:
    clamp(18px,5vw,23px);

  font-weight:800;

  line-height:1.25;

  cursor:pointer;

  align-items:center;
  justify-content:center;

  text-align:center;

  transition:
    transform .15s ease,
    box-shadow .2s ease,
    filter .2s ease;

  touch-action:manipulation;

}


.button:hover{

  transform:translateY(-2px);

}


.button:active{

  transform:
    translateY(1px)
    scale(.985);

}


/* =========================================================
   GOOGLE BUTTON
   ========================================================= */

.google{

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #eef2f6
    );

  color:#101722;

  box-shadow:
    0 15px 35px rgba(0,0,0,.25);

}


.google:hover{

  box-shadow:
    0 20px 42px rgba(0,0,0,.32);

}


/* =========================================================
   PRIVATE BUTTON
   ========================================================= */

.private{

  background:
    linear-gradient(
      135deg,
      #203c5a,
      #172e47
    );

  color:#fff;

  border:
    1px solid rgba(255,255,255,.10);

  box-shadow:
    0 15px 35px rgba(0,0,0,.25);

}


.private:hover{

  filter:brightness(1.08);

}


/* =========================================================
   TEXTAREA
   ========================================================= */

textarea{

  width:100%;

  min-height:170px;

  resize:vertical;

  padding:20px;

  border-radius:20px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    linear-gradient(
      145deg,
      #091522,
      #07111f
    );

  color:#fff;

  font-family:inherit;

  font-size:
    clamp(17px,4.7vw,20px);

  line-height:1.5;

  outline:none;

  margin-bottom:12px;

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.03);

}


textarea::placeholder{

  color:#718298;

}


textarea:focus{

  border-color:
    rgba(255,200,61,.55);

  box-shadow:
    0 0 0 4px
    rgba(255,200,61,.08);

}


/* =========================================================
   FOOTER
   ========================================================= */

.small{

  margin-top:auto;

  padding-top:40px;

  width:100%;

  text-align:center;

  color:#66758a;

  font-size:
    clamp(13px,3.5vw,16px);

  line-height:1.4;

}


/* =========================================================
   ERROR
   ========================================================= */

.error{

  color:#ff9696;

  font-weight:600;

}


/* =========================================================
   HIDDEN
   ========================================================= */

.hidden{

  display:none !important;

}


/* =========================================================
   DESKTOP / TABLET
   ========================================================= */

@media(min-width:700px){

  .main{

    padding-left:40px;
    padding-right:40px;

  }


  .logo{

    width:130px;
    height:130px;

    border-radius:36px;

    font-size:60px;

  }


  h1{

    font-size:50px;

  }


  .subtitle{

    font-size:22px;

  }


  .stars{

    gap:12px;

  }


  .star{

    width:105px;
    height:110px;

    font-size:92px;

  }


  .button{

    min-height:76px;

  }

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-height:700px){

  .logo{

    width:82px;
    height:82px;

    border-radius:24px;

    margin-top:12px;
    margin-bottom:16px;

    font-size:38px;

  }


  h1{

    font-size:29px;

    margin-bottom:7px;

  }


  .subtitle{

    font-size:16px;

    margin-bottom:22px;

  }


  .star{

    width:56px;
    height:60px;

    font-size:50px;

  }


  .rating-text{

    margin-bottom:20px;

  }


  .message h2{

    font-size:23px;

  }


  .message p{

    font-size:16px;

    margin-bottom:18px;

  }


  .button{

    min-height:62px;

    font-size:18px;

  }


  textarea{

    min-height:120px;

  }


  .small{

    padding-top:20px;

  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(
  prefers-reduced-motion:reduce
){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

    scroll-behavior:auto !important;

  }

}

</style>

</head>


<body>


<div class="app">


  <main class="main">


    <!-- =====================================================
         LOGO
         ===================================================== -->

    <div
      class="logo"
      id="logo"
    >

      🍽️

    </div>


    <!-- =====================================================
         BUSINESS NAME
         ===================================================== -->

    <h1
      id="businessName"
    >

      Loading...

    </h1>


    <!-- =====================================================
         SUBTITLE
         ===================================================== -->

    <p
      class="subtitle"
      id="subtitle"
    >

      Loading your experience...

    </p>


    <!-- =====================================================
         FEEDBACK AREA
         ===================================================== -->

    <div
      id="feedbackArea"
      class="hidden"
    >


      <!-- ===================================================
           STARS
           =================================================== -->

      <div
        class="stars"
        id="stars"
      >


        <button
          type="button"
          class="star"
          data-rating="1"
          aria-label="1 star"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="2"
          aria-label="2 stars"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="3"
          aria-label="3 stars"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="4"
          aria-label="4 stars"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="5"
          aria-label="5 stars"
        >★</button>


      </div>


      <!-- ===================================================
           RATING TEXT
           =================================================== -->

      <div
        class="rating-text"
        id="ratingText"
      >

        Tap a star to rate your experience

      </div>


      <!-- ===================================================
           MESSAGE
           =================================================== -->

      <section
        class="message"
        id="message"
      >


        <h2
          id="messageTitle"
        ></h2>


        <p
          id="messageText"
        ></p>


        <!-- ===============================================
             3–5 STARS → GOOGLE
             =============================================== -->

        <div
          id="googleArea"
          class="hidden"
        >


          <a
            id="googleButton"
            class="button google"
            href="#"
            target="_blank"
            rel="noopener"
          >

            ⭐ Leave us a Google review

          </a>


        </div>


        <!-- ===============================================
             1–2 STARS → PRIVATE WHATSAPP
             =============================================== -->

        <div
          id="privateArea"
          class="hidden"
        >


          <textarea
            id="feedbackMessage"
            placeholder="Tell us what went wrong or how we can improve..."
          ></textarea>


          <button
            id="sendPrivate"
            class="button private"
            type="button"
          >

            💬 Send privately

          </button>


        </div>


      </section>


    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div class="small">

      Your feedback helps us improve.

    </div>


  </main>


</div>



<script>


/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint) {

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        method: "GET",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard() {

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* No card code */

  if (!cardCode) {

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try {

    /* ==========================================
       FIND CARD
       ========================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if (!cards.length) {

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* ==========================================
       FIND BUSINESS
       ========================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if (!businesses.length) {

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* ==========================================
       BUSINESS NAME
       ========================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Your Experience`;


    subtitle.textContent =
      "How was your experience with us?";


    /* ==========================================
       LOGO
       ========================================== */

    if (
      currentBusiness.logo_url
    ) {

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      logo.appendChild(
        image
      );

    }


    /* ==========================================
       GOOGLE REVIEW LINK
       ========================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* ==========================================
       SHOW PAGE
       ========================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch (error) {

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {

        selectedRating =
          Number(
            star.dataset.rating
          );


        /* ==========================================
           HIGHLIGHT STARS
           ========================================== */

        stars.forEach(
          s => {

            const value =
              Number(
                s.dataset.rating
              );


            s.classList.toggle(
              "active",
              value <= selectedRating
            );

          }
        );


        /* ==========================================
           RATING TEXT
           ========================================== */

        ratingText.textContent =
          `${selectedRating} out of 5 stars`;


        message.classList.add(
          "show"
        );


        /* ==========================================
           1–2 STARS
           ========================================== */

        if (
          selectedRating <= 2
        ) {

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          /* Clear previous comment */

          feedbackMessage.value =
            "";

        }


        /* ==========================================
           3–5 STARS
           ========================================== */

        else {

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if (
            selectedRating === 3
          ) {

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if (
            selectedRating === 4
          ) {

            messageTitle.textContent =
              "We're glad you enjoyed your experience!";

          }

          else {

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {

      /*
        IMPORTANT:

        The comment is OPTIONAL.

        If the customer writes something,
        it will be included.

        If they leave it empty,
        WhatsApp still opens.
      */

      const text =
        feedbackMessage
          .value
          .trim();


      /* ==========================================
         CHECK BUSINESS
         ========================================== */

      if (
        !currentBusiness
      ) {

        alert(
          "Business information is unavailable."
        );

        return;

      }


      /* ==========================================
         CHECK WHATSAPP NUMBER
         ========================================== */

      if (
        !currentBusiness.whatsapp_number
      ) {

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      /* ==========================================
         CLEAN WHATSAPP NUMBER
         ========================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      /*
        Algeria example:

        0555123456

        becomes:

        213555123456
      */

      if (
        number.startsWith("0")
      ) {

        number =
          "213" +
          number.substring(1);

      }


      /* ==========================================
         CREATE BASE MESSAGE
         ========================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      /* ==========================================
         ADD COMMENT ONLY IF PROVIDED
         ========================================== */

      if (text.length > 0) {

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      /* ==========================================
         ENCODE MESSAGE
         ========================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* ==========================================
         CREATE WHATSAPP URL
         ========================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* ==========================================
         OPEN WHATSAPP
         ========================================== */

      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();


</script>
