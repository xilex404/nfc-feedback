<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#061b3a"
>

<title>Smart Review</title>

<style>

/* =========================================================
   SMART REVIEW — PREMIUM UI
   ========================================================= */

:root{

  --navy:#061b3a;
  --navy-2:#08264d;
  --navy-3:#0c376d;

  --blue:#165dff;
  --blue-2:#2878ff;

  --gold:#d99213;
  --gold-2:#f2b52b;
  --gold-light:#ffd45a;
  --gold-dark:#a96700;

  --white:#ffffff;
  --ink:#071b3c;

  --muted:#61728a;

  --surface:#f7f9fc;

  --shadow:
    0 18px 45px rgba(6,27,58,.12);

}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

html{
  background:var(--navy);
}

body{

  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  color:var(--ink);

  background:#fff;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;

  overflow-x:hidden;

}


/* =========================================================
   APP
   ========================================================= */

.app{

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  position:relative;

  overflow:hidden;

  background:#fff;

}


/* =========================================================
   HERO
   ========================================================= */

.hero{

  position:relative;

  width:100%;

  min-height:435px;

  padding:
    max(24px,env(safe-area-inset-top))
    18px
    105px;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  color:#fff;

  background:

    radial-gradient(
      circle at 50% 8%,
      rgba(255,255,255,.10),
      transparent 27%
    ),

    radial-gradient(
      circle at 15% 55%,
      rgba(38,117,255,.14),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 70%,
      rgba(255,202,67,.07),
      transparent 28%
    ),

    linear-gradient(
      180deg,
      #061b3a 0%,
      #08264d 55%,
      #092d5b 100%
    );

}


/* premium texture */

.hero::before{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  opacity:.16;

  background-image:

    radial-gradient(
      rgba(255,255,255,.18) .65px,
      transparent .65px
    );

  background-size:13px 13px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 86%
    );

}


/* subtle glow */

.hero::after{

  content:"";

  position:absolute;

  width:260px;
  height:260px;

  left:50%;
  top:-160px;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    rgba(255,255,255,.055);

  filter:blur(10px);

  pointer-events:none;

}


/* =========================================================
   GOOGLE ICON
   ========================================================= */

.google-mark{

  position:relative;

  z-index:3;

  width:94px;
  height:94px;

  border-radius:50%;

  background:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-top:7px;
  margin-bottom:20px;

  box-shadow:

    0 16px 38px rgba(0,0,0,.30),

    0 0 0 3px
    rgba(217,146,19,.95),

    0 0 0 7px
    rgba(255,202,67,.18);

  animation:
    googleEnter .7s
    cubic-bezier(.2,.8,.2,1)
    both;

}


.google-mark::after{

  content:"";

  position:absolute;

  inset:-12px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,202,67,.20);

  animation:
    googlePulse 3s
    ease-in-out
    infinite;

}


.google-letter{

  font-family:Arial,sans-serif;

  font-size:61px;

  font-weight:900;

  line-height:1;

  background:

    conic-gradient(
      from -35deg,
      #4285f4 0deg 80deg,
      #34a853 80deg 170deg,
      #fbbc05 170deg 245deg,
      #ea4335 245deg 320deg,
      #4285f4 320deg 360deg
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

}


@keyframes googleEnter{

  from{
    opacity:0;
    transform:
      translateY(-20px)
      scale(.78);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


@keyframes googlePulse{

  0%,100%{
    opacity:.25;
    transform:scale(.96);
  }

  50%{
    opacity:.7;
    transform:scale(1.04);
  }

}


/* =========================================================
   HERO TITLE
   ========================================================= */

.hero-title{

  position:relative;

  z-index:3;

  max-width:760px;

  font-size:
    clamp(24px,6.8vw,36px);

  line-height:1.10;

  font-weight:900;

  letter-spacing:-.8px;

  text-shadow:
    0 4px 18px rgba(0,0,0,.30);

}


/* =========================================================
   HERO STARS
   ========================================================= */

.hero-rating{

  position:relative;

  z-index:3;

  width:100%;

  margin-top:27px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:12px;

}


.rating-line{

  width:
    clamp(24px,12vw,90px);

  height:2px;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(38,129,255,.9)
    );

}


.rating-line.right{

  background:
    linear-gradient(
      90deg,
      rgba(38,129,255,.9),
      transparent
    );

}


.hero-stars{

  display:flex;

  align-items:center;

  gap:5px;

}


.hero-star{

  font-size:
    clamp(31px,8.5vw,52px);

  line-height:1;

  color:var(--gold-light);

  text-shadow:

    0 3px 5px rgba(0,0,0,.45),

    0 0 16px rgba(255,202,67,.18);

  animation:
    heroStarFloat 3s
    ease-in-out
    infinite;

}


.hero-star:nth-child(2){
  animation-delay:.08s;
}

.hero-star:nth-child(3){
  animation-delay:.16s;
}

.hero-star:nth-child(4){
  animation-delay:.24s;
}

.hero-star:nth-child(5){
  animation-delay:.32s;
}


@keyframes heroStarFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-3px);
  }

}


/* =========================================================
   WAVE
   ========================================================= */

.wave-blue{

  position:absolute;

  z-index:4;

  left:-8%;

  bottom:47px;

  width:116%;

  height:72px;

  background:

    linear-gradient(
      180deg,
      #1767ff,
      #124dcc
    );

  clip-path:
    ellipse(
      69% 58%
      at 50% 100%
    );

}


.wave{

  position:absolute;

  z-index:5;

  left:-8%;

  bottom:-2px;

  width:116%;

  height:102px;

  background:#fff;

  clip-path:
    ellipse(
      73% 61%
      at 50% 100%
    );

}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.content{

  position:relative;

  z-index:10;

  width:100%;

  min-height:
    calc(100vh - 400px);

  min-height:
    calc(100dvh - 400px);

  margin-top:-26px;

  padding:
    0 18px
    max(32px,env(safe-area-inset-bottom));

  display:flex;

  flex-direction:column;

  align-items:center;

  background:#fff;

}


/* =========================================================
   CLIENT BRAND
   ========================================================= */

.client-brand{

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

}


/* =========================================================
   LOGO FRAME
   ========================================================= */

.logo-frame{

  width:
    clamp(170px,52vw,225px);

  height:
    clamp(170px,52vw,225px);

  position:relative;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-bottom:18px;

}


/* gold corners */

.logo-frame::before{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:

    linear-gradient(var(--gold),var(--gold))
      left top / 66px 4px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      left top / 4px 66px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      right top / 66px 4px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      right top / 4px 66px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      left bottom / 66px 4px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      left bottom / 4px 66px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      right bottom / 66px 4px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      right bottom / 4px 66px no-repeat;

  filter:
    drop-shadow(
      0 3px 4px
      rgba(169,103,0,.10)
    );

}


/* subtle inner frame */

.logo-frame::after{

  content:"";

  position:absolute;

  inset:10px;

  border-radius:28px;

  border:
    1px solid
    rgba(217,146,19,.07);

}


/* =========================================================
   CLIENT LOGO
   ========================================================= */

.client-logo{

  width:
    clamp(120px,38vw,165px);

  height:
    clamp(120px,38vw,165px);

  border-radius:25px;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:

    linear-gradient(
      145deg,
      #ffffff,
      #f1f4f8
    );

  border:
    1px solid
    rgba(7,27,60,.08);

  box-shadow:

    0 16px 35px
    rgba(7,27,60,.13),

    0 2px 6px
    rgba(7,27,60,.06);

  font-size:54px;

  color:var(--navy-3);

  position:relative;

  z-index:2;

}


.client-logo::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      125deg,
      rgba(255,255,255,.6),
      transparent 35%
    );

}


.client-logo img{

  width:100%;
  height:100%;

  object-fit:cover;

  position:relative;

  z-index:2;

}


/* =========================================================
   BUSINESS NAME
   ========================================================= */

.business-name{

  width:100%;

  max-width:850px;

  color:var(--navy);

  font-size:
    clamp(29px,8vw,43px);

  line-height:1.05;

  font-weight:900;

  letter-spacing:-1px;

  text-align:center;

  overflow-wrap:anywhere;

  margin-bottom:8px;

}


.subtitle{

  color:#586a82;

  font-size:
    clamp(16px,4.4vw,20px);

  line-height:1.45;

  font-weight:600;

  text-align:center;

  margin-bottom:27px;

}


/* =========================================================
   FEEDBACK AREA
   ========================================================= */

.feedback-area{

  width:100%;

  max-width:720px;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  animation:
    contentEnter .55s
    cubic-bezier(.2,.8,.2,1)
    both;

}


@keyframes contentEnter{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   QUESTION
   ========================================================= */

.rating-question{

  width:100%;

  color:var(--navy);

  font-size:
    clamp(22px,6vw,30px);

  line-height:1.15;

  font-weight:850;

  letter-spacing:-.5px;

  margin-bottom:16px;

}


/* =========================================================
   STARS
   ========================================================= */

.stars{

  width:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:
    clamp(2px,1.5vw,12px);

  margin-bottom:8px;

}


.star{

  appearance:none;
  -webkit-appearance:none;

  border:0 !important;
  outline:0 !important;

  background:transparent !important;

  box-shadow:none !important;

  width:
    clamp(55px,15.5vw,88px);

  height:
    clamp(64px,17vw,94px);

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:
    clamp(56px,15.5vw,86px);

  line-height:1;

  color:#cbd1d9;

  cursor:pointer;

  user-select:none;

  -webkit-user-select:none;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;

  transition:

    color .18s ease,

    filter .18s ease,

    transform .14s
    cubic-bezier(.2,.9,.25,1.4);

}


.star:focus,
.star:focus-visible,
.star:active{

  outline:none !important;

  background:transparent !important;

  box-shadow:none !important;

}


.star.active{

  color:var(--gold);

  filter:

    drop-shadow(
      0 5px 6px
      rgba(150,90,0,.27)
    );

  animation:
    starPop .34s
    cubic-bezier(.2,.9,.25,1.4);

}


@keyframes starPop{

  0%{
    transform:scale(.68);
  }

  45%{
    transform:scale(1.19);
  }

  72%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


.star:active{

  transform:scale(.84);

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{

  min-height:27px;

  color:#68788e;

  font-size:
    clamp(15px,4vw,18px);

  line-height:1.4;

  font-weight:650;

  margin-bottom:19px;

}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{

  width:100%;

  display:none;

  animation:
    messageEnter .42s
    cubic-bezier(.2,.8,.2,1)
    both;

}


.message.show{

  display:block;

}


@keyframes messageEnter{

  from{
    opacity:0;
    transform:translateY(14px) scale(.985);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


.message h2{

  color:var(--navy);

  font-size:
    clamp(23px,6vw,31px);

  line-height:1.17;

  font-weight:900;

  letter-spacing:-.55px;

  margin-bottom:9px;

}


.message p{

  max-width:650px;

  margin:
    0 auto 20px;

  color:#61728a;

  font-size:
    clamp(16px,4.3vw,19px);

  line-height:1.52;

}


/* =========================================================
   GOOGLE CTA AREA
   ========================================================= */

#googleArea{

  width:100%;

  margin-top:4px;

}


/* =========================================================
   BUTTON BASE
   ========================================================= */

.button{

  width:100%;

  min-height:72px;

  border-radius:20px;

  border:none;

  display:flex;

  align-items:center;
  justify-content:center;

  text-decoration:none;

  padding:
    17px 20px;

  font-size:
    clamp(18px,4.7vw,22px);

  line-height:1.2;

  font-weight:900;

  cursor:pointer;

  position:relative;

  overflow:hidden;

  transition:

    transform .16s ease,

    box-shadow .22s ease,

    filter .22s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;

}


.button::before{

  content:"";

  position:absolute;

  top:0;
  left:-120%;

  width:70%;
  height:100%;

  transform:skewX(-22deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.38),
      transparent
    );

  animation:
    buttonShine 3.8s
    ease-in-out
    infinite;

}


@keyframes buttonShine{

  0%,
  55%{
    left:-120%;
  }

  72%{
    left:140%;
  }

  100%{
    left:140%;
  }

}


.button:active{

  transform:scale(.975);

}


/* =========================================================
   GOOGLE BUTTON — HIGH VISIBILITY
   ========================================================= */

.google{

  color:#fff;

  background:

    linear-gradient(
      135deg,
      #d89412 0%,
      #f1b52b 48%,
      #c77d08 100%
    );

  border:
    1px solid
    rgba(255,255,255,.25);

  box-shadow:

    0 14px 30px
    rgba(184,117,5,.28),

    0 5px 0
    rgba(143,87,0,.35);

  min-height:76px;

  letter-spacing:-.2px;

  animation:
    googleButtonGlow 2.8s
    ease-in-out
    infinite;

}


.google:hover{

  filter:brightness(1.04);

}


@keyframes googleButtonGlow{

  0%,100%{

    box-shadow:

      0 14px 30px
      rgba(184,117,5,.26),

      0 5px 0
      rgba(143,87,0,.35);

  }

  50%{

    box-shadow:

      0 18px 38px
      rgba(184,117,5,.38),

      0 5px 0
      rgba(143,87,0,.35);

  }

}


/* =========================================================
   PRIVATE BUTTON
   ========================================================= */

.private{

  color:#fff;

  background:

    linear-gradient(
      135deg,
      #123e6d,
      #08294f
    );

  box-shadow:

    0 13px 30px
    rgba(7,27,60,.22),

    0 4px 0
    rgba(3,17,35,.22);

}


.private.sending{

  background:

    linear-gradient(
      135deg,
      #159447,
      #087a37
    );

  box-shadow:

    0 14px 30px
    rgba(20,150,75,.30);

  pointer-events:none;

}


/* =========================================================
   PRIVATE TEXTAREA
   ========================================================= */

textarea{

  width:100%;

  min-height:150px;

  resize:none;

  padding:18px;

  border-radius:19px;

  border:
    1.5px solid
    rgba(7,27,60,.12);

  background:#f6f8fb;

  color:var(--ink);

  outline:none;

  font-family:inherit;

  font-size:18px;

  line-height:1.5;

  margin-bottom:9px;

  -webkit-appearance:none;

  transition:

    border-color .2s ease,

    box-shadow .2s ease;

}


textarea::placeholder{

  color:#7c899a;

}


textarea:focus{

  border-color:
    rgba(22,93,255,.55);

  box-shadow:

    0 0 0 4px
    rgba(22,93,255,.08);

}


/* =========================================================
   SMART REVIEW FOOTER
   ========================================================= */

.brand-footer{

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  margin-top:38px;

  padding:
    23px 0
    4px;

  border-top:
    1px solid
    rgba(7,27,60,.11);

}


/* animated line */

.brand-mini-line{

  width:
    clamp(100px,29vw,160px);

  height:3px;

  margin-bottom:15px;

  border-radius:20px;

  background:

    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      var(--blue),
      transparent
    );

  background-size:200% 100%;

  animation:
    brandingLine 3s
    ease-in-out
    infinite;

}


@keyframes brandingLine{

  0%{
    background-position:0% 50%;
    opacity:.65;
  }

  50%{
    background-position:100% 50%;
    opacity:1;
  }

  100%{
    background-position:0% 50%;
    opacity:.65;
  }

}


/* =========================================================
   SMART REVIEW LOGO
   ========================================================= */

.smart-review{

  position:relative;

  font-size:
    clamp(30px,8.5vw,46px);

  line-height:1;

  font-weight:950;

  letter-spacing:-1.5px;

  background:

    linear-gradient(
      110deg,
      #9d6507 0%,
      #d99213 17%,
      #f3c24c 29%,
      #ffffff 43%,
      #b9c3d0 55%,
      #37628f 73%,
      #061b3a 100%
    );

  background-size:220% 100%;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  filter:
    drop-shadow(
      0 4px 8px
      rgba(7,27,60,.12)
    );

  animation:
    smartLogoShine 4.5s
    ease-in-out
    infinite;

}


.smart-review::after{

  content:"";

  position:absolute;

  left:0;
  right:0;

  bottom:-7px;

  height:2px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(217,146,19,.7),
      transparent
    );

  transform:scaleX(.65);

  animation:
    logoUnderline 2.8s
    ease-in-out
    infinite;

}


@keyframes smartLogoShine{

  0%,
  55%{
    background-position:0% 50%;
  }

  75%{
    background-position:100% 50%;
  }

  100%{
    background-position:100% 50%;
  }

}


@keyframes logoUnderline{

  0%,100%{
    opacity:.45;
    transform:scaleX(.55);
  }

  50%{
    opacity:1;
    transform:scaleX(.9);
  }

}


.smart-review-sub{

  margin-top:13px;

  color:#6b788a;

  font-size:
    clamp(10px,2.8vw,13px);

  font-weight:800;

  letter-spacing:2px;

  text-transform:uppercase;

}


/* =========================================================
   LOADING
   ========================================================= */

.loading{

  color:#9db0c9;

}


.loading-dot{

  display:inline-block;

  width:7px;
  height:7px;

  margin:0 3px;

  border-radius:50%;

  background:var(--gold);

  animation:
    loadingPulse 1s
    infinite ease-in-out;

}


.loading-dot:nth-child(2){
  animation-delay:.15s;
}

.loading-dot:nth-child(3){
  animation-delay:.30s;
}


@keyframes loadingPulse{

  0%,80%,100%{
    opacity:.25;
    transform:scale(.7);
  }

  40%{
    opacity:1;
    transform:scale(1);
  }

}


/* =========================================================

<body>

<div class="app">


<!-- =======================================================
     HERO
     ======================================================= -->

<section class="hero">


  <div class="google-mark">

    <div class="google-letter">

    </div>

  </div>


  <h1 class="hero-title">
    LAISSEZ-NOUS VOTRE AVIS SUR GOOGLE
  </h1>


  <div class="hero-rating">

    <div class="rating-line"></div>

    <div class="hero-stars">

      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>

    </div>

    <div class="rating-line right"></div>

  </div>


  <div class="wave-blue"></div>

  <div class="wave"></div>

</section>



<!-- =======================================================
     MAIN
     ======================================================= -->

<main class="content">


  <!-- =====================================================
       CLIENT
       ===================================================== -->

  <section class="client-brand">


    <div class="logo-frame">

      <div
        class="client-logo"
        id="logo"
        aria-label="Business logo"
      >
        🍽️
      </div>

    </div>


    <h2
      class="business-name"
      id="businessName"
    >
      Loading...
    </h2>


    <p
      class="subtitle"
      id="subtitle"
    >

      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>

    </p>

  </section>



  <!-- =====================================================
       FEEDBACK
       ===================================================== -->

  <section
    id="feedbackArea"
    class="feedback-area hidden"
  >


    <div class="rating-question">
      Comment avez-vous vécu votre expérience ?
    </div>


    <div
      class="stars"
      id="stars"
      role="radiogroup"
      aria-label="Évaluez votre expérience"
    >

      <button
        type="button"
        class="star"
        data-rating="1"
        aria-label="1 étoile"
      >★</button>

      <button
        type="button"
        class="star"
        data-rating="2"
        aria-label="2 étoiles"
      >★</button>

      <button
        type="button"
        class="star"
        data-rating="3"
        aria-label="3 étoiles"
      >★</button>

      <button
        type="button"
        class="star"
        data-rating="4"
        aria-label="4 étoiles"
      >★</button>

      <button
        type="button"
        class="star"
        data-rating="5"
        aria-label="5 étoiles"
      >★</button>

    </div>


    <div
      class="rating-text"
      id="ratingText"
    >
      Touchez une étoile pour commencer
    </div>



    <!-- ===================================================
         MESSAGE
         =================================================== -->

    <section
      class="message"
      id="message"
    >


      <h2 id="messageTitle"></h2>

      <p id="messageText"></p>



      <!-- =================================================
           GOOGLE
           ================================================= -->

      <div
        id="googleArea"
        class="hidden"
      >

        <a
          id="googleButton"
          class="button google"
          href="#"
          target="_blank"
          rel="noopener"
        >

          ⭐ &nbsp; Écrire mon avis sur Google

        </a>

      </div>



      <!-- =================================================
           PRIVATE
           ================================================= -->

      <div
        id="privateArea"
        class="hidden"
      >


        <textarea
          id="feedbackMessage"
          placeholder="Dites-nous ce qui s'est passé ou comment nous pouvons nous améliorer..."
          aria-label="Votre commentaire privé"
        ></textarea>


        <button
          type="button"
          id="sendPrivate"
          class="button private"
        >

          💬 &nbsp; Envoyer mon retour

        </button>


      </div>


    </section>


  </section>



  <!-- =====================================================
       BRANDING
       ===================================================== -->

  <footer class="brand-footer">

    <div class="brand-mini-line"></div>

    <div class="smart-review">
      Smart Review
    </div>

    <div class="smart-review-sub">
      Better feedback. Better businesses.
    </div>

  </footer>


</main>

</div>



<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"
        }
      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  if(!cardCode){

    businessName.textContent =
      "Carte introuvable";


    subtitle.innerHTML =
      `<span class="error">
        Aucun code de carte n'a été fourni.
      </span>`;

    return;

  }


  try{


    /* =====================================================
       FIND CARD
       ===================================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* =====================================================
       FIND BUSINESS
       ===================================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* =====================================================
       BUSINESS NAME
       ===================================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Votre établissement";


    document.title =
      `${currentBusiness.name || "Business"} — Smart Review`;


    subtitle.textContent =
      "Votre opinion compte pour nous.";


    /* =====================================================
       CLIENT LOGO
       ===================================================== */

    if(
      currentBusiness.logo_url
    ){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW URL
       ===================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* =====================================================
       SHOW UI
       ===================================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(error);


    businessName.textContent =
      "Carte introuvable";


    subtitle.innerHTML =
      `<span class="error">
        Cette carte est inactive ou n'existe pas.
      </span>`;

  }

}


/* =========================================================
   ELEMENTS
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {


        selectedRating =
          Number(
            star.dataset.rating
          );


        /* ================================================
           HIGHLIGHT
           ================================================ */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",

              Number(
                s.dataset.rating
              ) <= selectedRating

            );

          }
        );


        /* ================================================
           TEXT
           ================================================ */

        const ratingLabels = {

          1:
            "Nous aimerions faire mieux.",

          2:
            "Merci de nous l'avoir signalé.",

          3:
            "Merci pour votre retour.",

          4:
            "Ravi de l'entendre !",

          5:
            "Incroyable ! Merci beaucoup !"

        };


        ratingText.textContent =
          ratingLabels[
            selectedRating
          ];


        /* ================================================
           MESSAGE ANIMATION
           ================================================ */

        message.classList.remove(
          "show"
        );


        requestAnimationFrame(
          () => {

            requestAnimationFrame(
              () => {

                message.classList.add(
                  "show"
                );

              }
            );

          }
        );


        /* ================================================
           1–2 STARS
           ================================================ */

        if(
          selectedRating <= 2
        ){

          messageTitle.textContent =
            "Nous sommes désolés pour votre expérience.";


          messageText.textContent =
            "Dites-nous ce qui s'est passé. Votre retour nous permet de nous améliorer.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";

        }


        /* ================================================
           3–5 STARS
           ================================================ */

        else{

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(
            selectedRating === 3
          ){

            messageTitle.textContent =
              "Merci pour votre retour !";

          }

          else if(
            selectedRating === 4
          ){

            messageTitle.textContent =
              "Nous sommes ravis !";

          }

          else{

            messageTitle.textContent =
              "Merci ! Nous sommes ravis que vous ayez adoré ! ❤️";

          }


          messageText.textContent =
            "Votre avis peut aider d'autres clients. Nous apprécierions beaucoup votre avis sur Google.";

        }

      }
    );

  }
);


/* =========================================================
   PRIVATE WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {


      const button =
        document.getElementById(
          "sendPrivate"
        );


      const text =
        feedbackMessage
          .value
          .trim();


      /* ===================================================
         CHECK BUSINESS
         =================================================== */

      if(
        !currentBusiness
      ){

        alert(
          "Les informations de l'établissement sont indisponibles."
        );

        return;

      }


      /* ===================================================
         CHECK WHATSAPP
         =================================================== */

      if(
        !currentBusiness.whatsapp_number
      ){

        alert(
          "Le numéro WhatsApp n'est pas configuré."
        );

        return;

      }


      /* ===================================================
         CLEAN NUMBER
         =================================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      if(
        number.startsWith("0")
      ){

        number =
          "213" +
          number.substring(1);

      }


      /* ===================================================
         BUILD MESSAGE
         =================================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Retour privé — ${businessName}

⭐ Note : ${selectedRating}/5`;


      if(
        text.length > 0
      ){

        whatsappMessage +=
`

💬 Commentaire du client :
${text}`;

      }


      /* ===================================================
         BUTTON ANIMATION
         =================================================== */

      button.classList.add(
        "sending"
      );


      button.innerHTML =
        "✓ &nbsp; Ouverture de WhatsApp…";


      /* ===================================================
         URL
         =================================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* ===================================================
         OPEN
         =================================================== */

      setTimeout(
        () => {

          window.location.href =
            whatsappURL;

        },
        450
      );

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>

</body>
