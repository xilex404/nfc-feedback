<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               viewport-fit=cover,
               maximum-scale=1.0,
               user-scalable=no">

<title>Customer Feedback</title>

<style>

/* =========================================================
   SMART REVIEW — CARD-MATCHED DIGITAL EXPERIENCE
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

html{
  background:#071a33;
}

body{
  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  color:#101b31;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;

  background:
    linear-gradient(
      180deg,
      #061a34 0%,
      #092b50 45%,
      #f7f8fb 45.1%,
      #ffffff 100%
    );
}

button,
a,
textarea{
  font:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   APP
   ========================================================= */

.app{
  min-height:100vh;
  min-height:100dvh;

  width:100%;

  position:relative;

  overflow:hidden;

  background:#fff;
}


/* =========================================================
   NAVY HEADER
   ========================================================= */

.hero{
  width:100%;

  min-height:47vh;
  min-height:47dvh;

  position:relative;

  padding:
    max(34px, env(safe-area-inset-top))
    22px
    115px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;

  text-align:center;

  color:#fff;

  background:
    radial-gradient(
      circle at 50% 18%,
      rgba(255,255,255,.10),
      transparent 25%
    ),
    radial-gradient(
      circle at 50% 0%,
      rgba(27,98,180,.20),
      transparent 55%
    ),
    linear-gradient(
      180deg,
      #071b36 0%,
      #082b51 100%
    );

  overflow:hidden;
}


/* =========================================================
   SUBTLE HEADER LIGHT
   ========================================================= */

.hero::before{
  content:"";

  position:absolute;

  width:260px;
  height:260px;

  top:-140px;
  left:50%;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,193,7,.14),
      transparent 68%
    );

  pointer-events:none;
}


/* =========================================================
   GOOGLE MARK
   ========================================================= */

.google-mark{
  width:108px;
  height:108px;

  margin-top:4px;
  margin-bottom:20px;

  border-radius:50%;

  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  box-shadow:
    0 15px 38px rgba(0,0,0,.30),
    0 0 0 2px rgba(255,255,255,.25);

  animation:
    googleEnter .65s cubic-bezier(.2,.8,.2,1) both;
}


/*
   Clean Google-style G.

   The colored pieces are deliberately built
   with CSS instead of using a random icon/font.
*/

.google-g{
  width:65px;
  height:65px;

  border-radius:50%;

  position:relative;

  background:
    conic-gradient(
      from -45deg,
      #4285f4 0deg 90deg,
      #34a853 90deg 180deg,
      #fbbc05 180deg 270deg,
      #ea4335 270deg 360deg
    );

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 0 23px,
      #000 24px
    );

  mask:
    radial-gradient(
      circle,
      transparent 0 23px,
      #000 24px
    );
}


/*
   Google-style horizontal blue bar
*/

.google-g::after{
  content:"";

  position:absolute;

  right:-1px;
  top:28px;

  width:31px;
  height:13px;

  background:#4285f4;

  border-radius:
    0 8px 8px 0;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15);
}


/* =========================================================
   GOOGLE ENTER
   ========================================================= */

@keyframes googleEnter{

  from{
    opacity:0;
    transform:
      translateY(-15px)
      scale(.88);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


/* =========================================================
   HERO TITLE
   ========================================================= */

.hero-title{
  font-size:
    clamp(25px,6.8vw,42px);

  line-height:1.12;

  font-weight:850;

  letter-spacing:-.8px;

  max-width:850px;

  margin-bottom:24px;

  text-transform:uppercase;
}


/* =========================================================
   HERO DIVIDER
   ========================================================= */

.hero-stars{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:
    clamp(8px,2vw,18px);

  margin-bottom:15px;
}

.hero-line{
  width:
    clamp(35px,12vw,100px);

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.85)
    );
}

.hero-line.right{
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.85),
      transparent
    );
}

.hero-star{
  color:#ffb300;

  font-size:
    clamp(29px,8vw,48px);

  line-height:1;

  text-shadow:
    0 5px 14px rgba(255,179,0,.28);
}


/* =========================================================
   WAVY DIVIDER
   ========================================================= */

.wave{
  position:absolute;

  left:-3%;
  right:-3%;

  bottom:-1px;

  width:106%;
  height:115px;

  z-index:5;

  pointer-events:none;
}


/* White wave */

.wave-white{
  position:absolute;

  inset:0;

  background:#fff;

  clip-path:
    polygon(
      0 43%,
      8% 37%,
      17% 27%,
      27% 15%,
      38% 5%,
      50% 0%,
      61% 3%,
      71% 12%,
      81% 23%,
      91% 30%,
      100% 25%,
      100% 100%,
      0 100%
    );
}


/* Blue edge */

.wave-blue{
  position:absolute;

  inset:0;

  transform:
    translateY(-6px);

  background:#2165d7;

  clip-path:
    polygon(
      0 43%,
      8% 37%,
      17% 27%,
      27% 15%,
      38% 5%,
      50% 0%,
      61% 3%,
      71% 12%,
      81% 23%,
      91% 30%,
      100% 25%,
      100% 100%,
      0 100%
    );
}


/* =========================================================
   CONTENT AREA
   ========================================================= */

.content{
  width:100%;

  min-height:53vh;
  min-height:53dvh;

  margin-top:-2px;

  padding:
    20px
    22px
    max(25px,env(safe-area-inset-bottom));

  background:#fff;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  position:relative;
  z-index:10;
}


/* =========================================================
   BUSINESS
   ========================================================= */

.business-logo{
  width:100px;
  height:100px;

  margin-top:-18px;

  margin-bottom:17px;

  border-radius:27px;

  background:#fff;

  border:
    1px solid rgba(8,27,55,.10);

  box-shadow:
    0 12px 32px rgba(12,31,56,.13);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  font-size:44px;
}

.business-logo img{
  width:100%;
  height:100%;

  object-fit:cover;
}


.business-name{
  color:#081a35;

  font-size:
    clamp(27px,7vw,43px);

  font-weight:850;

  line-height:1.12;

  letter-spacing:-.8px;

  margin-bottom:8px;

  overflow-wrap:anywhere;
}


.subtitle{
  color:#64738a;

  font-size:
    clamp(16px,4.2vw,20px);

  line-height:1.45;

  margin-bottom:27px;
}


/* =========================================================
   RATING QUESTION
   ========================================================= */

.rating-question{
  color:#081a35;

  font-size:
    clamp(20px,5vw,27px);

  font-weight:800;

  margin-bottom:13px;
}


/* =========================================================
   STARS
   ========================================================= */

.stars{
  width:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:
    clamp(1px,1.4vw,10px);

  margin-bottom:10px;
}


.star{
  appearance:none;
  -webkit-appearance:none;

  border:none !important;
  outline:none !important;

  background:transparent !important;

  color:#b8c2cf;

  width:
    clamp(52px,14vw,82px);

  height:
    clamp(58px,15vw,88px);

  padding:0;

  margin:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:
    clamp(51px,14vw,78px);

  line-height:1;

  cursor:pointer;

  position:relative;

  border-radius:15px;

  box-shadow:none !important;

  -webkit-tap-highlight-color:transparent;

  user-select:none;
  -webkit-user-select:none;

  touch-action:manipulation;

  transition:
    color .18s ease,
    transform .18s cubic-bezier(.2,.8,.2,1),
    filter .18s ease;
}


/* Remove mobile blue square */

.star:focus,
.star:active{
  outline:none !important;

  background:transparent !important;

  box-shadow:none !important;
}


/* Gold */

.star.active{
  color:#f5ae00;

  filter:
    drop-shadow(
      0 5px 10px
      rgba(245,174,0,.24)
    );

  animation:
    starPop .34s cubic-bezier(.2,.9,.25,1.4);
}


.star:active{
  transform:scale(.84);
}


@keyframes starPop{

  0%{
    transform:scale(.70);
  }

  55%{
    transform:scale(1.16);
  }

  78%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{
  min-height:28px;

  color:#69788d;

  font-size:
    clamp(15px,4vw,18px);

  font-weight:650;

  margin-bottom:21px;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{
  width:100%;

  max-width:650px;

  display:none;

  text-align:center;

  animation:
    messageEnter .4s cubic-bezier(.2,.8,.2,1) both;
}


.message.show{
  display:block;
}


@keyframes messageEnter{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


.message h2{
  color:#081a35;

  font-size:
    clamp(21px,5.3vw,29px);

  line-height:1.2;

  font-weight:850;

  margin-bottom:9px;
}


.message p{
  color:#66758a;

  font-size:
    clamp(15px,4vw,18px);

  line-height:1.5;

  margin:
    0 auto 19px;

  max-width:590px;
}


/* =========================================================
   GOOGLE BUTTON — PREMIUM / HIGH VISIBILITY
   ========================================================= */

.google{
  width:100%;

  min-height:72px;

  position:relative;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:12px;

  padding:18px 22px;

  border-radius:20px;

  border:
    1px solid rgba(20,75,150,.18);

  text-decoration:none;

  color:#fff;

  font-size:
    clamp(17px,4.5vw,21px);

  font-weight:850;

  background:
    linear-gradient(
      135deg,
      #0b63ce 0%,
      #1769d5 48%,
      #0a55b6 100%
    );

  box-shadow:
    0 14px 30px rgba(17,82,170,.25),
    inset 0 1px 0 rgba(255,255,255,.20);

  transition:
    transform .18s ease,
    box-shadow .2s ease;
}


.google::before{
  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:55%;
  height:100%;

  background:
    linear-gradient(
      100deg,
      transparent,
      rgba(255,255,255,.18),
      transparent
    );

  transform:skewX(-20deg);

  animation:
    buttonShine 3.2s infinite;
}


@keyframes buttonShine{

  0%{
    left:-100%;
  }

  35%,
  100%{
    left:140%;
  }

}


.google:hover{
  transform:translateY(-2px);

  box-shadow:
    0 18px 38px rgba(17,82,170,.32),
    inset 0 1px 0 rgba(255,255,255,.22);
}


.google:active{
  transform:scale(.975);
}


.google-icon{
  width:34px;
  height:34px;

  flex:0 0 34px;

  border-radius:50%;

  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  z-index:2;
}


.google-icon .google-g{
  width:23px;
  height:23px;

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 0 8px,
      #000 9px
    );

  mask:
    radial-gradient(
      circle,
      transparent 0 8px,
      #000 9px
    );
}


.google-icon .google-g::after{
  top:10px;

  width:12px;
  height:5px;
}


/* =========================================================
   PRIVATE FEEDBACK
   ========================================================= */

.private{
  margin-top:12px;

  width:100%;

  min-height:68px;

  border:none;

  border-radius:19px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #122d50,
      #0a203d
    );

  font-size:
    clamp(16px,4.2vw,19px);

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 12px 28px rgba(9,31,57,.18);

  transition:
    transform .16s ease;
}


.private:active{
  transform:scale(.975);
}


/* =========================================================
   TEXTAREA
   ========================================================= */

textarea{
  width:100%;

  min-height:145px;

  resize:none;

  padding:17px;

  margin-bottom:8px;

  border-radius:18px;

  border:
    1px solid #d9e0e9;

  background:#f8fafc;

  color:#10203a;

  font-size:
    clamp(16px,4vw,18px);

  line-height:1.5;

  outline:none;

  -webkit-appearance:none;
}


textarea::placeholder{
  color:#8b98a9;
}


textarea:focus{
  border-color:#2770d7;

  box-shadow:
    0 0 0 4px
    rgba(39,112,215,.09);
}


/* =========================================================
   SMART REVIEW BRANDING
   ========================================================= */

.brand-footer{
  width:100%;

  margin-top:auto;

  padding:
    34px
    0
    max(14px,env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;
}


.brand-line{
  width:min(330px,72%);

  height:1px;

  margin-bottom:17px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #d18b00 25%,
      #16457d 50%,
      #d18b00 75%,
      transparent
    );
}


.smart-review{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  font-size:
    clamp(27px,7vw,40px);

  font-weight:850;

  letter-spacing:
    -.7px;

  line-height:1;

  background:
    linear-gradient(
      100deg,
      #b87500 0%,
      #e7b84b 22%,
      #183d6b 48%,
      #9fa9b5 68%,
      #c48712 88%,
      #18385e 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  -webkit-text-fill-color:transparent;

  text-shadow:
    0 8px 25px rgba(18,52,88,.08);
}


.smart-review-sub{
  margin-top:9px;

  color:#718096;

  font-size:
    clamp(10px,2.8vw,13px);

  font-weight:700;

  letter-spacing:1.8px;

  text-transform:uppercase;
}


/* =========================================================
   ERROR
   ========================================================= */

.error{
  color:#d83a3a;
}


.hidden{
  display:none !important;
}


/* =========================================================
   LOADING
   ========================================================= */

.loading-dot{
  display:inline-block;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#2165d7;

  margin:0 3px;

  animation:
    loadingPulse 1s infinite ease-in-out;
}


.loading-dot:nth-child(2){
  animation-delay:.15s;
}


.loading-dot:nth-child(3){
  animation-delay:.3s;
}


@keyframes loadingPulse{

  0%,80%,100%{
    opacity:.25;
    transform:scale(.75);
  }

  40%{
    opacity:1;
    transform:scale(1);
  }

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:390px){

  .hero{
    min-height:45vh;
    min-height:45dvh;

    padding-left:16px;
    padding-right:16px;
  }

  .google-mark{
    width:92px;
    height:92px;
  }

  .google-g{
    width:56px;
    height:56px;

    -webkit-mask:
      radial-gradient(
        circle,
        transparent 0 20px,
        #000 21px
      );

    mask:
      radial-gradient(
        circle,
        transparent 0 20px,
        #000 21px
      );
  }

  .hero-title{
    font-size:25px;
  }

  .business-logo{
    width:88px;
    height:88px;
  }

  .content{
    padding-left:16px;
    padding-right:16px;
  }

}


/* =========================================================
   TABLETS / DESKTOP
   ========================================================= */

@media(min-width:700px){

  .hero{
    min-height:48vh;
    min-height:48dvh;

    padding-top:55px;
  }

  .content{
    min-height:52vh;
    min-height:52dvh;

    padding-left:40px;
    padding-right:40px;
  }

  .business-logo{
    width:115px;
    height:115px;
  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =====================================================
       NAVY GOOGLE HEADER
       ===================================================== -->

  <section class="hero">


    <div class="google-mark">

      <div class="google-g"></div>

    </div>


    <h1 class="hero-title">
      LAISSEZ-NOUS VOTRE AVIS SUR GOOGLE
    </h1>


    <div class="hero-stars">

      <span class="hero-line"></span>

      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>
      <span class="hero-star">★</span>

      <span class="hero-line right"></span>

    </div>


    <!-- CARD-STYLE WAVE -->

    <div class="wave">

      <div class="wave-blue"></div>

      <div class="wave-white"></div>

    </div>

  </section>



  <!-- =====================================================
       WHITE CONTENT
       ===================================================== -->

  <main class="content">


    <!-- BUSINESS LOGO -->

    <div
      class="business-logo"
      id="logo"
      aria-label="Business logo"
    >
      🍽️
    </div>


    <!-- BUSINESS NAME -->

    <h2
      class="business-name"
      id="businessName"
    >
      Loading...
    </h2>


    <!-- SUBTITLE -->

    <p
      class="subtitle"
      id="subtitle"
    >
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
    </p>



    <!-- ===================================================
         FEEDBACK AREA
         =================================================== -->

    <section
      id="feedbackArea"
      class="hidden"
      style="width:100%;max-width:650px;"
    >


      <div class="rating-question">
        How was your experience?
      </div>


      <!-- STARS -->

      <div
        class="stars"
        id="stars"
        role="radiogroup"
        aria-label="Rate your experience"
      >

        <button
          type="button"
          class="star"
          data-rating="1"
          aria-label="1 star"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="2"
          aria-label="2 stars"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="3"
          aria-label="3 stars"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="4"
          aria-label="4 stars"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="5"
          aria-label="5 stars"
        >★</button>

      </div>


      <!-- RATING TEXT -->

      <div
        class="rating-text"
        id="ratingText"
      >
        Tap a star to rate your experience
      </div>



      <!-- =================================================
           MESSAGE
           ================================================= -->

      <section
        class="message"
        id="message"
      >

        <h2 id="messageTitle"></h2>

        <p id="messageText"></p>



        <!-- GOOGLE -->

        <div id="googleArea">

          <a
            id="googleButton"
            class="google"
            href="#"
            target="_blank"
            rel="noopener"
          >

            <span class="google-icon">

              <span class="google-g"></span>

            </span>

            <span>
              Leave an honest Google review
            </span>

          </a>

        </div>



        <!-- PRIVATE FEEDBACK -->

        <div
          id="privateArea"
          class="hidden"
        >

          <textarea
            id="feedbackMessage"
            placeholder="Tell us what went wrong or how we can improve..."
            aria-label="Private feedback"
          ></textarea>


          <button
            type="button"
            id="sendPrivate"
            class="private"
          >
            💬 Send privately
          </button>

        </div>

      </section>

    </section>



    <!-- =====================================================
         SMART REVIEW
         ===================================================== -->

    <footer class="brand-footer">

      <div class="brand-line"></div>

      <div class="smart-review">
        Smart Review
      </div>

      <div class="smart-review-sub">
        Better feedback. Better businesses.
      </div>

    </footer>

  </main>

</div>



<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{
          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"
        }
      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  if(!cardCode){

    businessName.textContent =
      "Card not found";

    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;

    return;

  }


  try{

    /* =====================================================
       FIND CARD
       ===================================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* =====================================================
       FIND BUSINESS
       ===================================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* =====================================================
       BUSINESS NAME
       ===================================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Smart Review`;


    subtitle.textContent =
      "Your opinion matters to us.";


    /* =====================================================
       BUSINESS LOGO
       ===================================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML = "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW LINK
       ===================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* =====================================================
       SHOW PAGE
       ===================================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(error);


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {

        selectedRating =
          Number(
            star.dataset.rating
          );


        /* HIGHLIGHT */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        /* RATING TEXT */

        const ratingLabels = {

          1:
            "We're sorry your experience wasn't better.",

          2:
            "Thanks for telling us.",

          3:
            "Thanks for your feedback.",

          4:
            "Great to hear!",

          5:
            "Amazing! We're thrilled!"

        };


        ratingText.textContent =
          ratingLabels[selectedRating];


        /* REPLAY MESSAGE ANIMATION */

        message.classList.remove(
          "show"
        );


        requestAnimationFrame(
          () => {

            message.classList.add(
              "show"
            );

          }
        );


        /* =================================================
           HONEST REVIEW FLOW
           ================================================= */

        googleArea
          .classList
          .remove("hidden");


        privateArea
          .classList
          .remove("hidden");


        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Your honest feedback helps us improve. You can share it privately with us or leave an honest Google review.";

        }

        else if(selectedRating === 3){

          messageTitle.textContent =
            "Thanks for your feedback!";


          messageText.textContent =
            "We appreciate your honest opinion. You can share your experience on Google or tell us privately.";

        }

        else if(selectedRating === 4){

          messageTitle.textContent =
            "We're glad you enjoyed it!";


          messageText.textContent =
            "Thank you for your honest feedback. We'd love to hear your experience on Google.";

        }

        else{

          messageTitle.textContent =
            "We're thrilled you loved it! ❤️";


          messageText.textContent =
            "Thank you! If you'd like, share your honest experience with others on Google.";

        }

      }
    );

  }
);


/* =========================================================
   PRIVATE WHATSAPP FEEDBACK
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {

      const button =
        document.getElementById(
          "sendPrivate"
        );


      const text =
        feedbackMessage
          .value
          .trim();


      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      if(!currentBusiness.whatsapp_number){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* =================================================
         ACTIVE BUTTON STATE
         ================================================= */

      button.disabled = true;

      button.textContent =
        "✓ Opening WhatsApp…";


      button.style.background =
        "linear-gradient(135deg,#168b55,#0d6f43)";


      button.style.boxShadow =
        "0 12px 28px rgba(18,126,78,.24)";


      setTimeout(
        () => {

          window.location.href =
            whatsappURL;

        },
        450
      );

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>

</body>
</html>
