<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Feedback</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,200,61,.10),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #050d18 0%,
      #07111f 45%,
      #050c16 100%
    );

  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;

  overflow-x:hidden;
}


/* =========================================================
   MAIN CARD
========================================================= */

.card{
  width:100%;
  max-width:440px;

  background:
    linear-gradient(
      145deg,
      rgba(18,39,63,.98),
      rgba(9,23,39,.98)
    );

  border:1px solid rgba(255,255,255,.09);

  border-radius:30px;

  padding:36px 25px 29px;

  text-align:center;

  box-shadow:
    0 30px 90px rgba(0,0,0,.48),
    0 0 0 1px rgba(255,255,255,.015);

  position:relative;

  overflow:hidden;
}


/* premium light */

.card::before{
  content:"";

  position:absolute;

  width:260px;
  height:260px;

  top:-170px;
  left:50%;

  transform:translateX(-50%);

  background:#ffc83d;

  opacity:.055;

  filter:blur(50px);

  pointer-events:none;
}


/* =========================================================
   LOGO
========================================================= */

.logo{
  width:80px;
  height:80px;

  border-radius:23px;

  margin:0 auto 18px;

  background:
    linear-gradient(
      145deg,
      #193754,
      #10263d
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;

  border:1px solid rgba(255,255,255,.11);

  overflow:hidden;

  box-shadow:
    0 12px 30px rgba(0,0,0,.25);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}


/* =========================================================
   TEXT
========================================================= */

h1{
  font-size:26px;

  margin-bottom:8px;

  letter-spacing:-.5px;

  font-weight:800;
}

.subtitle{
  color:#9eacbd;

  font-size:15px;

  line-height:1.5;

  margin-bottom:29px;
}


/* =========================================================
   STARS
========================================================= */

.stars{
  display:flex;

  justify-content:center;

  align-items:center;

  gap:4px;

  margin-bottom:13px;

  padding:4px 0;

  /*
    Important for mobile:
    prevents the browser's native touch highlight
    from visually interfering with the selected star.
  */

  -webkit-tap-highlight-color:transparent;
}


/* STAR BUTTON */

.star{

  /*
    Remove browser/native button styling.
  */

  appearance:none;
  -webkit-appearance:none;

  border:0;
  outline:0;

  background:transparent;

  color:#536174;

  font-size:43px;

  line-height:1;

  cursor:pointer;

  padding:5px;

  margin:0;

  width:52px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  /*
    Prevent mobile browser tap highlight.
  */

  -webkit-tap-highlight-color:transparent;

  /*
    Prevent accidental text selection.
  */

  user-select:none;
  -webkit-user-select:none;

  /*
    Smooth persistent transition.
  */

  transition:
    color .20s ease,
    transform .20s cubic-bezier(.2,.9,.3,1.35),
    filter .20s ease;

  /*
    Make sure browser doesn't fade it.
  */

  opacity:1 !important;
}


/* Hover */

@media (hover:hover){

  .star:hover{
    color:#ffe08a;

    transform:
      translateY(-3px)
      scale(1.10);

    filter:
      drop-shadow(
        0 5px 10px
        rgba(255,200,61,.22)
      );
  }

}


/* =========================================================
   SELECTED STARS
========================================================= */

/*
  THIS is the important fix.

  The gold state is controlled by a permanent class,
  NOT :active.

  So once the customer taps a star, it stays gold.
*/

.star.selected{
  color:#ffc83d !important;

  opacity:1 !important;

  filter:
    drop-shadow(
      0 4px 9px
      rgba(255,200,61,.24)
    );
}


/*
  Tiny premium animation.

  Only the star that was actually clicked gets
  the pop animation.
*/

.star.selected.pop{
  animation:
    starPop
    .42s
    cubic-bezier(.2,.9,.3,1.35);
}


@keyframes starPop{

  0%{
    transform:scale(.72);
  }

  45%{
    transform:scale(1.20);
  }

  70%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


/*
  Small glow on selected stars.
*/

.star.selected::selection{
  background:transparent;
}


/* keyboard focus */

.star:focus-visible{
  outline:
    2px solid rgba(255,200,61,.7);

  outline-offset:3px;

  border-radius:12px;
}


/* =========================================================
   RATING TEXT
========================================================= */

.rating-text{
  min-height:24px;

  color:#b8c3d1;

  font-size:14px;

  margin-bottom:23px;

  transition:
    opacity .2s ease,
    transform .2s ease;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:none;

  text-align:left;

  animation:
    messageAppear
    .32s
    ease;
}


.message.show{
  display:block;
}


@keyframes messageAppear{

  from{
    opacity:0;
    transform:translateY(9px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


.message h2{
  font-size:19px;

  margin-bottom:8px;

  letter-spacing:-.2px;
}


.message p{
  color:#aab7c7;

  font-size:14px;

  line-height:1.5;

  margin-bottom:18px;
}


/* =========================================================
   TEXTAREA
========================================================= */

textarea{

  width:100%;

  min-height:130px;

  resize:vertical;

  padding:14px;

  border-radius:15px;

  border:
    1px solid rgba(255,255,255,.10);

  background:
    rgba(4,13,24,.75);

  color:white;

  font-family:inherit;

  font-size:14px;

  outline:none;

  margin-bottom:10px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}


textarea::placeholder{
  color:#65758a;
}


textarea:focus{

  border-color:
    rgba(255,200,61,.55);

  box-shadow:
    0 0 0 3px
    rgba(255,200,61,.07);
}


/* =========================================================
   BUTTONS
========================================================= */

.button{

  display:block;

  width:100%;

  padding:15px 18px;

  border-radius:15px;

  border:none;

  text-decoration:none;

  font-size:15px;

  font-weight:750;

  cursor:pointer;

  margin-top:11px;

  text-align:center;

  transition:
    transform .15s ease,
    opacity .15s ease,
    box-shadow .2s ease;
}


.button:active{
  transform:scale(.985);
}


/* GOOGLE */

.google{

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #edf1f5
    );

  color:#111827;

  box-shadow:
    0 8px 22px rgba(0,0,0,.20);
}


.google:hover{

  box-shadow:
    0 11px 28px rgba(0,0,0,.28);

  transform:translateY(-1px);
}


/* PRIVATE */

.private{

  background:
    linear-gradient(
      135deg,
      #213b59,
      #172e48
    );

  color:white;

  border:
    1px solid rgba(255,255,255,.07);

  box-shadow:
    0 8px 22px rgba(0,0,0,.20);
}


.private:hover{

  transform:translateY(-1px);

  box-shadow:
    0 11px 28px rgba(0,0,0,.28);
}


/* =========================================================
   FOOTER
========================================================= */

.small{

  margin-top:23px;

  color:#66758a;

  font-size:11px;

  letter-spacing:.1px;
}


.error{
  color:#ff8f8f;
}


.hidden{
  display:none !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

  body{
    padding:14px;
  }

  .card{
    padding:
      32px
      20px
      26px;

    border-radius:27px;
  }

  .logo{
    width:74px;
    height:74px;
  }

  h1{
    font-size:24px;
  }

  .star{

    font-size:40px;

    width:49px;
    height:56px;

    padding:4px;
  }

  .stars{
    gap:1px;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;
  }

}

</style>
</head>


<body>


<main class="card">


  <!-- =====================================================
       LOGO
  ====================================================== -->

  <div
    class="logo"
    id="logo">

    🍽️

  </div>


  <!-- =====================================================
       BUSINESS NAME
  ====================================================== -->

  <h1 id="businessName">
    Loading...
  </h1>


  <p
    class="subtitle"
    id="subtitle">

    Loading your experience...

  </p>


  <!-- =====================================================
       FEEDBACK AREA
  ====================================================== -->

  <div
    id="feedbackArea"
    class="hidden">


    <!-- ===================================================
         STARS
    ==================================================== -->

    <div
      class="stars"
      id="stars">


      <button
        type="button"
        class="star"
        data-rating="1"
        aria-label="1 star"
        aria-pressed="false">

        ★

      </button>


      <button
        type="button"
        class="star"
        data-rating="2"
        aria-label="2 stars"
        aria-pressed="false">

        ★

      </button>


      <button
        type="button"
        class="star"
        data-rating="3"
        aria-label="3 stars"
        aria-pressed="false">

        ★

      </button>


      <button
        type="button"
        class="star"
        data-rating="4"
        aria-label="4 stars"
        aria-pressed="false">

        ★

      </button>


      <button
        type="button"
        class="star"
        data-rating="5"
        aria-label="5 stars"
        aria-pressed="false">

        ★

      </button>


    </div>


    <!-- ===================================================
         RATING TEXT
    ==================================================== -->

    <div
      class="rating-text"
      id="ratingText">

      Tap a star to rate your experience

    </div>


    <!-- ===================================================
         MESSAGE
    ==================================================== -->

    <section
      class="message"
      id="message">


      <h2
        id="messageTitle">
      </h2>


      <p
        id="messageText">
      </p>


      <!-- =================================================
           3–5 STARS → GOOGLE
      ================================================== -->

      <div
        id="googleArea"
        class="hidden">


        <a
          id="googleButton"
          class="button google"
          href="#"
          target="_blank"
          rel="noopener noreferrer">

          ⭐ Leave us a Google review

        </a>


      </div>


      <!-- =================================================
           1–2 STARS → PRIVATE WHATSAPP
      ================================================== -->

      <div
        id="privateArea"
        class="hidden">


        <textarea
          id="feedbackMessage"
          placeholder="Tell us what went wrong or how we can improve..."
          aria-label="Private feedback">
        </textarea>


        <button
          id="sendPrivate"
          class="button private"
          type="button">

          💬 Send privately

        </button>


      </div>


    </section>


  </div>


  <div class="small">

    Your feedback helps us improve.

  </div>


</main>



<script>


/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{
          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"
        }
      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* NO CARD CODE */

  if(!cardCode){

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try{

    /* =====================================================
       FIND CARD
    ====================================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* =====================================================
       FIND BUSINESS
    ====================================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* =====================================================
       BUSINESS NAME
    ====================================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Your Experience`;


    subtitle.textContent =
      "How was your experience with us?";


    /* =====================================================
       LOGO
    ====================================================== */

    if(currentBusiness.logo_url){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML = "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW LINK
    ====================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* =====================================================
       SHOW PAGE
    ====================================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR ELEMENTS
========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   UPDATE STAR VISUAL STATE
========================================================= */

function updateStars(){

  stars.forEach(
    star => {

      const rating =
        Number(
          star.dataset.rating
        );


      const isSelected =
        selectedRating !== null &&
        rating <= selectedRating;


      star.classList.toggle(
        "selected",
        isSelected
      );


      star.setAttribute(
        "aria-pressed",
        rating === selectedRating
          ? "true"
          : "false"
      );

    }
  );

}


/* =========================================================
   STAR CLICK
========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      function(){

        selectedRating =
          Number(
            this.dataset.rating
          );


        /*
          First update ALL selected stars.

          This guarantees that 1 star means:

          ⭐☆☆☆☆

          and 5 stars means:

          ⭐⭐⭐⭐⭐
        */

        updateStars();


        /*
          Remove old animation class from
          every star first.
        */

        stars.forEach(
          s => {

            s.classList.remove(
              "pop"
            );

          }
        );


        /*
          Force browser reflow.

          This allows the same animation to
          replay every time the user selects
          another rating.
        */

        void this.offsetWidth;


        /*
          Animate the star the customer
          actually clicked.
        */

        this.classList.add(
          "pop"
        );


        ratingText.textContent =
          `${selectedRating} out of 5 stars`;


        message.classList.add(
          "show"
        );


        /* =================================================
           1–2 STARS
        ================================================== */

        if(selectedRating <= 2){

          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          /*
            Clear comment when selecting
            a private rating.
          */

          feedbackMessage.value = "";

        }


        /* =================================================
           3–5 STARS
        ================================================== */

        else{

          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if(selectedRating === 3){

            messageTitle.textContent =
              "Thanks for your feedback!";

          }

          else if(selectedRating === 4){

            messageTitle.textContent =
              "We're glad you enjoyed your experience!";

          }

          else{

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }
    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    function(){

      /*
        COMMENT IS OPTIONAL.

        Empty comment is completely valid.
      */

      const text =
        feedbackMessage
          .value
          .trim();


      /* ===================================================
         CHECK BUSINESS
      ==================================================== */

      if(!currentBusiness){

        alert(
          "Business information is unavailable."
        );

        return;

      }


      /* ===================================================
         CHECK WHATSAPP NUMBER
      ==================================================== */

      if(!currentBusiness.whatsapp_number){

        alert(
          "WhatsApp contact is not configured for this business."
        );

        return;

      }


      /* ===================================================
         CLEAN WHATSAPP NUMBER
      ==================================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      /*
        Algeria:

        0555123456

        becomes:

        213555123456
      */

      if(number.startsWith("0")){

        number =
          "213" +
          number.substring(1);

      }


      /* ===================================================
         CREATE MESSAGE
      ==================================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5`;


      /*
        Add customer comment ONLY
        when one was written.
      */

      if(text.length > 0){

        whatsappMessage +=
`

💬 Customer feedback:
${text}`;

      }


      /* ===================================================
         ENCODE
      ==================================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* ===================================================
         WHATSAPP URL
      ==================================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /*
        Nothing is saved to Supabase.

        The customer goes directly to WhatsApp.
      */

      window.location.href =
        whatsappURL;

    }
  );


/* =========================================================
   START
========================================================= */

loadCard();

</script>

</body>
</html>
