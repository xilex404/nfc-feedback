<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Feedback</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      background: #07111f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #0d1b2d;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 34px 24px 28px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
    }

    .logo {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      margin: 0 auto 18px;
      background: #132a45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9eacbd;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 14px;
    }

    .star {
      border: none;
      background: transparent;
      color: #536174;
      font-size: 43px;
      cursor: pointer;
      padding: 2px;
      transition: transform .15s ease, color .15s ease;
    }

    .star:hover {
      transform: scale(1.12);
    }

    .star.active {
      color: #ffc83d;
    }

    .rating-text {
      min-height: 24px;
      color: #b8c3d1;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .message {
      display: none;
      text-align: left;
      animation: appear .25s ease;
    }

    .message.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message h2 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .message p {
      color: #aab7c7;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      padding: 14px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,.1);
      background: #07111f;
      color: white;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
    }

    textarea:focus {
      border-color: #526b89;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 15px;
      border: none;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 11px;
      text-align: center;
    }

    .google {
      background: white;
      color: #111827;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .private {
      background: #1b3049;
      color: white;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      background: #132a45;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.4;
    }

    .small {
      margin-top: 22px;
      color: #66758a;
      font-size: 11px;
    }

    .error {
      color: #ff8f8f;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<main class="card">

  <div class="logo" id="logo">🍽️</div>

  <h1 id="businessName">Loading...</h1>

  <p class="subtitle" id="subtitle">
    Loading your experience...
  </p>

  <div id="feedbackArea" class="hidden">

    <div class="stars">

      <button class="star" data-rating="1">★</button>
      <button class="star" data-rating="2">★</button>
      <button class="star" data-rating="3">★</button>
      <button class="star" data-rating="4">★</button>
      <button class="star" data-rating="5">★</button>

    </div>

    <div class="rating-text" id="ratingText">
      Tap a star to rate your experience
    </div>

    <section class="message" id="message">

      <h2 id="messageTitle"></h2>

      <p id="messageText"></p>

      <!-- HIGH RATING -->
      <div id="highRatingActions" class="hidden">

        <a
          id="googleButton"
          class="button google"
          href="#"
          target="_blank"
          rel="noopener">
          ⭐ Leave us a Google review
        </a>

      </div>


      <!-- LOW RATING -->
      <div id="lowRatingActions" class="hidden">

        <textarea
          id="feedbackMessage"
          placeholder="Tell us what went wrong or how we can improve..."></textarea>

        <button
          id="submitFeedback"
          class="button private">
          📝 Send privately
        </button>

        <a
          id="whatsappButton"
          class="button whatsapp"
          href="#"
          target="_blank"
          rel="noopener">
          💬 Contact us on WhatsApp
        </a>

        <div id="status" class="status"></div>

      </div>

    </section>

  </div>

  <div class="small">
    Your feedback helps us improve.
  </div>

</main>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode() {

  const params =
    new URLSearchParams(window.location.search);

  return params.get("card");
}


/* =========================================================
   SUPABASE REQUEST
   ========================================================= */

async function supabaseRequest(endpoint, options = {}) {

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        ...options,

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(error);
  }

  return response.status === 204
    ? null
    : await response.json();
}


/* =========================================================
   LOAD CARD + BUSINESS
   ========================================================= */

let currentBusinessId = null;
let currentCardId = null;
let currentBusiness = null;

async function loadCard() {

  const cardCode =
    getCardCode();

  const businessName =
    document.getElementById("businessName");

  const subtitle =
    document.getElementById("subtitle");

  if (!cardCode) {

    businessName.textContent =
      "Card not found";

    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;

    return;
  }


  try {

    const cards =
      await supabaseRequest(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if (!cards.length) {

      throw new Error(
        "Card not found"
      );
    }


    const card =
      cards[0];

    currentCardId =
      card.id;

    currentBusinessId =
      card.business_id;


    const businesses =
      await supabaseRequest(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if (!businesses.length) {

      throw new Error(
        "Business not found"
      );
    }


    currentBusiness =
      businesses[0];


    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    subtitle.textContent =
      "How was your experience with us?";


    document.title =
      `${currentBusiness.name} — Your Experience`;


    /* LOGO */

    if (currentBusiness.logo_url) {

      const logo =
        document.getElementById("logo");

      logo.innerHTML =
        `<img
          src="${currentBusiness.logo_url}"
          alt="Business logo">`;
    }


    /* GOOGLE */

    const googleButton =
      document.getElementById("googleButton");

    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* WHATSAPP */

    const whatsappButton =
      document.getElementById("whatsappButton");

    if (currentBusiness.whatsapp_number) {

      let number =
        String(currentBusiness.whatsapp_number)
          .replace(/\D/g, "");

      if (number.startsWith("0")) {

        number =
          "213" + number.substring(1);
      }

      whatsappButton.href =
        `https://wa.me/${number}`;

    } else {

      whatsappButton.classList.add("hidden");
    }


    document
      .getElementById("feedbackArea")
      .classList.remove("hidden");

  }

  catch (error) {

    console.error(error);

    businessName.textContent =
      "Card not found";

    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;
  }
}


/* =========================================================
   STAR SELECTION
   ========================================================= */

const stars =
  document.querySelectorAll(".star");

const ratingText =
  document.getElementById("ratingText");

const message =
  document.getElementById("message");

const messageTitle =
  document.getElementById("messageTitle");

const messageText =
  document.getElementById("messageText");

const highRatingActions =
  document.getElementById("highRatingActions");

const lowRatingActions =
  document.getElementById("lowRatingActions");


let selectedRating = null;


stars.forEach(star => {

  star.addEventListener("click", () => {

    selectedRating =
      Number(star.dataset.rating);


    stars.forEach(s => {

      s.classList.toggle(
        "active",
        Number(s.dataset.rating)
          <= selectedRating
      );

    });


    ratingText.textContent =
      `${selectedRating} out of 5 stars`;


    message.classList.add("show");


    if (selectedRating >= 4) {

      /* ===============================
         4–5 STARS
         =============================== */

      messageTitle.textContent =
        selectedRating === 5
          ? "We're thrilled you enjoyed it! ❤️"
          : "We're glad you had a good experience!";


      messageText.textContent =
        "Thank you! If you have a moment, we'd really appreciate your Google review.";


      highRatingActions
        .classList.remove("hidden");

      lowRatingActions
        .classList.add("hidden");

    } else {

      /* ===============================
         1–3 STARS
         =============================== */

      messageTitle.textContent =
        "We're sorry about your experience.";

      messageText.textContent =
        "Please tell us what happened so we can improve and make things right.";


      highRatingActions
        .classList.add("hidden");

      lowRatingActions
        .classList.remove("hidden");

    }

  });

});


/* =========================================================
   SUBMIT PRIVATE FEEDBACK
   ========================================================= */

document
  .getElementById("submitFeedback")
  .addEventListener("click", async () => {

    const textarea =
      document.getElementById("feedbackMessage");

    const status =
      document.getElementById("status");

    const message =
      textarea.value.trim();


    if (!selectedRating) {

      return;
    }


    if (!message) {

      status.textContent =
        "Please write a message first.";

      status.style.display =
        "block";

      return;
    }


    const button =
      document.getElementById("submitFeedback");

    button.disabled =
      true;

    button.textContent =
      "Sending...";


    try {

      await supabaseRequest(
        "feedback",
        {
          method: "POST",

          headers: {
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({

            business_id:
              currentBusinessId,

            card_id:
              currentCardId,

            rating:
              selectedRating,

            message:
              message

          })
        }
      );


      textarea.value =
        "";

      status.textContent =
        "Thank you. Your feedback has been sent privately to the business.";

      status.style.display =
        "block";

      button.textContent =
        "✓ Feedback sent";

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "We couldn't send your feedback. Please try again.";

      status.style.display =
        "block";

      button.disabled =
        false;

      button.textContent =
        "📝 Send privately";
    }

  });


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>

</body>
</html>
