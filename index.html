<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#061b3a"
>

<title>Smart Review</title>

<style>

/* =========================================================
   SMART REVIEW
   PREMIUM MOBILE EXPERIENCE
   ========================================================= */

:root{

  --navy:#061b3a;
  --navy-2:#08264d;
  --navy-3:#0d376b;

  --blue:#165dff;
  --blue-light:#4285ff;

  --gold:#d99213;
  --gold-light:#ffcf55;
  --gold-dark:#a86600;

  --white:#ffffff;

  --ink:#071b3c;

  --muted:#65758c;

  --soft:#f5f7fa;

}


/* =========================================================
   RESET
   ========================================================= */

*{

  box-sizing:border-box;

  margin:0;
  padding:0;

}

html,
body{

  width:100%;

  min-height:100%;

}

html{

  background:var(--navy);

}

body{

  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;

  text-rendering:optimizeLegibility;

  background:#fff;

  color:var(--ink);

  overflow-x:hidden;

}


/* =========================================================
   APP
   ========================================================= */

.app{

  width:100%;

  min-height:100vh;
  min-height:100dvh;

  position:relative;

  overflow:hidden;

  background:#fff;

}


/* =========================================================
   HERO
   ========================================================= */

.hero{

  position:relative;

  width:100%;

  min-height:425px;

  color:#fff;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  padding:
    max(28px,env(safe-area-inset-top))
    16px
    105px;

  background:

    radial-gradient(
      circle at 50% 3%,
      rgba(255,255,255,.12),
      transparent 28%
    ),

    radial-gradient(
      circle at 50% 100%,
      rgba(30,111,255,.32),
      transparent 55%
    ),

    linear-gradient(
      180deg,
      #061b3a 0%,
      #08264d 65%,
      #092e5c 100%
    );

}


/* texture */

.hero::before{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  opacity:.16;

  background-image:

    radial-gradient(
      rgba(255,255,255,.18) .7px,
      transparent .7px
    );

  background-size:13px 13px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 82%
    );

}


/* glow */

.hero::after{

  content:"";

  position:absolute;

  width:280px;
  height:280px;

  top:-170px;

  left:50%;

  transform:translateX(-50%);

  background:
    rgba(38,117,255,.20);

  filter:blur(60px);

  border-radius:50%;

  pointer-events:none;

}


/* =========================================================
   GOOGLE MARK
   ========================================================= */

.google-mark{

  position:relative;

  z-index:2;

  width:
    clamp(92px,25vw,116px);

  height:
    clamp(92px,25vw,116px);

  border-radius:50%;

  background:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-top:3px;

  margin-bottom:20px;

  box-shadow:

    0 17px 38px
    rgba(0,0,0,.32),

    0 0 0 3px
    rgba(217,146,19,.95),

    0 0 0 7px
    rgba(255,202,67,.16);

  animation:
    googleEnter .7s
    cubic-bezier(.2,.8,.2,1)
    both;

}


.google-mark::after{

  content:"";

  position:absolute;

  inset:8px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.9);

  opacity:.7;

}


.google-letter{

  font-family:Arial,sans-serif;

  font-size:
    clamp(56px,15vw,75px);

  font-weight:800;

  line-height:1;

  background:

    conic-gradient(
      from -35deg,
      #4285f4 0deg 80deg,
      #34a853 80deg 170deg,
      #fbbc05 170deg 245deg,
      #ea4335 245deg 320deg,
      #4285f4 320deg 360deg
    );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;

}


@keyframes googleEnter{

  from{

    opacity:0;

    transform:
      translateY(-20px)
      scale(.78);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* =========================================================
   HERO TITLE
   ========================================================= */

.hero-title{

  position:relative;

  z-index:2;

  max-width:620px;

  font-size:
    clamp(24px,6.5vw,35px);

  line-height:1.12;

  font-weight:900;

  letter-spacing:-.8px;

  text-transform:uppercase;

  text-shadow:
    0 4px 18px
    rgba(0,0,0,.30);

}


/* =========================================================
   HERO RATING
   ========================================================= */

.hero-rating{

  position:relative;

  z-index:3;

  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:
    clamp(6px,2vw,17px);

  margin-top:25px;

}


.rating-line{

  width:
    clamp(24px,11vw,85px);

  height:2px;

  background:

    linear-gradient(
      90deg,
      transparent,
      rgba(38,129,255,.95)
    );

}


.rating-line.right{

  background:

    linear-gradient(
      90deg,
      rgba(38,129,255,.95),
      transparent
    );

}


.hero-stars{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:
    clamp(3px,1vw,8px);

}


.hero-star{

  font-size:
    clamp(31px,8vw,50px);

  line-height:1;

  color:var(--gold-light);

  text-shadow:

    0 4px 5px
    rgba(0,0,0,.45),

    0 0 16px
    rgba(255,202,67,.28);

  transform:
    perspective(300px)
    rotateX(7deg);

}


/* =========================================================
   WAVES
   ========================================================= */

.wave-blue{

  position:absolute;

  z-index:4;

  left:-5%;

  bottom:55px;

  width:110%;

  height:65px;

  background:

    linear-gradient(
      180deg,
      #0c63ff,
      #164fd1
    );

  clip-path:
    ellipse(
      69% 55%
      at 50% 100%
    );

}


.wave{

  position:absolute;

  z-index:5;

  left:-5%;

  bottom:-1px;

  width:110%;

  height:105px;

  background:#fff;

  clip-path:
    ellipse(
      73% 58%
      at 50% 100%
    );

}


/* =========================================================
   CONTENT
   ========================================================= */

.content{

  position:relative;

  z-index:10;

  background:#fff;

  width:100%;

  min-height:
    calc(100vh - 420px);

  min-height:
    calc(100dvh - 420px);

  margin-top:-28px;

  padding:
    0
    17px
    max(34px,env(safe-area-inset-bottom));

  display:flex;

  flex-direction:column;

  align-items:center;

}


/* =========================================================
   CLIENT BRAND
   ========================================================= */

.client-brand{

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  position:relative;

  margin-top:-2px;

}


/* =========================================================
   LOGO FRAME
   ========================================================= */

.logo-frame{

  width:
    clamp(180px,53vw,225px);

  height:
    clamp(180px,53vw,225px);

  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  margin-bottom:20px;

}


/* gold corners */

.logo-frame::before{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:

    linear-gradient(var(--gold),var(--gold))
      left top / 66px 4px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      left top / 4px 66px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      right top / 66px 4px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      right top / 4px 66px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      left bottom / 66px 4px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      left bottom / 4px 66px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      right bottom / 66px 4px no-repeat,

    linear-gradient(var(--gold),var(--gold))
      right bottom / 4px 66px no-repeat;

  opacity:.95;

}


/* =========================================================
   CLIENT LOGO
   ========================================================= */

.client-logo{

  width:
    clamp(130px,39vw,170px);

  height:
    clamp(130px,39vw,170px);

  border-radius:27px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  background:

    linear-gradient(
      145deg,
      #ffffff,
      #eef2f6
    );

  border:
    1px solid
    rgba(7,27,60,.08);

  box-shadow:

    0 18px 40px
    rgba(7,27,60,.15),

    0 3px 7px
    rgba(7,27,60,.06);

  font-size:56px;

  color:#0b315f;

  animation:
    logoFloat 5s
    ease-in-out
    infinite;

}


.client-logo img{

  width:100%;

  height:100%;

  object-fit:cover;

}


@keyframes logoFloat{

  0%,
  100%{

    transform:
      translateY(0);

  }

  50%{

    transform:
      translateY(-4px);

  }

}


/* =========================================================
   BUSINESS NAME
   ========================================================= */

.business-name{

  width:100%;

  max-width:720px;

  font-size:
    clamp(30px,8.5vw,44px);

  line-height:1.06;

  font-weight:900;

  letter-spacing:-1.2px;

  color:var(--navy);

  text-align:center;

  overflow-wrap:anywhere;

  margin-bottom:9px;

}


/* =========================================================
   SUBTITLE
   ========================================================= */

.subtitle{

  width:100%;

  max-width:600px;

  color:#53657d;

  font-size:
    clamp(16px,4.7vw,20px);

  font-weight:600;

  text-align:center;

  line-height:1.45;

  margin-bottom:30px;

}


/* =========================================================
   FEEDBACK
   ========================================================= */

.feedback-area{

  width:100%;

  max-width:680px;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  animation:
    contentEnter .55s
    cubic-bezier(.2,.8,.2,1)
    both;

}


@keyframes contentEnter{

  from{

    opacity:0;

    transform:
      translateY(20px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   QUESTION
   ========================================================= */

.rating-question{

  width:100%;

  color:var(--navy);

  font-size:
    clamp(23px,6.5vw,31px);

  line-height:1.15;

  font-weight:850;

  letter-spacing:-.6px;

  margin-bottom:20px;

}


/* =========================================================
   STARS
   ========================================================= */

.stars{

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:
    clamp(3px,1.2vw,11px);

  margin-bottom:8px;

}


/* =========================================================
   STAR BUTTON
   ========================================================= */

.star{

  appearance:none;

  -webkit-appearance:none;

  border:0 !important;

  outline:none !important;

  background:transparent !important;

  box-shadow:none !important;

  width:
    clamp(61px,17vw,87px);

  height:
    clamp(69px,18vw,95px);

  padding:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:
    clamp(62px,17vw,85px);

  line-height:1;

  color:#c9d0d9;

  cursor:pointer;

  position:relative;

  user-select:none;

  -webkit-user-select:none;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;

  transition:

    color .18s ease,

    filter .18s ease,

    transform .15s
    cubic-bezier(.2,.9,.25,1.4);

}


.star:focus,
.star:focus-visible,
.star:active{

  outline:none !important;

  background:transparent !important;

  box-shadow:none !important;

}


.star.active{

  color:var(--gold);

  filter:

    drop-shadow(
      0 5px 7px
      rgba(150,90,0,.27)
    );

  animation:
    starPop .34s
    cubic-bezier(.2,.9,.25,1.4);

}


@keyframes starPop{

  0%{
    transform:scale(.68);
  }

  45%{
    transform:scale(1.20);
  }

  72%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


.star:active{

  transform:scale(.84);

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{

  min-height:28px;

  color:#65758c;

  font-size:
    clamp(15px,4.2vw,18px);

  font-weight:650;

  margin-bottom:20px;

}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{

  width:100%;

  text-align:center;

  display:none;

  animation:
    messageEnter .4s
    cubic-bezier(.2,.8,.2,1)
    both;

}


.message.show{

  display:block;

}


@keyframes messageEnter{

  from{

    opacity:0;

    transform:
      translateY(14px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   MESSAGE TITLE
   ========================================================= */

.message h2{

  color:var(--navy);

  font-size:
    clamp(24px,6.3vw,32px);

  line-height:1.16;

  font-weight:900;

  letter-spacing:-.6px;

  margin-bottom:10px;

}


/* =========================================================
   MESSAGE TEXT
   ========================================================= */

.message p{

  color:#61728a;

  font-size:
    clamp(16px,4.5vw,19px);

  line-height:1.52;

  max-width:620px;

  margin:
    0 auto 22px;

}


/* =========================================================
   GOOGLE AREA
   ========================================================= */

#googleArea{

  width:100%;

  animation:
    googleAreaEnter .45s
    cubic-bezier(.2,.8,.2,1)
    both;

}


@keyframes googleAreaEnter{

  from{

    opacity:0;

    transform:
      translateY(10px)
      scale(.97);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* =========================================================
   BUTTON BASE
   ========================================================= */

.button{

  width:100%;

  min-height:78px;

  border-radius:22px;

  border:none;

  display:flex;

  align-items:center;

  justify-content:center;

  text-decoration:none;

  padding:19px 22px;

  font-size:
    clamp(18px,5vw,22px);

  font-weight:900;

  cursor:pointer;

  margin-top:10px;

  position:relative;

  overflow:hidden;

  transition:

    transform .16s ease,

    box-shadow .22s ease,

    background .22s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;

}


.button:active{

  transform:
    scale(.965);

}


/* =========================================================
   PREMIUM GOOGLE CTA
   ========================================================= */

.google{

  position:relative;

  isolation:isolate;

  color:#fff;

  background:

    linear-gradient(
      135deg,
      #061b3a 0%,
      #0b3565 48%,
      #08294f 100%
    );

  border:

    2px solid
    rgba(255,205,82,.95);

  box-shadow:

    0 16px 34px
    rgba(7,27,60,.27),

    0 0 0 4px
    rgba(217,146,19,.11),

    0 0 28px
    rgba(217,146,19,.10);

  animation:
    googleAttention 3.6s
    ease-in-out
    infinite;

}


/* gold top edge */

.google::before{

  content:"";

  position:absolute;

  z-index:-1;

  left:0;

  right:0;

  top:0;

  height:5px;

  background:

    linear-gradient(
      90deg,
      var(--gold-dark),
      var(--gold-light),
      #fff0a0,
      var(--gold-light),
      var(--gold-dark)
    );

}


/* shine */

.google::after{

  content:"";

  position:absolute;

  z-index:2;

  top:-30%;

  left:-55%;

  width:35%;

  height:160%;

  transform:
    skewX(-20deg);

  background:

    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.32),
      transparent
    );

  animation:
    buttonShine 4.2s
    ease-in-out
    infinite;

}


@keyframes buttonShine{

  0%,
  52%{

    left:-55%;

  }

  72%{

    left:125%;

  }

  100%{

    left:125%;

  }

}


@keyframes googleAttention{

  0%,
  70%,
  100%{

    transform:
      translateY(0)
      scale(1);

    box-shadow:

      0 16px 34px
      rgba(7,27,60,.27),

      0 0 0 4px
      rgba(217,146,19,.11),

      0 0 28px
      rgba(217,146,19,.10);

  }

  76%{

    transform:
      translateY(-3px)
      scale(1.018);

    box-shadow:

      0 20px 40px
      rgba(7,27,60,.32),

      0 0 0 6px
      rgba(217,146,19,.17),

      0 0 38px
      rgba(217,146,19,.16);

  }

  82%{

    transform:
      translateY(0)
      scale(1);

  }

}


/* =========================================================
   WHATSAPP NORMAL
   ========================================================= */

.private{

  color:#fff;

  background:

    linear-gradient(
      135deg,
      #123e6d,
      #09294d
    );

  box-shadow:

    0 13px 28px
    rgba(7,27,60,.19);

}


/* =========================================================
   WHATSAPP ACTIVE
   ========================================================= */

.private.sending{

  background:

    linear-gradient(
      135deg,
      #159447,
      #087a37
    );

  box-shadow:

    0 15px 32px
    rgba(20,150,75,.30);

  pointer-events:none;

}


/* =========================================================
   TEXTAREA
   ========================================================= */

textarea{

  width:100%;

  min-height:155px;

  resize:none;

  padding:18px;

  border-radius:20px;

  border:
    1.5px solid
    rgba(7,27,60,.12);

  background:#f6f8fb;

  color:var(--ink);

  outline:none;

  font-size:18px;

  line-height:1.5;

  margin-bottom:8px;

  -webkit-appearance:none;

}


textarea::placeholder{

  color:#7c899a;

}


textarea:focus{

  border-color:
    rgba(22,93,255,.55);

  box-shadow:

    0 0 0 4px
    rgba(22,93,255,.08);

}


/* =========================================================
   SMART REVIEW FOOTER
   ========================================================= */

.brand-footer{

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  margin-top:43px;

  padding-top:25px;

  border-top:
    1px solid
    rgba(7,27,60,.11);

}


/* =========================================================
   MINI LINE
   ========================================================= */

.brand-mini-line{

  width:
    clamp(110px,30vw,165px);

  height:3px;

  margin-bottom:15px;

  border-radius:20px;

  background:

    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      var(--blue),
      transparent
    );

  position:relative;

  overflow:hidden;

}


.brand-mini-line::after{

  content:"";

  position:absolute;

  top:0;

  left:-50%;

  width:40%;

  height:100%;

  background:
    rgba(255,255,255,.85);

  filter:blur(2px);

  animation:
    lineShine 3.5s
    ease-in-out
    infinite;

}


@keyframes lineShine{

  0%{

    left:-50%;

  }

  60%,
  100%{

    left:120%;

  }

}


/* =========================================================
   SMART REVIEW LOGO
   ========================================================= */

.smart-review{

  position:relative;

  font-size:
    clamp(34px,9.5vw,48px);

  line-height:1;

  font-weight:950;

  letter-spacing:-1.7px;

  background:

    linear-gradient(
      110deg,
      #8d5a05 0%,
      #d99213 15%,
      #ffcf55 26%,
      #ffffff 39%,
      #c7d0dc 50%,
      #4b79aa 69%,
      #061b3a 100%
    );

  background-size:
    260% 100%;

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;

  filter:

    drop-shadow(
      0 4px 8px
      rgba(7,27,60,.14)
    );

  animation:
    smartLogoMotion 5s
    ease-in-out
    infinite;

}


/* subtle glow behind logo */

.smart-review::after{

  content:"";

  position:absolute;

  z-index:-1;

  left:15%;

  right:15%;

  bottom:-7px;

  height:18px;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,
      rgba(22,93,255,.14),
      transparent 70%
    );

  filter:blur(5px);

  animation:
    logoGlow 3s
    ease-in-out
    infinite;

}


@keyframes smartLogoMotion{

  0%{

    background-position:
      0% 50%;

    transform:
      translateY(0)
      scale(1);

  }

  25%{

    transform:
      translateY(-2px)
      scale(1.008);

  }

  50%{

    background-position:
      100% 50%;

    transform:
      translateY(0)
      scale(1);

  }

  75%{

    transform:
      translateY(-2px)
      scale(1.008);

  }

  100%{

    background-position:
      0% 50%;

    transform:
      translateY(0)
      scale(1);

  }

}


@keyframes logoGlow{

  0%,
  100%{

    opacity:.45;

    transform:
      scaleX(.85);

  }

  50%{

    opacity:.9;

    transform:
      scaleX(1);

  }

}


/* =========================================================
   SMART REVIEW SUBTITLE
   ========================================================= */

.smart-review-sub{

  margin-top:9px;

  color:#6b788a;

  font-size:
    clamp(10px,2.9vw,13px);

  font-weight:750;

  letter-spacing:2.2px;

  text-transform:uppercase;

}


/* =========================================================
   ERROR
   ========================================================= */

.error{

  color:#d83b3b !important;

  font-weight:700;

}


.hidden{

  display:none !important;

}


/* =========================================================
   LOADING
   ========================================================= */

.loading{

  color:#9db0c9;

}


.loading-dot{

  display:inline-block;

  width:7px;

  height:7px;

  margin:0 3px;

  border-radius:50%;

  background:#d99213;

  animation:
    loadingPulse 1s
    infinite ease-in-out;

}


.loading-dot:nth-child(2){

  animation-delay:.15s;

}


.loading-dot:nth-child(3){

  animation-delay:.30s;

}


@keyframes loadingPulse{

  0%,
  80%,
  100%{

    opacity:.25;

    transform:scale(.7);

  }

  40%{

    opacity:1;

    transform:scale(1);

  }

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:390px){

  .hero{

    min-height:395px;

    padding-left:13px;

    padding-right:13px;

  }


  .google-mark{

    margin-bottom:18px;

  }


  .hero-title{

    font-size:23px;

    max-width:355px;

  }


  .hero-rating{

    margin-top:22px;

  }


  .content{

    padding-left:14px;

    padding-right:14px;

  }


  .logo-frame{

    width:170px;

    height:170px;

  }


  .client-logo{

    width:120px;

    height:120px;

  }


  .business-name{

    font-size:29px;

  }


  .rating-question{

    font-size:22px;

  }


  .star{

    width:58px;

    height:66px;

    font-size:57px;

  }


  .button{

    min-height:74px;

    border-radius:20px;

  }


  .smart-review{

    font-size:32px;

  }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media(max-width:350px){

  .hero{

    min-height:380px;

  }


  .hero-title{

    font-size:21px;

  }


  .hero-star{

    font-size:27px;

  }


  .star{

    width:51px;

    height:61px;

    font-size:52px;

  }


  .business-name{

    font-size:27px;

  }


  .rating-question{

    font-size:20px;

  }

}


/* =========================================================
   TALL PHONES
   ========================================================= */

@media(height >= 800px){

  .hero{

    min-height:435px;

  }


  .content{

    margin-top:-30px;

  }


  .client-brand{

    margin-top:-4px;

  }


  .logo-frame{

    margin-bottom:22px;

  }


  .business-name{

    margin-bottom:10px;

  }


  .subtitle{

    margin-bottom:32px;

  }

}


/* =========================================================
   TABLETS / DESKTOP
   ========================================================= */

@media(width >= 700px){

  .hero{

    min-height:500px;

  }


  .content{

    margin-top:-36px;

    padding-left:40px;

    padding-right:40px;

  }


  .client-brand{

    margin-top:-5px;

  }


  .logo-frame{

    width:225px;

    height:225px;

  }


  .client-logo{

    width:170px;

    height:170px;

  }


  .stars{

    gap:10px;

  }


  .star{

    width:84px;

    height:90px;

    font-size:82px;

  }


  .button{

    min-height:78px;

  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =====================================================
       HERO
       ===================================================== -->

  <section class="hero">


    <div class="google-mark">

      <div class="google-letter">
        G
      </div>

    </div>


    <h1 class="hero-title">
      LAISSEZ-NOUS VOTRE AVIS SUR GOOGLE
    </h1>


    <div class="hero-rating">

      <div class="rating-line"></div>

      <div class="hero-stars">

        <span class="hero-star">★</span>
        <span class="hero-star">★</span>
        <span class="hero-star">★</span>
        <span class="hero-star">★</span>
        <span class="hero-star">★</span>

      </div>

      <div class="rating-line right"></div>

    </div>


    <div class="wave-blue"></div>

    <div class="wave"></div>

  </section>



  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="content">


    <!-- CLIENT -->

    <section class="client-brand">


      <div class="logo-frame">

        <div
          class="client-logo"
          id="logo"
          aria-label="Business logo"
        >
          🍽️
        </div>

      </div>


      <h2
        class="business-name"
        id="businessName"
      >
        Loading...
      </h2>


      <p
        class="subtitle"
        id="subtitle"
      >

        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>

      </p>

    </section>



    <!-- FEEDBACK -->

    <section
      id="feedbackArea"
      class="feedback-area hidden"
    >


      <div class="rating-question">
        Comment avez-vous vécu votre expérience ?
      </div>


      <div
        class="stars"
        id="stars"
        role="radiogroup"
        aria-label="Évaluez votre expérience"
      >

        <button
          type="button"
          class="star"
          data-rating="1"
          aria-label="1 étoile"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="2"
          aria-label="2 étoiles"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="3"
          aria-label="3 étoiles"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="4"
          aria-label="4 étoiles"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="5"
          aria-label="5 étoiles"
        >★</button>

      </div>


      <div
        class="rating-text"
        id="ratingText"
      >
        Touchez une étoile pour commencer
      </div>



      <!-- MESSAGE -->

      <section
        class="message"
        id="message"
      >


        <h2 id="messageTitle"></h2>


        <p id="messageText"></p>



        <!-- GOOGLE -->

        <div
          id="googleArea"
          class="hidden"
        >

          <a
            id="googleButton"
            class="button google"
            href="#"
            target="_blank"
            rel="noopener"
          >

            ⭐ Écrire mon avis sur Google

          </a>

        </div>



        <!-- PRIVATE -->

        <div
          id="privateArea"
          class="hidden"
        >


          <textarea
            id="feedbackMessage"
            placeholder="Dites-nous ce qui s'est passé ou comment nous pouvons nous améliorer..."
            aria-label="Votre commentaire privé"
          ></textarea>


          <button
            type="button"
            id="sendPrivate"
            class="button private"
          >

            💬 Envoyer mon retour

          </button>


        </div>


      </section>


    </section>



    <!-- SMART REVIEW -->

    <footer class="brand-footer">


      <div class="brand-mini-line"></div>


      <div class="smart-review">
        Smart Review
      </div>


      <div class="smart-review-sub">
        Better feedback. Better businesses.
      </div>


    </footer>


  </main>

</div>



<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  if(!cardCode){

    businessName.textContent =
      "Carte introuvable";


    subtitle.innerHTML =
      `<span class="error">
        Aucun code de carte n'a été fourni.
      </span>`;


    return;

  }


  try{


    /* FIND CARD */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* FIND BUSINESS */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* BUSINESS NAME */

    businessName.textContent =
      currentBusiness.name ||
      "Votre établissement";


    document.title =
      `${currentBusiness.name || "Business"} — Smart Review`;


    subtitle.textContent =
      "Votre opinion compte pour nous.";


    /* CLIENT LOGO */

    if(
      currentBusiness.logo_url
    ){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* GOOGLE REVIEW */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* SHOW */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(
      error
    );


    businessName.textContent =
      "Carte introuvable";


    subtitle.innerHTML =
      `<span class="error">
        Cette carte est inactive ou n'existe pas.
      </span>`;

  }

}


/* =========================================================
   STAR ELEMENTS
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {


        selectedRating =
          Number(
            star.dataset.rating
          );


        /* HIGHLIGHT */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",

              Number(
                s.dataset.rating
              ) <= selectedRating

            );

          }
        );


        /* RATING LABEL */

        const ratingLabels = {

          1:
            "Nous aimerions faire mieux.",

          2:
            "Merci de nous l'avoir signalé.",

          3:
            "Merci pour votre retour.",

          4:
            "Ravi de l'entendre !",

          5:
            "Incroyable ! Merci beaucoup !"

        };


        ratingText.textContent =
          ratingLabels[
            selectedRating
          ];


        /* MESSAGE ANIMATION */

        message.classList.remove(
          "show"
        );


        requestAnimationFrame(
          () => {

            requestAnimationFrame(
              () => {

                message.classList.add(
                  "show"
                );

              }
            );

          }
        );


        /* =================================================
           1–2 STARS
           ================================================= */

        if(
          selectedRating <= 2
        ){

          messageTitle.textContent =
            "Nous sommes désolés pour votre expérience.";


          messageText.textContent =
            "Dites-nous ce qui s'est passé. Votre retour nous permet de nous améliorer.";


          googleArea
            .classList
            .add(
              "hidden"
            );


          privateArea
            .classList
            .remove(
              "hidden"
            );


          feedbackMessage.value =
            "";

        }


        /* =================================================
           3–5 STARS
           ================================================= */

        else{

          privateArea
            .classList
            .add(
              "hidden"
            );


          googleArea
            .classList
            .remove(
              "hidden"
            );


          if(
            selectedRating === 3
          ){

            messageTitle.textContent =
              "Merci pour votre retour !";

          }

          else if(
            selectedRating === 4
          ){

            messageTitle.textContent =
              "Nous sommes ravis !";

          }

          else{

            messageTitle.textContent =
              "Merci ! Nous sommes ravis que vous ayez adoré ! ❤️";

          }


          messageText.textContent =
            "Votre avis peut aider d'autres clients. Nous apprécierions beaucoup votre avis sur Google.";

        }

      }
    );

  }
);


/* =========================================================
   PRIVATE WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {


      const button =
        document.getElementById(
          "sendPrivate"
        );


      const text =
        feedbackMessage
          .value
          .trim();


      /* CHECK BUSINESS */

      if(
        !currentBusiness
      ){

        alert(
          "Les informations de l'établissement sont indisponibles."
        );

        return;

      }


      /* CHECK WHATSAPP */

      if(
        !currentBusiness.whatsapp_number
      ){

        alert(
          "Le numéro WhatsApp n'est pas configuré."
        );

        return;

      }


      /* CLEAN NUMBER */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      if(
        number.startsWith("0")
      ){

        number =
          "213" +
          number.substring(1);

      }


      /* BUILD MESSAGE */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Retour privé — ${businessName}

⭐ Note : ${selectedRating}/5`;


      if(
        text.length > 0
      ){

        whatsappMessage +=
`

💬 Commentaire du client :
${text}`;

      }


      /* BUTTON ANIMATION */

      button.classList.add(
        "sending"
      );


      button.innerHTML =
        "✓ Ouverture de WhatsApp…";


      /* URL */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* OPEN */

      setTimeout(
        () => {

          window.location.href =
            whatsappURL;

        },
        450
      );

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>

</body>
</html>
