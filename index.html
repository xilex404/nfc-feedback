<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Feedback</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;

      background: #07111f;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;

      background: #0d1b2d;

      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;

      padding: 34px 24px 28px;

      text-align: center;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.35);
    }

    .logo {
      width: 78px;
      height: 78px;

      border-radius: 22px;

      margin: 0 auto 18px;

      background: #132a45;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;

      border: 1px solid rgba(255,255,255,0.1);

      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
      letter-spacing: -0.4px;
    }

    .subtitle {
      color: #9eacbd;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 14px;
    }

    .star {
      border: none;
      background: transparent;

      color: #536174;

      font-size: 43px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        color 0.15s ease;

      padding: 2px;
    }

    .star:hover {
      transform: scale(1.12);
    }

    .star.active {
      color: #ffc83d;
    }

    .rating-text {
      min-height: 24px;

      color: #b8c3d1;

      font-size: 14px;

      margin-bottom: 24px;
    }

    .message {
      display: none;

      text-align: left;

      animation: appear 0.25s ease;
    }

    .message.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message h2 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .message p {
      color: #aab7c7;

      font-size: 14px;
      line-height: 1.5;

      margin-bottom: 18px;
    }

    .button {
      display: block;

      width: 100%;

      padding: 15px 18px;

      border-radius: 15px;

      border: none;

      text-decoration: none;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      margin-top: 11px;

      text-align: center;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .button:active {
      transform: scale(0.98);
    }

    .google {
      background: white;
      color: #111827;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .private {
      background: #1b3049;
      color: white;

      border: 1px solid rgba(255,255,255,0.1);
    }

    .small {
      margin-top: 22px;

      color: #66758a;

      font-size: 11px;
    }

    .loading {
      color: #9eacbd;
      font-size: 15px;
    }

    .error {
      color: #ff8f8f;
      font-size: 15px;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo" id="logo">
      🍽️
    </div>

    <h1 id="businessName">
      Loading...
    </h1>

    <p class="subtitle" id="subtitle">
      <span class="loading">Loading your experience...</span>
    </p>

    <div id="feedbackArea" class="hidden">

      <div class="stars" id="stars">

        <button class="star" data-rating="1">★</button>
        <button class="star" data-rating="2">★</button>
        <button class="star" data-rating="3">★</button>
        <button class="star" data-rating="4">★</button>
        <button class="star" data-rating="5">★</button>

      </div>

      <div class="rating-text" id="ratingText">
        Tap a star to rate your experience
      </div>

      <section class="message" id="message">

        <h2 id="messageTitle"></h2>

        <p id="messageText"></p>

        <a
          id="googleButton"
          class="button google"
          href="#"
          target="_blank"
          rel="noopener">
          ⭐ Share your experience on Google
        </a>

        <a
          id="whatsappButton"
          class="button whatsapp"
          href="#"
          target="_blank"
          rel="noopener">
          💬 Contact us on WhatsApp
        </a>

        <button
          class="button private"
          onclick="showPrivateFeedback()">
          📝 Send private feedback
        </button>

      </section>

    </div>

    <div class="small">
      Your feedback helps us improve.
    </div>

  </main>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE FROM URL
   Supports:

   ?card=TEST001

   and also:

   /TEST001
   ========================================================= */

function getCardCode() {

  const params = new URLSearchParams(window.location.search);

  const queryCard = params.get("card");

  if (queryCard) {
    return queryCard.trim();
  }

  const pathParts =
    window.location.pathname
      .split("/")
      .filter(Boolean);

  const lastPart =
    pathParts[pathParts.length - 1];

  if (
    lastPart &&
    lastPart !== "nfc-feedback" &&
    lastPart !== "index.html"
  ) {
    return decodeURIComponent(lastPart).trim();
  }

  return null;
}


/* =========================================================
   SUPABASE REQUEST
   ========================================================= */

async function supabaseRequest(endpoint) {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${endpoint}`,
    {
      method: "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      }
    }
  );

  if (!response.ok) {

    const errorText = await response.text();

    throw new Error(
      `Supabase error ${response.status}: ${errorText}`
    );
  }

  return response.json();
}


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard() {

  const cardCode = getCardCode();

  const businessName =
    document.getElementById("businessName");

  const subtitle =
    document.getElementById("subtitle");

  const feedbackArea =
    document.getElementById("feedbackArea");


  /* No card code */

  if (!cardCode) {

    businessName.textContent =
      "Card not found";

    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;

    return;
  }


  try {

    /* -----------------------------------------------------
       STEP 1 — Find card
       ----------------------------------------------------- */

    const cards =
      await supabaseRequest(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&select=*`
      );


    if (!cards.length) {

      throw new Error(
        "This card does not exist."
      );
    }


    const card = cards[0];


    /* -----------------------------------------------------
       STEP 2 — Check active
       ----------------------------------------------------- */

    if (!card.active) {

      businessName.textContent =
        "Card inactive";

      subtitle.innerHTML =
        `<span class="error">
          This card has been deactivated.
        </span>`;

      return;
    }


    /* -----------------------------------------------------
       STEP 3 — Find business
       ----------------------------------------------------- */

    const businesses =
      await supabaseRequest(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if (!businesses.length) {

      throw new Error(
        "Business connected to this card was not found."
      );
    }


    const business =
      businesses[0];


    /* -----------------------------------------------------
       STEP 4 — Apply business information
       ----------------------------------------------------- */

    businessName.textContent =
      business.name || "Your Business";


    subtitle.textContent =
      "How was your experience with us?";


    /* -----------------------------------------------------
       LOGO
       ----------------------------------------------------- */

    const logo =
      document.getElementById("logo");

    if (business.logo_url) {

      logo.innerHTML = "";

      const image =
        document.createElement("img");

      image.src =
        business.logo_url;

      image.alt =
        business.name || "Business logo";

      logo.appendChild(image);
    }


    /* -----------------------------------------------------
       PRIMARY COLOR
       ----------------------------------------------------- */

    if (business.primary_color) {

      document.documentElement.style
        .setProperty(
          "--primary-color",
          business.primary_color
        );
    }


    /* -----------------------------------------------------
       GOOGLE BUTTON
       ----------------------------------------------------- */

    const googleButton =
      document.getElementById("googleButton");

    if (business.google_review_url) {

      googleButton.href =
        business.google_review_url;

    } else {

      googleButton.href =
        "https://www.google.com/maps";
    }


    /* -----------------------------------------------------
       WHATSAPP BUTTON
       ----------------------------------------------------- */

    const whatsappButton =
      document.getElementById("whatsappButton");


    if (business.whatsapp_number) {

      let number =
        String(business.whatsapp_number)
          .replace(/\D/g, "");


      /* Algeria number conversion:
         0555xxxxxx
         -> 213555xxxxxx
      */

      if (number.startsWith("0")) {

        number =
          "213" + number.substring(1);
      }


      if (!number.startsWith("213") &&
          number.length <= 10) {

        number =
          "213" + number;
      }


      whatsappButton.href =
        `https://wa.me/${number}`;

    } else {

      whatsappButton.classList.add("hidden");
    }


    /* -----------------------------------------------------
       SHOW PAGE
       ----------------------------------------------------- */

    feedbackArea.classList.remove("hidden");

  }

  catch (error) {

    console.error(error);

    businessName.textContent =
      "Card not found";

    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }
}


/* =========================================================
   STAR RATING
   ========================================================= */

const stars =
  document.querySelectorAll(".star");

const ratingText =
  document.getElementById("ratingText");

const message =
  document.getElementById("message");

const messageTitle =
  document.getElementById("messageTitle");

const messageText =
  document.getElementById("messageText");


const texts = {

  1:
    "We're sorry your experience wasn't great.",

  2:
    "We're sorry we didn't meet your expectations.",

  3:
    "Thanks for the feedback. We'd love to improve.",

  4:
    "We're glad you had a good experience!",

  5:
    "We're thrilled you enjoyed your experience!"

};


stars.forEach(star => {

  star.addEventListener("click", () => {

    const rating =
      Number(star.dataset.rating);


    /* Highlight stars */

    stars.forEach(s => {

      s.classList.toggle(
        "active",
        Number(s.dataset.rating) <= rating
      );

    });


    ratingText.textContent =
      `${rating} out of 5 stars`;


    messageTitle.textContent =
      texts[rating];


    if (rating <= 3) {

      messageText.textContent =
        "We'd really appreciate the chance to hear what went wrong and make things right.";

    } else {

      messageText.textContent =
        "Thank you for taking the time to rate us. If you'd like, you can share your experience publicly or contact us directly.";

    }


    message.classList.add("show");

  });

});


/* =========================================================
   PRIVATE FEEDBACK
   ========================================================= */

function showPrivateFeedback() {

  alert(
    "Private feedback form coming next! We'll connect this to your database so the business receives the message."
  );

}


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>

</body>
</html>
