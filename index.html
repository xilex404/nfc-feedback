<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Feedback</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #07111f;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;

      background: #0d1b2d;

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 28px;

      padding: 34px 24px 28px;

      text-align: center;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.35);
    }

    .logo {
      width: 78px;
      height: 78px;

      border-radius: 22px;

      margin: 0 auto 18px;

      background: #132a45;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;

      border: 1px solid rgba(255,255,255,0.1);

      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;

      letter-spacing: -0.4px;
    }

    .subtitle {
      color: #9eacbd;

      font-size: 15px;

      line-height: 1.5;

      margin-bottom: 30px;
    }

    .stars {
      display: flex;

      justify-content: center;

      gap: 7px;

      margin-bottom: 14px;
    }

    .star {
      border: none;

      background: transparent;

      color: #536174;

      font-size: 43px;

      cursor: pointer;

      padding: 2px;

      transition:
        transform 0.15s ease,
        color 0.15s ease;
    }

    .star:hover {
      transform: scale(1.12);
    }

    .star.active {
      color: #ffc83d;
    }

    .rating-text {
      min-height: 24px;

      color: #b8c3d1;

      font-size: 14px;

      margin-bottom: 24px;
    }

    .message {
      display: none;

      text-align: left;

      animation: appear 0.25s ease;
    }

    .message.show {
      display: block;
    }

    @keyframes appear {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .message h2 {
      font-size: 19px;

      margin-bottom: 8px;
    }

    .message p {
      color: #aab7c7;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 18px;
    }

    textarea {

      width: 100%;

      min-height: 130px;

      resize: vertical;

      padding: 14px;

      border-radius: 15px;

      border:
        1px solid rgba(255,255,255,0.1);

      background: #07111f;

      color: white;

      font-family: inherit;

      font-size: 14px;

      outline: none;

      margin-bottom: 10px;
    }

    textarea:focus {

      border-color: #607994;

    }

    .button {

      display: block;

      width: 100%;

      padding: 15px 18px;

      border-radius: 15px;

      border: none;

      text-decoration: none;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      margin-top: 11px;

      text-align: center;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .button:active {

      transform: scale(0.98);

    }

    .google {

      background: white;

      color: #111827;

    }

    .whatsapp {

      background: #25D366;

      color: white;

    }

    .private {

      background: #1b3049;

      color: white;

    }

    .status {

      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 12px;

      background: #132a45;

      color: #cbd5e1;

      font-size: 13px;

      line-height: 1.4;
    }

    .small {

      margin-top: 22px;

      color: #66758a;

      font-size: 11px;
    }

    .error {

      color: #ff8f8f;
    }

    .hidden {

      display: none !important;

    }

  </style>
</head>


<body>


<main class="card">


  <!-- LOGO -->

  <div
    class="logo"
    id="logo">

    🍽️

  </div>


  <!-- BUSINESS NAME -->

  <h1 id="businessName">

    Loading...

  </h1>


  <!-- SUBTITLE -->

  <p
    class="subtitle"
    id="subtitle">

    Loading your experience...

  </p>


  <!-- FEEDBACK AREA -->

  <div
    id="feedbackArea"
    class="hidden">


    <!-- STARS -->

    <div
      class="stars"
      id="stars">

      <button
        class="star"
        data-rating="1">

        ★

      </button>

      <button
        class="star"
        data-rating="2">

        ★

      </button>

      <button
        class="star"
        data-rating="3">

        ★

      </button>

      <button
        class="star"
        data-rating="4">

        ★

      </button>

      <button
        class="star"
        data-rating="5">

        ★

      </button>

    </div>


    <!-- RATING TEXT -->

    <div
      class="rating-text"
      id="ratingText">

      Tap a star to rate your experience

    </div>


    <!-- MESSAGE -->

    <section
      class="message"
      id="message">


      <h2
        id="messageTitle">

      </h2>


      <p
        id="messageText">

      </p>


      <!-- ==========================================
           3–5 STARS
           ========================================== -->

      <div
        id="googleArea"
        class="hidden">


        <a
          id="googleButton"
          class="button google"
          href="#"
          target="_blank"
          rel="noopener">

          ⭐ Leave us a Google review

        </a>


      </div>


      <!-- ==========================================
           1–2 STARS
           ========================================== -->

      <div
        id="privateArea"
        class="hidden">


        <textarea
          id="feedbackMessage"
          placeholder="Tell us what went wrong or how we can improve...">
        </textarea>


        <button
          id="sendPrivate"
          class="button private">

          💬 Send privately

        </button>


        <div
          id="status"
          class="status">

        </div>


      </div>


    </section>


  </div>


  <div class="small">

    Your feedback helps us improve.

  </div>


</main>



<script>


/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint) {


  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        method: "GET",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard() {


  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* No card code */

  if (!cardCode) {

    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        No card code was provided.
      </span>`;


    return;

  }


  try {


    /* ==========================================
       FIND CARD
       ========================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if (!cards.length) {

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* ==========================================
       FIND BUSINESS
       ========================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if (!businesses.length) {

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* ==========================================
       BUSINESS NAME
       ========================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Your Business";


    document.title =
      `${currentBusiness.name || "Business"} — Your Experience`;


    subtitle.textContent =
      "How was your experience with us?";


    /* ==========================================
       LOGO
       ========================================== */

    if (
      currentBusiness.logo_url
    ) {


      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Business logo";


      logo.appendChild(
        image
      );

    }


    /* ==========================================
       GOOGLE REVIEW LINK
       ========================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* ==========================================
       SHOW PAGE
       ========================================== */

    feedbackArea
      .classList
      .remove("hidden");


  }


  catch (error) {


    console.error(
      error
    );


    businessName.textContent =
      "Card not found";


    subtitle.innerHTML =
      `<span class="error">
        This card is inactive or does not exist.
      </span>`;

  }

}


/* =========================================================
   STAR SYSTEM
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {


    star.addEventListener(
      "click",
      () => {


        selectedRating =
          Number(
            star.dataset.rating
          );


        /* Highlight stars */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",
              Number(
                s.dataset.rating
              ) <= selectedRating
            );

          }
        );


        ratingText.textContent =
          `${selectedRating} out of 5 stars`;


        message.classList.add(
          "show"
        );


        /* ==========================================
           1–2 STARS
           ========================================== */

        if (
          selectedRating <= 2
        ) {


          messageTitle.textContent =
            "We're sorry about your experience.";


          messageText.textContent =
            "Tell us what went wrong and we'll do our best to make things right.";


          googleArea
            .classList
            .add("hidden");


          privateArea
            .classList
            .remove("hidden");


          feedbackMessage.value =
            "";


        }


        /* ==========================================
           3–5 STARS
           ========================================== */

        else {


          privateArea
            .classList
            .add("hidden");


          googleArea
            .classList
            .remove("hidden");


          if (
            selectedRating === 3
          ) {

            messageTitle.textContent =
              "Thanks for your feedback!";

          }


          else if (
            selectedRating === 4
          ) {

            messageTitle.textContent =
              "We're glad you enjoyed your experience!";

          }


          else {

            messageTitle.textContent =
              "We're thrilled you loved it! ❤️";

          }


          messageText.textContent =
            "Thank you! We'd really appreciate you sharing your experience on Google.";

        }

      }

    );

  }
);


/* =========================================================
   SEND PRIVATE FEEDBACK TO WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {


      const text =
        feedbackMessage
          .value
          .trim();


      /* Empty message */

      if (!text) {


        feedbackMessage.focus();


        feedbackMessage.placeholder =
          "Please write your feedback first.";


        return;

      }


      /* No business */

      if (
        !currentBusiness
      ) {


        alert(
          "Business information is unavailable."
        );


        return;

      }


      /* No WhatsApp */

      if (
        !currentBusiness.whatsapp_number
      ) {


        alert(
          "WhatsApp contact is not configured for this business."
        );


        return;

      }


      /* ==========================================
         CLEAN WHATSAPP NUMBER
         ========================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      /*
        Algeria number:

        0555123456

        becomes:

        213555123456
      */

      if (
        number.startsWith("0")
      ) {

        number =
          "213" +
          number.substring(1);

      }


      /* ==========================================
         CREATE MESSAGE
         ========================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      const whatsappMessage =
`🔒 Private feedback — ${businessName}

⭐ Rating: ${selectedRating}/5

💬 Customer feedback:
${text}`;


      /* ==========================================
         ENCODE
         ========================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      /* ==========================================
         WHATSAPP URL
         ========================================== */

      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* ==========================================
         OPEN WHATSAPP
         ========================================== */

      window.location.href =
        whatsappURL;


    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();


</script>


</body>
</html>
