<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Smart Review</title>

<style>

/* =========================================================
   SMART REVIEW — PREMIUM NFC REVIEW EXPERIENCE
   ========================================================= */

:root{

  --navy:#061b3a;
  --navy-2:#08264d;
  --navy-3:#0b315f;

  --blue:#165dff;
  --blue-light:#2675ff;

  --gold:#d99213;
  --gold-light:#ffca43;
  --gold-dark:#a96600;

  --white:#ffffff;
  --ink:#071b3c;

  --muted:#60708a;

}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

html{
  background:#061b3a;
}

body{

  min-height:100vh;
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;

  background:#fff;
  color:var(--ink);

  overflow-x:hidden;

}


/* =========================================================
   APP
   ========================================================= */

.app{

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  position:relative;

  overflow:hidden;

  background:#fff;

}


/* =========================================================
   NAVY HERO
   ========================================================= */

.hero{

  position:relative;

  width:100%;

  min-height:
    clamp(380px,48vh,520px);

  background:

    radial-gradient(
      circle at 50% 12%,
      rgba(255,255,255,.08),
      transparent 28%
    ),

    radial-gradient(
      circle at 50% 100%,
      rgba(32,102,210,.25),
      transparent 55%
    ),

    linear-gradient(
      180deg,
      #061b3a 0%,
      #08264d 100%
    );

  color:#fff;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  padding:

    max(24px,env(safe-area-inset-top))
    20px
    90px;

}


/* =========================================================
   HERO TEXTURE
   ========================================================= */

.hero::before{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  opacity:.18;

  background-image:

    radial-gradient(
      rgba(255,255,255,.14) .7px,
      transparent .7px
    );

  background-size:13px 13px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 80%
    );

}


/* =========================================================
   GOOGLE MARK
   ========================================================= */

.google-mark{

  position:relative;

  z-index:2;

  width:
    clamp(82px,22vw,112px);

  height:
    clamp(82px,22vw,112px);

  border-radius:50%;

  background:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-top:4px;

  margin-bottom:18px;

  box-shadow:

    0 12px 30px
    rgba(0,0,0,.28),

    0 0 0 3px
    rgba(217,146,19,.9),

    0 0 0 5px
    rgba(255,202,67,.35);

  animation:
    googleEnter .65s
    cubic-bezier(.2,.8,.2,1)
    both;

}


.google-letter{

  font-family:
    Arial,
    sans-serif;

  font-size:
    clamp(50px,13vw,70px);

  font-weight:800;

  line-height:1;

  background:

    conic-gradient(
      from -35deg,
      #4285f4 0deg 80deg,
      #34a853 80deg 170deg,
      #fbbc05 170deg 245deg,
      #ea4335 245deg 320deg,
      #4285f4 320deg 360deg
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

}


@keyframes googleEnter{

  from{
    opacity:0;
    transform:
      translateY(-18px)
      scale(.82);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


/* =========================================================
   HERO TITLE
   ========================================================= */

.hero-title{

  position:relative;

  z-index:2;

  font-size:
    clamp(22px,6vw,34px);

  line-height:1.12;

  font-weight:850;

  letter-spacing:-.7px;

  max-width:900px;

  text-transform:uppercase;

  text-shadow:
    0 3px 15px
    rgba(0,0,0,.28);

}


/* =========================================================
   HERO RATING
   ========================================================= */

.hero-rating{

  position:relative;

  z-index:3;

  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:
    clamp(8px,2vw,22px);

  margin-top:27px;

}


.rating-line{

  width:
    clamp(30px,13vw,100px);

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #2681ff
    );

  opacity:.95;

}


.rating-line.right{

  background:
    linear-gradient(
      90deg,
      #2681ff,
      transparent
    );

}


.hero-stars{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:
    clamp(3px,1vw,10px);

}


.hero-star{

  font-size:
    clamp(30px,8vw,53px);

  line-height:1;

  color:var(--gold-light);

  text-shadow:

    0 3px 4px
    rgba(0,0,0,.45),

    0 0 12px
    rgba(255,190,45,.22);

  transform:
    perspective(300px)
    rotateX(7deg);

}


/* =========================================================
   WAVES
   ========================================================= */

.wave{

  position:absolute;

  z-index:5;

  left:-5%;

  bottom:-1px;

  width:110%;

  height:105px;

  background:#fff;

  clip-path:
    ellipse(
      72% 58%
      at 50% 100%
    );

}


.wave-blue{

  position:absolute;

  z-index:4;

  left:-5%;

  bottom:62px;

  width:110%;

  height:58px;

  background:

    linear-gradient(
      180deg,
      #0c63ff,
      #164fd1
    );

  clip-path:
    ellipse(
      68% 55%
      at 50% 100%
    );

}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.content{

  position:relative;

  z-index:10;

  background:#fff;

  min-height:
    calc(100vh - 430px);

  min-height:
    calc(100dvh - 430px);

  margin-top:-18px;

  padding:
    0
    22px
    max(38px,env(safe-area-inset-bottom));

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

}


/* =========================================================
   CLIENT BRAND
   ========================================================= */

.client-brand{

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  margin-top:-10px;

  position:relative;

}


/* =========================================================
   LOGO FRAME
   ========================================================= */

.logo-frame{

  width:
    clamp(170px,50vw,215px);

  height:
    clamp(170px,50vw,215px);

  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  margin-bottom:22px;

}


.logo-frame::before,
.logo-frame::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

}


.logo-frame::before{

  background:

    linear-gradient(
      var(--gold),
      var(--gold)
    ) left top / 62px 4px no-repeat,

    linear-gradient(
      var(--gold),
      var(--gold)
    ) left top / 4px 62px no-repeat,

    linear-gradient(
      var(--gold),
      var(--gold)
    ) right top / 62px 4px no-repeat,

    linear-gradient(
      var(--gold),
      var(--gold)
    ) right top / 4px 62px no-repeat,

    linear-gradient(
      var(--gold),
      var(--gold)
    ) left bottom / 62px 4px no-repeat,

    linear-gradient(
      var(--gold),
      var(--gold)
    ) left bottom / 4px 62px no-repeat,

    linear-gradient(
      var(--gold),
      var(--gold)
    ) right bottom / 62px 4px no-repeat,

    linear-gradient(
      var(--gold),
      var(--gold)
    ) right bottom / 4px 62px no-repeat;

}


.logo-frame::after{

  border-radius:24px;

  box-shadow:
    inset 0 0 0 1px
    rgba(217,146,19,.04);

}


/* =========================================================
   CLIENT LOGO
   ========================================================= */

.client-logo{

  width:
    clamp(122px,37vw,160px);

  height:
    clamp(122px,37vw,160px);

  border-radius:24px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  background:

    linear-gradient(
      145deg,
      #ffffff,
      #f1f4f8
    );

  border:
    1px solid
    rgba(7,27,60,.08);

  box-shadow:

    0 15px 34px
    rgba(7,27,60,.13),

    0 2px 5px
    rgba(7,27,60,.05);

  font-size:52px;

  color:#0b315f;

}


.client-logo img{

  width:100%;
  height:100%;

  object-fit:cover;

}


/* =========================================================
   BUSINESS NAME
   ========================================================= */

.business-name{

  width:100%;

  font-size:
    clamp(30px,8vw,40px);

  line-height:1.08;

  font-weight:850;

  letter-spacing:-1px;

  color:var(--navy);

  text-align:center;

  max-width:900px;

  overflow-wrap:anywhere;

  margin-bottom:10px;

}


.subtitle{

  width:100%;

  color:#53657d;

  font-size:
    clamp(17px,4.7vw,20px);

  font-weight:600;

  text-align:center;

  line-height:1.45;

  margin-bottom:30px;

}


/* =========================================================
   FEEDBACK AREA
   ========================================================= */

.feedback-area{

  width:100%;

  max-width:700px;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  animation:
    contentEnter .55s
    cubic-bezier(.2,.8,.2,1)
    both;

}


@keyframes contentEnter{

  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   QUESTION
   ========================================================= */

.rating-question{

  width:100%;

  color:var(--navy);

  font-size:
    clamp(23px,6.2vw,29px);

  line-height:1.2;

  font-weight:850;

  letter-spacing:-.5px;

  margin-bottom:18px;

}


/* =========================================================
   STARS
   ========================================================= */

.stars{

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:
    clamp(3px,1.8vw,12px);

  margin-bottom:10px;

}


.star{

  appearance:none;
  -webkit-appearance:none;

  border:0 !important;

  outline:none !important;

  background:transparent !important;

  box-shadow:none !important;

  width:
    clamp(60px,16vw,84px);

  height:
    clamp(68px,17vw,90px);

  padding:0;

  margin:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:
    clamp(59px,16vw,82px);

  line-height:1;

  color:#cbd1d9;

  cursor:pointer;

  position:relative;

  border-radius:0;

  user-select:none;

  -webkit-user-select:none;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;

  transition:

    color .18s ease,

    filter .18s ease,

    transform .16s
    cubic-bezier(.2,.9,.25,1.4);

}


.star:focus,
.star:focus-visible,
.star:active{

  outline:none !important;

  background:transparent !important;

  box-shadow:none !important;

}


.star.active{

  color:var(--gold);

  filter:

    drop-shadow(
      0 5px 5px
      rgba(150,90,0,.25)
    );

  animation:
    starPop .34s
    cubic-bezier(.2,.9,.25,1.4);

}


@keyframes starPop{

  0%{
    transform:scale(.68);
  }

  45%{
    transform:scale(1.20);
  }

  72%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}


.star:active{

  transform:scale(.84);

}


/* =========================================================
   RATING TEXT
   ========================================================= */

.rating-text{

  min-height:26px;

  color:#68788e;

  font-size:
    clamp(15px,4vw,18px);

  font-weight:650;

  margin-bottom:20px;

}


/* =========================================================
   MESSAGE
   ========================================================= */

.message{

  width:100%;

  display:none;

  text-align:center;

  animation:
    messageEnter .4s
    cubic-bezier(.2,.8,.2,1)
    both;

}


.message.show{

  display:block;

}


@keyframes messageEnter{

  from{
    opacity:0;
    transform:translateY(13px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


.message h2{

  color:var(--navy);

  font-size:
    clamp(23px,6.2vw,30px);

  line-height:1.18;

  font-weight:850;

  letter-spacing:-.5px;

  margin-bottom:8px;

}


.message p{

  color:#61728a;

  font-size:
    clamp(16px,4.2vw,19px);

  line-height:1.5;

  max-width:620px;

  margin:
    0 auto 20px;

}


/* =========================================================
   TEXTAREA
   ========================================================= */

textarea{

  width:100%;

  min-height:145px;

  resize:none;

  padding:17px;

  border-radius:18px;

  border:
    1.5px solid
    rgba(7,27,60,.12);

  background:#f6f8fb;

  color:var(--ink);

  outline:none;

  font-size:18px;

  line-height:1.5;

  margin-bottom:8px;

  -webkit-appearance:none;

}


textarea::placeholder{

  color:#7c899a;

}


textarea:focus{

  border-color:
    rgba(22,93,255,.55);

  box-shadow:

    0 0 0 4px
    rgba(22,93,255,.08);

}


/* =========================================================
   BUTTON BASE
   ========================================================= */

.button{

  width:100%;

  min-height:66px;

  border-radius:18px;

  border:none;

  display:flex;

  align-items:center;

  justify-content:center;

  text-decoration:none;

  padding:17px 20px;

  font-size:
    clamp(17px,4.4vw,21px);

  font-weight:850;

  cursor:pointer;

  margin-top:10px;

  transition:

    transform .16s ease,

    box-shadow .22s ease,

    background .22s ease,

    opacity .2s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;

}


.button:active{

  transform:scale(.975);

}


/* =========================================================
   GOOGLE REVIEW — PREMIUM HERO CTA
   ========================================================= */

.google{

  color:#fff;

  background:

    linear-gradient(
      135deg,
      #051832 0%,
      #08264d 48%,
      #0d3970 100%
    );

  border:
    2px solid
    rgba(255,202,67,.82);

  min-height:82px;

  padding:21px 22px;

  font-size:
    clamp(19px,5.2vw,23px);

  font-weight:900;

  letter-spacing:-.25px;

  border-radius:20px;

  box-shadow:

    0 15px 34px
    rgba(6,27,58,.27),

    0 0 0 1px
    rgba(255,202,67,.10),

    0 0 25px
    rgba(255,202,67,.15);

  position:relative;

  overflow:hidden;

  transform:translateZ(0);

  animation:
    googleAttention 3.2s
    ease-in-out
    infinite;

}


/* Google shine */

.google::before{

  content:"";

  position:absolute;

  top:0;

  left:-130%;

  width:65%;

  height:100%;

  background:

    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.30),
      transparent
    );

  transform:skewX(-20deg);

  animation:
    googleShine 4s
    ease-in-out
    infinite;

  pointer-events:none;

}


/* Inner gold border */

.google::after{

  content:"";

  position:absolute;

  inset:4px;

  border-radius:15px;

  border:
    1px solid
    rgba(255,202,67,.18);

  pointer-events:none;

}


@keyframes googleAttention{

  0%,
  70%,
  100%{

    box-shadow:

      0 15px 34px
      rgba(6,27,58,.27),

      0 0 25px
      rgba(255,202,67,.12);

  }

  84%{

    box-shadow:

      0 17px 38px
      rgba(6,27,58,.31),

      0 0 34px
      rgba(255,202,67,.25);

  }

}


@keyframes googleShine{

  0%{
    left:-130%;
  }

  35%,
  100%{
    left:145%;
  }

}


.google:hover{

  transform:translateY(-3px);

  box-shadow:

    0 18px 40px
    rgba(6,27,58,.32),

    0 0 32px
    rgba(255,202,67,.22);

}


.google:active{

  transform:scale(.965);

}


/* =========================================================
   PRIVATE WHATSAPP
   ========================================================= */

.private{

  color:#fff;

  background:

    linear-gradient(
      135deg,
      #123e6d,
      #09294d
    );

  box-shadow:

    0 10px 25px
    rgba(7,27,60,.18);

}


.private.sending{

  background:

    linear-gradient(
      135deg,
      #159447,
      #087a37
    );

  box-shadow:

    0 12px 28px
    rgba(20,150,75,.28);

  pointer-events:none;

}


/* =========================================================
   SMART REVIEW FOOTER
   ========================================================= */

.brand-footer{

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  margin-top:38px;

  padding-top:23px;

  border-top:
    1px solid
    rgba(7,27,60,.12);

}


.brand-mini-line{

  width:
    clamp(90px,25vw,150px);

  height:3px;

  margin-bottom:14px;

  border-radius:20px;

  background:

    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      var(--blue),
      transparent
    );

}


.smart-review{

  position:relative;

  font-size:
    clamp(31px,8.5vw,44px);

  line-height:1;

  font-weight:900;

  letter-spacing:-1.3px;

  background:

    linear-gradient(
      110deg,
      #9b6205 0%,
      #d99213 18%,
      #ffca43 29%,
      #f8f9fb 42%,
      #c1cad6 54%,
      #315b88 72%,
      #061b3a 100%
    );

  background-size:220% 100%;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  filter:
    drop-shadow(
      0 4px 8px
      rgba(7,27,60,.13)
    );

  animation:
    smartReviewShine 5.5s
    ease-in-out
    infinite;

}


@keyframes smartReviewShine{

  0%,
  18%{

    background-position:0% 50%;

    transform:translateY(0);

  }

  48%{

    background-position:100% 50%;

    transform:translateY(-1px);

  }

  58%{

    background-position:100% 50%;

    transform:translateY(0);

  }

  82%,
  100%{

    background-position:0% 50%;

    transform:translateY(0);

  }

}


.smart-review-sub{

  margin-top:7px;

  color:#6b788a;

  font-size:
    clamp(10px,2.8vw,13px);

  font-weight:750;

  letter-spacing:2px;

  text-transform:uppercase;

}


/* =========================================================
   ERROR
   ========================================================= */

.error{

  color:#d83b3b !important;

  font-weight:700;

}


.hidden{

  display:none !important;

}


/* =========================================================
   LOADING
   ========================================================= */

.loading{

  color:#9db0c9;

}


.loading-dot{

  display:inline-block;

  width:7px;
  height:7px;

  margin:0 3px;

  border-radius:50%;

  background:#d99213;

  animation:
    loadingPulse 1s
    infinite ease-in-out;

}


.loading-dot:nth-child(2){
  animation-delay:.15s;
}

.loading-dot:nth-child(3){
  animation-delay:.30s;
}


@keyframes loadingPulse{

  0%,80%,100%{
    opacity:.25;
    transform:scale(.7);
  }

  40%{
    opacity:1;
    transform:scale(1);
  }

}


/* =========================================================
   PHONE OPTIMIZATION
   ========================================================= */

@media(max-width:600px){

  .content{

    padding-left:18px;

    padding-right:18px;

    padding-bottom:
      max(42px,env(safe-area-inset-bottom));

  }


  .client-brand{

    width:100%;

    margin-top:-7px;

  }


  .logo-frame{

    width:175px;

    height:175px;

    margin-bottom:20px;

  }


  .client-logo{

    width:128px;

    height:128px;

    border-radius:24px;

  }


  .business-name{

    font-size:
      clamp(30px,8.5vw,38px);

    max-width:95%;

  }


  .rating-question{

    max-width:95%;

    font-size:
      clamp(23px,6.5vw,28px);

    margin-bottom:14px;

  }


  .stars{

    gap:2px;

    margin-bottom:7px;

  }


  .star{

    width:18vw;

    height:19vw;

    font-size:18vw;

    max-width:76px;

    max-height:82px;

  }


  .rating-text{

    font-size:16px;

    margin-bottom:20px;

  }


  .message h2{

    font-size:
      clamp(23px,6.5vw,29px);

  }


  .message p{

    font-size:17px;

    max-width:94%;

    margin-bottom:20px;

  }


  .google{

    min-height:82px;

    width:100%;

    font-size:
      clamp(19px,5.3vw,22px);

    padding:
      20px 18px;

    border-radius:20px;

  }


  .brand-footer{

    margin-top:38px;

    padding-top:23px;

  }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media(max-width:390px){

  .hero{

    min-height:355px;

    padding-left:15px;

    padding-right:15px;

  }


  .hero-title{

    font-size:21px;

  }


  .hero-rating{

    margin-top:22px;

  }


  .content{

    padding-left:16px;

    padding-right:16px;

  }


  .logo-frame{

    width:160px;

    height:160px;

  }


  .client-logo{

    width:118px;

    height:118px;

  }


  .star{

    width:18vw;

    height:19vw;

    font-size:18vw;

  }


  .google{

    min-height:78px;

    font-size:18px;

    padding-left:15px;

    padding-right:15px;

  }

}


/* =========================================================
   TALL PHONES
   ========================================================= */

@media(height >= 800px){

  .hero{

    min-height:425px;

  }


  .content{

    margin-top:-25px;

  }


  .client-brand{

    margin-top:-5px;

  }

}


/* =========================================================
   TABLETS / DESKTOP
   ========================================================= */

@media(width >= 700px){

  .hero{

    min-height:500px;

  }


  .content{

    margin-top:-35px;

    padding-left:40px;

    padding-right:40px;

  }


  .client-brand{

    margin-top:-5px;

  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =====================================================
       NAVY CARD HEADER
       ===================================================== -->

  <section class="hero">


    <div class="google-mark">

      <div class="google-letter">
        G
      </div>

    </div>


    <h1 class="hero-title">
      LAISSEZ-NOUS VOTRE AVIS SUR GOOGLE
    </h1>


    <div class="hero-rating">

      <div class="rating-line"></div>

      <div class="hero-stars">

        <span class="hero-star">★</span>
        <span class="hero-star">★</span>
        <span class="hero-star">★</span>
        <span class="hero-star">★</span>
        <span class="hero-star">★</span>

      </div>

      <div class="rating-line right"></div>

    </div>


    <div class="wave-blue"></div>

    <div class="wave"></div>

  </section>



  <!-- =====================================================
       WHITE CONTENT
       ===================================================== -->

  <main class="content">


    <section class="client-brand">


      <div class="logo-frame">

        <div
          class="client-logo"
          id="logo"
          aria-label="Business logo"
        >
          🍽️
        </div>

      </div>


      <h2
        class="business-name"
        id="businessName"
      >
        Loading...
      </h2>


      <p
        class="subtitle"
        id="subtitle"
      >

        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>

      </p>

    </section>



    <!-- ===================================================
         FEEDBACK
         =================================================== -->

    <section
      id="feedbackArea"
      class="feedback-area hidden"
    >


      <div class="rating-question">
        Comment avez-vous vécu votre expérience ?
      </div>


      <div
        class="stars"
        id="stars"
        role="radiogroup"
        aria-label="Évaluez votre expérience"
      >

        <button
          type="button"
          class="star"
          data-rating="1"
          aria-label="1 étoile"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="2"
          aria-label="2 étoiles"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="3"
          aria-label="3 étoiles"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="4"
          aria-label="4 étoiles"
        >★</button>


        <button
          type="button"
          class="star"
          data-rating="5"
          aria-label="5 étoiles"
        >★</button>

      </div>


      <div
        class="rating-text"
        id="ratingText"
      >
        Touchez une étoile pour commencer
      </div>



      <!-- =================================================
           MESSAGE
           ================================================= -->

      <section
        class="message"
        id="message"
      >


        <h2 id="messageTitle"></h2>


        <p id="messageText"></p>



        <!-- GOOGLE -->

        <div
          id="googleArea"
          class="hidden"
        >

          <a
            id="googleButton"
            class="button google"
            href="#"
            target="_blank"
            rel="noopener"
          >

            ⭐ Écrire mon avis sur Google

          </a>

        </div>



        <!-- PRIVATE FEEDBACK -->

        <div
          id="privateArea"
          class="hidden"
        >


          <textarea
            id="feedbackMessage"
            placeholder="Dites-nous ce qui s'est passé ou comment nous pouvons nous améliorer..."
            aria-label="Votre commentaire privé"
          ></textarea>


          <button
            type="button"
            id="sendPrivate"
            class="button private"
          >

            💬 Envoyer mon retour

          </button>


        </div>


      </section>


    </section>



    <!-- ===================================================
         SMART REVIEW
         =================================================== -->

    <footer class="brand-footer">


      <div class="brand-mini-line"></div>


      <div class="smart-review">
        Smart Review
      </div>


      <div class="smart-review-sub">
        Better feedback. Better businesses.
      </div>


    </footer>


  </main>

</div>



<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://mcujzqtfbwjttjieagas.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4eVDX1IKZj7ClhpcjfiQFQ_hQ5Hr81k";


/* =========================================================
   GET CARD CODE
   ========================================================= */

function getCardCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("card");

}


/* =========================================================
   SUPABASE GET
   ========================================================= */

async function supabaseGet(endpoint){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {
        method:"GET",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const error =
      await response.text();

    throw new Error(error);

  }


  return response.json();

}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentBusiness = null;

let selectedRating = null;


/* =========================================================
   LOAD CARD
   ========================================================= */

async function loadCard(){

  const cardCode =
    getCardCode();


  const businessName =
    document.getElementById(
      "businessName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const feedbackArea =
    document.getElementById(
      "feedbackArea"
    );


  /* =======================================================
     NO CARD
     ======================================================= */

  if(!cardCode){

    businessName.textContent =
      "Carte introuvable";


    subtitle.innerHTML =
      `<span class="error">
        Aucun code de carte n'a été fourni.
      </span>`;


    return;

  }


  try{


    /* =====================================================
       FIND CARD
       ===================================================== */

    const cards =
      await supabaseGet(
        `cards?card_code=eq.${encodeURIComponent(cardCode)}&active=eq.true&select=*`
      );


    if(!cards.length){

      throw new Error(
        "Card not found"
      );

    }


    const card =
      cards[0];


    /* =====================================================
       FIND BUSINESS
       ===================================================== */

    const businesses =
      await supabaseGet(
        `businesses?id=eq.${encodeURIComponent(card.business_id)}&select=*`
      );


    if(!businesses.length){

      throw new Error(
        "Business not found"
      );

    }


    currentBusiness =
      businesses[0];


    /* =====================================================
       BUSINESS NAME
       ===================================================== */

    businessName.textContent =
      currentBusiness.name ||
      "Votre établissement";


    document.title =
      `${currentBusiness.name || "Business"} — Smart Review`;


    subtitle.textContent =
      "Votre opinion compte pour nous.";


    /* =====================================================
       CLIENT LOGO
       ===================================================== */

    if(
      currentBusiness.logo_url
    ){

      const logo =
        document.getElementById(
          "logo"
        );


      logo.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        currentBusiness.logo_url;


      image.alt =
        currentBusiness.name ||
        "Logo";


      image.onerror =
        function(){

          logo.innerHTML =
            "🍽️";

        };


      logo.appendChild(
        image
      );

    }


    /* =====================================================
       GOOGLE REVIEW
       ===================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    googleButton.href =
      currentBusiness.google_review_url ||
      "https://www.google.com/maps";


    /* =====================================================
       SHOW
       ===================================================== */

    feedbackArea
      .classList
      .remove("hidden");

  }


  catch(error){

    console.error(
      error
    );


    businessName.textContent =
      "Carte introuvable";


    subtitle.innerHTML =
      `<span class="error">
        Cette carte est inactive ou n'existe pas.
      </span>`;

  }

}


/* =========================================================
   STAR ELEMENTS
   ========================================================= */

const stars =
  document.querySelectorAll(
    ".star"
  );


const ratingText =
  document.getElementById(
    "ratingText"
  );


const message =
  document.getElementById(
    "message"
  );


const messageTitle =
  document.getElementById(
    "messageTitle"
  );


const messageText =
  document.getElementById(
    "messageText"
  );


const googleArea =
  document.getElementById(
    "googleArea"
  );


const privateArea =
  document.getElementById(
    "privateArea"
  );


const feedbackMessage =
  document.getElementById(
    "feedbackMessage"
  );


/* =========================================================
   STAR CLICK
   ========================================================= */

stars.forEach(
  star => {

    star.addEventListener(
      "click",
      () => {


        selectedRating =
          Number(
            star.dataset.rating
          );


        /* =================================================
           HIGHLIGHT
           ================================================= */

        stars.forEach(
          s => {

            s.classList.toggle(
              "active",

              Number(
                s.dataset.rating
              ) <= selectedRating

            );

          }
        );


        /* =================================================
           RATING LABEL
           ================================================= */

        const ratingLabels = {

          1:
            "Nous aimerions faire mieux.",

          2:
            "Merci de nous l'avoir signalé.",

          3:
            "Merci pour votre retour.",

          4:
            "Ravi de l'entendre !",

          5:
            "Incroyable ! Merci beaucoup !"

        };


        ratingText.textContent =
          ratingLabels[
            selectedRating
          ];


        /* =================================================
           REPLAY MESSAGE ANIMATION
           ================================================= */

        message.classList.remove(
          "show"
        );


        requestAnimationFrame(
          () => {

            requestAnimationFrame(
              () => {

                message.classList.add(
                  "show"
                );

              }
            );

          }
        );


        /* =================================================
           1–2 STARS
           ================================================= */

        if(
          selectedRating <= 2
        ){

          messageTitle.textContent =
            "Nous sommes désolés pour votre expérience.";


          messageText.textContent =
            "Dites-nous ce qui s'est passé. Votre retour nous permet de nous améliorer.";


          googleArea
            .classList
            .add(
              "hidden"
            );


          privateArea
            .classList
            .remove(
              "hidden"
            );


          feedbackMessage.value =
            "";


        }


        /* =================================================
           3–5 STARS
           ================================================= */

        else{


          privateArea
            .classList
            .add(
              "hidden"
            );


          googleArea
            .classList
            .remove(
              "hidden"
            );


          if(
            selectedRating === 3
          ){

            messageTitle.textContent =
              "Merci pour votre retour !";

          }

          else if(
            selectedRating === 4
          ){

            messageTitle.textContent =
              "Nous sommes ravis !";

          }

          else{

            messageTitle.textContent =
              "Merci ! Nous sommes ravis que vous ayez adoré ! ❤️";

          }


          messageText.textContent =
            "Votre avis peut aider d'autres clients. Nous apprécierions beaucoup votre avis sur Google.";

        }

      }
    );

  }
);


/* =========================================================
   PRIVATE WHATSAPP
   ========================================================= */

document
  .getElementById(
    "sendPrivate"
  )
  .addEventListener(
    "click",
    () => {


      const button =
        document.getElementById(
          "sendPrivate"
        );


      const text =
        feedbackMessage
          .value
          .trim();


      /* =====================================================
         CHECK BUSINESS
         ===================================================== */

      if(
        !currentBusiness
      ){

        alert(
          "Les informations de l'établissement sont indisponibles."
        );

        return;

      }


      /* =====================================================
         CHECK WHATSAPP
         ===================================================== */

      if(
        !currentBusiness.whatsapp_number
      ){

        alert(
          "Le numéro WhatsApp n'est pas configuré."
        );

        return;

      }


      /* =====================================================
         CLEAN NUMBER
         ===================================================== */

      let number =
        String(
          currentBusiness.whatsapp_number
        )
        .replace(
          /\D/g,
          ""
        );


      if(
        number.startsWith("0")
      ){

        number =
          "213" +
          number.substring(1);

      }


      /* =====================================================
         BUILD MESSAGE
         ===================================================== */

      const businessName =
        currentBusiness.name ||
        "Business";


      let whatsappMessage =
`🔒 Retour privé — ${businessName}

⭐ Note : ${selectedRating}/5`;


      if(
        text.length > 0
      ){

        whatsappMessage +=
`

💬 Commentaire du client :
${text}`;

      }


      /* =====================================================
         BUTTON ANIMATION
         ===================================================== */

      button.classList.add(
        "sending"
      );


      button.innerHTML =
        "✓ Ouverture de WhatsApp…";


      /* =====================================================
         URL
         ===================================================== */

      const encodedMessage =
        encodeURIComponent(
          whatsappMessage
        );


      const whatsappURL =
        `https://wa.me/${number}?text=${encodedMessage}`;


      /* =====================================================
         OPEN
         ===================================================== */

      setTimeout(
        () => {

          window.location.href =
            whatsappURL;

        },
        450
      );

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCard();

</script>

</body>
</html>
